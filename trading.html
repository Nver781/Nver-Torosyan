:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: planning-board — a course catalog leads to one course at a time; each course has a Gantt strip of 8 modules, then theory / practice / test per module, a final exam and a certificate */
:root{
  --paper:#f3f5f4; --sheet:#ffffff; --ink:#14232b; --muted:#5b6b70; --line:#d5dddb;
  --accent:#1f6f5c; --accent-soft:#dcefe8; --milestone:#c9821b; --milestone-soft:#f8ead2;
  --ok:#2f7d3a; --bad:#b23a2e; --bad-soft:#f7e1de; --ok-soft:#e0f0e1;
  --c-tf:#1f6f5c; --c-ta:#2a5db0; --c-rm:#b0442e; --c-mk:#7a4fb8;
  --f-display:"Noto Serif Armenian",Georgia,serif;
  --f-body:"Noto Sans Armenian","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f171a; --sheet:#162125; --ink:#e4ecea; --muted:#9aaaa8; --line:#2a3a3e;
  --accent:#5cc7a8; --accent-soft:#173a32; --milestone:#e6a84a; --milestone-soft:#3a2c14;
  --ok:#6cc27a; --bad:#ec7b6e; --bad-soft:#3d1f1c; --ok-soft:#1c3520;
  --c-tf:#5cc7a8; --c-ta:#7aa6ec; --c-rm:#ec8a72; --c-mk:#b394e6; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f171a; --sheet:#162125; --ink:#e4ecea; --muted:#9aaaa8; --line:#2a3a3e;
  --accent:#5cc7a8; --accent-soft:#173a32; --milestone:#e6a84a; --milestone-soft:#3a2c14;
  --ok:#6cc27a; --bad:#ec7b6e; --bad-soft:#3d1f1c; --ok-soft:#1c3520;
  --c-tf:#5cc7a8; --c-ta:#7aa6ec; --c-rm:#ec8a72; --c-mk:#b394e6; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:clamp(28px,5vw,40px);font-weight:800}
h2{font-size:clamp(22px,3.5vw,26px);font-weight:700}
h3{font-size:19px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header.top{display:flex;flex-direction:column;gap:10px}
header.top .lead,.lead{color:var(--muted);max-width:70ch}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips a{text-decoration:none;color:var(--ink);padding:6px 13px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:var(--sheet);display:inline-flex;align-items:center;gap:7px}
.chips a .dot{width:9px;height:9px;border-radius:50%;background:var(--cc,var(--accent))}
.chips a.on{border-color:var(--cc,var(--accent));box-shadow:inset 0 0 0 1px var(--cc,var(--accent))}
.statrow{display:flex;flex-wrap:wrap;gap:22px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-size:22px;font-weight:500}
.stat span{font-size:13px;color:var(--muted)}
.course-head{display:flex;flex-direction:column;gap:12px;border-left:4px solid var(--cc,var(--accent));padding-left:14px}
.gantt{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto}
.gantt-grid{display:grid;grid-template-columns:repeat(8,minmax(92px,1fr));gap:6px;min-width:760px}
.g-head{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:0 4px}
.g-bar{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-align:left;border-radius:6px;padding:8px;cursor:pointer;font:inherit;font-size:13px;line-height:1.3;display:flex;flex-direction:column;gap:6px;min-height:84px}
.g-bar:hover{border-color:var(--cc,var(--accent))}
.g-bar.active{border-color:var(--cc,var(--accent));box-shadow:inset 0 0 0 1px var(--cc,var(--accent))}
.fill{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
.fill i{display:block;height:100%;background:var(--cc,var(--accent))}
.g-ms{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;gap:10px;flex-wrap:wrap}
.diamond{display:inline-block;width:9px;height:9px;background:var(--milestone);transform:rotate(45deg);margin-right:6px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{text-decoration:none;color:var(--ink);padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:var(--sheet)}
nav.tabs a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
section.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:clamp(16px,3vw,24px);display:flex;flex-direction:column;gap:18px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.cols>*{min-width:0}
.box{border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.course-card{background:var(--sheet);border:1px solid var(--line);border-top:4px solid var(--cc);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink)}
.course-card:hover{border-color:var(--cc)}
.course-card .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
ul,ol{margin:0;padding-left:22px}
li{margin:3px 0}
.lesson{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.lesson-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.lesson .body{max-width:76ch;display:flex;flex-direction:column;gap:8px;min-width:0}
.formula{font-family:var(--f-mono);background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:13.5px;overflow-x:auto;white-space:pre;max-width:100%}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer;user-select:none}
.chk input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap;align-self:flex-start}
.pill.ms{background:var(--milestone-soft);color:var(--milestone)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.sub-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sub-tabs button{appearance:none;border:0;background:none;font:inherit;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.sub-tabs button.on{color:var(--ink);border-bottom-color:var(--cc,var(--accent));font-weight:600}
textarea{width:100%;min-height:180px;font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;resize:vertical}
input[type=number],input[type=text]{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
input[type=number]{font-family:var(--f-mono)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--sheet);font:inherit;font-weight:600;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--milestone);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.q{border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q .opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.opt input{margin-top:5px;accent-color:var(--accent);flex:none}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.expl{font-size:14px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.result{font-size:18px;font-weight:600}
.feedback{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:15px}
.muted{color:var(--muted)}
.small{font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl{overflow-x:auto;max-width:100%}
.timer{font-family:var(--f-mono);font-size:20px}
.save-note{font-size:12px;color:var(--muted)}
.notice{background:var(--milestone-soft);border:1px solid var(--milestone);border-radius:8px;padding:12px 14px;font-size:14px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}

.req div{display:flex;gap:8px;align-items:center}

.req .mark.done{background:var(--ok);color:var(--sheet)}
.cert{border:2px solid var(--cc);outline:1px solid var(--cc);outline-offset:6px;border-radius:4px;padding:clamp(20px,5vw,48px);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--sheet);margin:10px}
.cert .cname{font-family:var(--f-display);font-size:clamp(26px,5vw,40px);font-weight:800;border-bottom:1px solid var(--line);padding:0 20px 6px;min-width:min(100%,320px)}
.cert .ctitle{font-family:var(--f-display);font-size:clamp(20px,3.5vw,28px);font-weight:700;color:var(--cc)}
.cert .seal{width:64px;height:64px;border-radius:50%;border:2px solid var(--cc);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;color:var(--cc)}
.cert-meta{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.cert-meta b{display:block;color:var(--ink);font-family:var(--f-mono);font-weight:500;font-size:15px}
.intro{background:var(--accent-soft);border-radius:10px;padding:clamp(14px,3vw,20px);display:flex;flex-direction:column;gap:12px}
.intro .box{background:var(--sheet)}
.intro table{background:var(--sheet);border-radius:6px}
.simple{border-left:3px solid var(--milestone);background:var(--milestone-soft);border-radius:0 8px 8px 0;padding:12px 14px;display:flex;flex-direction:column;gap:6px;max-width:76ch}
.pre{white-space:pre-wrap}
.lesson-content{display:flex;flex-direction:column;gap:12px}
.simple .btn{align-self:flex-start}
details.qa{border:1px dashed var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:10px;max-width:76ch}
details.qa[open]{border-style:solid;background:var(--paper)}
details.qa summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
details.qa[open] summary{margin-bottom:10px}
details.qa textarea{min-height:70px;margin-top:10px;background:var(--sheet)}
details.qa .row{margin-top:8px}
.qa-thread{display:flex;flex-direction:column;gap:8px}
.msg{white-space:pre-wrap;padding:10px 12px;border-radius:10px;font-size:15px;max-width:92%}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--sheet);border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--sheet);border:1px solid var(--line);border-bottom-left-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.backlink{font-size:14px;text-decoration:none;color:var(--muted)}.backlink:hover{color:var(--accent)}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink)}
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.method .box p{font-size:15px}

      <p><b>CFD</b> (Contract for Difference)՝ պայմանագիր բրոքերի հետ գնի տարբերության վրա. դու չես տիրապետում ակտիվին։ ԱՄՆ-ում retail հաճախորդների համար արգելված է, ԵՄ-ում խիստ սահմանափակված (տես մոդուլ 3)։</p>`},
    {t:"Ներդրում, թրեյդինգ և սպեկուլյացիա", h:"1 ժ", b:`<div class="tbl"><table><tr><th>Ոճ</th><th>Պահման ժամկետ</th><th>Ժամանակ օրական</th><th>Ծախսերի ազդեցություն</th></tr><tr><td>Scalping</td><td>Վայրկյաններ, րոպեներ</td><td>Ամբողջ օր</td><td>Շատ բարձր</td></tr><tr><td>Day trading</td><td>Մինչև օրվա վերջ</td><td>4–8 ժ</td><td>Բարձր</td></tr><tr><td>Swing trading</td><td>Օրեր, շաբաթներ</td><td>30–60 րոպե</td><td>Միջին</td></tr><tr><td>Position / trend</td><td>Շաբաթներ, ամիսներ</td><td>Շաբաթական մի քանի ժամ</td><td>Ցածր</td></tr><tr><td>Ներդրում (buy & hold)</td><td>Տարիներ</td><td>Ամսական մի քանի րոպե</td><td>Շատ ցածր</td></tr></table></div>
      <p><b>Դրական գումարով vs զրոյական գումարով խաղ.</b> Բաժնետոմսերի երկարաժամկետ պահումը մասնակցում է տնտեսության աճին և ընկերությունների շահույթին (դրական գումար)։ Կարճաժամկետ թրեյդինգը, ֆյուչերսները և օպցիոնները ծախսերից առաջ մոտավորապես զրոյական գումարով են (մեկի շահույթը մյուսի վնասն է), իսկ ծախսերից հետո՝ բացասական։ Սա չի նշանակում, որ թրեյդինգով անհնար է վաստակել, բայց նշանակում է, որ պետք է ունենալ ապացուցված առավելություն (edge)։</p>`}
  ],

  lessons:[
    {t:"Order book, spread և liquidity", h:"1 ժ", b:`<div class="formula">ASK (վաճառողներ)    100.06 × 500
                    100.05 × 300   ← լավագույն ask
BID (գնորդներ)      100.03 × 400   ← լավագույն bid
                    100.02 × 900
Spread = 100.05 − 100.03 = 0.02  (≈ 0.02%)</div>
      <ul><li><b>Bid</b>՝ ամենաբարձր գինը, որ գնորդը պատրաստ է վճարել. <b>Ask</b>՝ ամենացածրը, որով վաճառողը պատրաստ է վաճառել</li><li><b>Liquidity</b>՝ որքան հեշտ է գնել կամ վաճառել մեծ ծավալ առանց գինը շարժելու. նեղ spread և մեծ ծավալներ = բարձր liquidity</li><li><b>Slippage</b>՝ տարբերություն սպասված և փաստացի կատարման գնի միջև. մեծանում է նորությունների ժամանակ, բացման պահին և ցածր liquidity-ով ակտիվներում</li><li><b>Gap</b>՝ գինը բացվում է նախորդ փակումից զգալիորեն տարբեր. stop պատվերը կարող է կատարվել շատ ավելի վատ գնով</li></ul>`},
    {t:"Պատվերների տեսակները", h:"1.5 ժ", b:`<div class="tbl"><table><tr><th>Պատվեր</th><th>Ինչ է անում</th><th>Ռիսկ</th></tr>
      <tr><td>Market</td><td>Կատարվում է անմիջապես լավագույն հասանելի գնով</td><td>Slippage, հատկապես ցածր liquidity-ի դեպքում</td></tr>
      <tr><td>Limit</td><td>Գնել ոչ ավելի թանկ / վաճառել ոչ ավելի էժան, քան նշված գինը</td><td>Կարող է չկատարվել</td></tr>
      <tr><td>Stop (stop-market)</td><td>Երբ գինը հասնում է stop-ին, դառնում է market պատվեր</td><td>Gap-ի դեպքում կատարվում է շատ ավելի վատ գնով</td></tr>
      <tr><td>Stop-limit</td><td>Stop-ից հետո դառնում է limit պատվեր</td><td>Արագ անկման ժամանակ կարող է ընդհանրապես չկատարվել</td></tr>
      <tr><td>Trailing stop</td><td>Stop-ը շարժվում է գնի հետ ֆիքսված հեռավորությամբ</td><td>Աղմուկից շուտ դուրս գալ</td></tr>
      <tr><td>OCO / Bracket</td><td>Մեկը կատարվելիս մյուսը չեղարկվում է (take profit + stop)</td><td>Կարգավորման սխալներ</td></tr></table></div>
      <p><b>Ժամկետ.</b> Day (ուժի մեջ է մինչև օրվա վերջ), GTC (մինչև չեղարկում)։ <b>Կանոն.</b> Մուտք գործիր limit պատվերով, իսկ ելքի համար միշտ նախապես տեղադրիր stop. «Մտքում պահած» stop-ը stop չէ։</p>`},
    {t:"Գործարքի իրական ծախսը", h:"1.5 ժ", b:`<p>Ընդհանուր ծախս = կոմիսիոն + spread + slippage + ֆինանսավորում (swap, margin interest, crypto funding) + արժույթի փոխարկում + հարկեր։</p>
      <div class="formula">Օրինակ: հաշիվ $10 000, ամեն օր 2 գործարք (մուտք + ելք = round trip)
Մեկ round trip-ի ծախս ≈ 0.05% (spread + կոմիսիոն + slippage) × $10 000 = $5
Տարեկան ≈ 250 օր × 2 × $5 = $2 500 = հաշվի 25%-ը
→ Միայն ծախսերը փակելու համար պետք է տարեկան +25% համախառն շահույթ</div>
      <p><b>Եզրակացություն.</b> Ինչքան հաճախ ես առևտուր անում, այնքան մեծ առավելություն է պետք։ Ծախսերը միակ բանն են, որ վստահ գիտես նախապես։ Համեմատիր բրոքերներին ոչ միայն կոմիսիոնով, այլ նաև spread-ով, ֆինանսավորման տոկոսով և արժույթի փոխարկման վճարով։ «Զրո կոմիսիոն»-ը չի նշանակում զրո ծախս (payment for order flow, ավելի լայն spread)։</p>`}

{ n:3, aca:"Պաշտպանություն", title:"Բրոքեր, լծակ և կարգավորում", short:"Կարգավորում",
  goal:"Ընտրել կարգավորվող բրոքեր, հասկանալ margin-ը և լծակը և ճանաչել խարդախությունները։",
  lessons:[
    {t:"Ինչպես ընտրել բրոքեր", h:"1 ժ", b:`<ul><li><b>Կարգավորում.</b> ԱՄՆ՝ SEC և FINRA (հաճախորդի արժեթղթերը պաշտպանված են SIPC-ով մինչև $500 000 բրոքերի սնանկության դեպքում, ոչ թե շուկայական կորստից), Մեծ Բրիտանիա՝ FCA, ԵՄ՝ ազգային կարգավորողներ (CySEC, BaFin) ESMA-ի կանոններով, Հայաստան՝ ՀՀ Կենտրոնական բանկ (լիցենզավորված ներդրումային ընկերություններ և բանկեր)։ Ստուգիր լիցենզիան կարգավորողի կայքում, ոչ թե բրոքերի կայքում</li><li><b>Հաճախորդի միջոցների առանձնացում</b> (segregated accounts)</li><li><b>Իրական ակտիվ vs CFD.</b> Երկարաժամկետ ներդրման համար նախընտրելի է իրական բաժնետոմս/ETF</li><li><b>Ծախսեր</b>, հարթակի հուսալիություն, գումարի մուտքագրման և դուրսբերման պայմաններ, հարկային փաստաթղթեր</li></ul>
      <p>ՀՀ ԿԲ-ն պարբերաբար հրապարակում է զգուշացումներ առանց լիցենզիայի գործող ընկերությունների մասին։ Եթե ընկերությունը քեզ զանգում է և առաջարկում «անձնական մենեջեր» ու «երաշխավորված եկամուտ», դա կարմիր դրոշ է։</p>`},
    {t:"Margin, լծակ և margin call", h:"1.5 ժ", b:`<div class="formula">Լծակ 1:30, դիրք $30 000 → պահանջվող margin = $1 000
Գինը շարժվում է քո դեմ 1% → կորուստ $300 = margin-ի 30%
Գինը շարժվում է 3.3% → կորուստ ≈ ամբողջ margin-ը</div>
      <p><b>Լծակը չի փոխում գործարքի որակը, այն բազմապատկում է և՛ շահույթը, և՛ վնասը։</b> Margin call՝ երբ հաշվի կապիտալը իջնում է պահանջվող նվազագույնից, բրոքերը պահանջում է գումար կամ փակում է դիրքերը։</p>
      <div class="tbl"><table><tr><th>ESMA-ի սահմանափակումներ retail CFD-ների համար (2018-ից)</th><th>Առավելագույն լծակ</th></tr><tr><td>Հիմնական արժութային զույգեր</td><td>30:1</td></tr><tr><td>Այլ զույգեր, ոսկի, հիմնական ինդեքսներ</td><td>20:1</td></tr><tr><td>Այլ ապրանքներ, ոչ հիմնական ինդեքսներ</td><td>10:1</td></tr><tr><td>Առանձին բաժնետոմսեր</td><td>5:1</td></tr><tr><td>Կրիպտոարժույթներ</td><td>2:1</td></tr></table></div>
      <p>Լրացուցիչ՝ դիրքերի ավտոմատ փակում, երբ margin-ը իջնում է նվազագույնի 50%-ին, negative balance protection (չես կարող կորցնել ավելին, քան ներդրել ես) և ստանդարտ զգուշացում՝ քանի % retail հաշիվ է կորցնում գումար։ <b>ԱՄՆ.</b> FINRA-ն 2026 թ. հունիսի 4-ից (անցումային շրջանով մինչև 2027 թ. հոկտեմբեր) $25 000-ի «pattern day trader» կանոնը փոխարինել է intraday margin ստանդարտներով։ Սա ավելի հեշտ է դարձնում day trading-ը, բայց չի փոքրացնում ռիսկը։</p>`},
    {t:"Խարդախություններ և կարմիր դրոշներ", h:"1 ժ", b:`<ul><li>«Երաշխավորված» կամ «ամսական 20%» եկամուտ</li><li>Telegram/Instagram «signal» խմբեր, որոնք վաճառում են բաժանորդագրություն, բայց չեն ցույց տալիս ստուգելի track record</li><li>Գեղեցիկ screenshot-ներ առանց broker statement-ի</li><li>Ճնշում՝ «առաջարկը վավեր է միայն այսօր»</li><li>Ընկերություն, որը գրանցված է offshore և ՀՀ ԿԲ-ի կամ այլ հեղինակավոր կարգավորողի լիցենզիա չունի</li><li>Խնդրում են տեղադրել remote desktop ծրագիր (AnyDesk) «օգնելու համար»</li><li>Կրիպտոյում՝ pump-and-dump, rug pull, կեղծ app-եր, «recovery» ծառայություններ, որոնք խոստանում են վերադարձնել կորցրածը</li></ul>
      <p><b>Ստուգաթերթ.</b> Լիցենզիա (կարգավորողի կայքում) → փոքր գումարի դուրսբերման թեստ → պայմանագրի ընթերցում → երբեք մի տուր գաղտնաբառեր, 2FA կոդեր կամ seed phrase։</p>`}

{ n:4, aca:"Ապացույցներ", title:"Ինչ են ասում տվյալները", short:"Ապացույցներ",
  goal:"Իմանալ ակադեմիական և կարգավորողների տվյալները մանրածախ թրեյդինգի արդյունքների մասին և որտեղից կարող է գալ իրական առավելությունը։",
  lessons:[
    {t:"Մանրածախ թրեյդերների արդյունքները", h:"1.5 ժ", b:`<div class="tbl"><table><tr><th>Հետազոտություն</th><th>Տվյալներ</th><th>Արդյունք</th></tr>
      <tr><td>Barber & Odean, «Trading Is Hazardous to Your Wealth» (Journal of Finance, 2000)</td><td>66 465 ընտանիք, 1991–1996, ԱՄՆ discount broker</td><td>Միջին եկամտաբերություն 16.4% տարեկան vs շուկայի 17.9%. ամենաակտիվ թրեյդերները՝ 11.4%</td></tr>
      <tr><td>Chague, De-Losso, Giovannetti, «Day Trading for a Living?» (2019)</td><td>Բրազիլիա, 19 646 մարդ, ովքեր սկսել են day trading ֆյուչերսներով 2013–2015</td><td>300+ օր համառածների 97%-ը կորցրել է գումար. միայն 1.1%-ն է վաստակել նվազագույն աշխատավարձից ավելի. ուսուցման ապացույց չի գտնվել</td></tr>
      <tr><td>ESMA (2018)</td><td>ԵՄ կարգավորողների վերլուծություն CFD հաշիվների</td><td>Retail հաշիվների 74–89%-ը սովորաբար կորցնում է գումար</td></tr></table></div>
      <p><b>Ինչու է այդպես.</b> Ծախսեր, չափազանց հաճախ առևտուր, overconfidence, լծակ, disposition effect (շահույթը շուտ փակել, վնասը երկար պահել), պրոֆեսիոնալների հետ մրցակցություն։ Այս դասընթացի նպատակը ոչ թե քեզ վախեցնելն է, այլ սովորեցնելը, թե ինչպես չլինել միջին վիճակագրությունը։</p>`},
    {t:"Արդյունավետ շուկաներ և պասիվ ներդրում", h:"1 ժ", b:`<p><b>Efficient Market Hypothesis</b> (Eugene Fama)՝ գները արագ արտացոլում են հասանելի տեղեկատվությունը, ուստի համակարգված կերպով շուկային գերազանցելը դժվար է։ Շուկաները լիովին արդյունավետ չեն, բայց բավականաչափ արդյունավետ են, որ անհատի համար առավելությունը փոքր և թանկ լինի։</p>
      <div class="tbl"><table><tr><th>SPIVA (S&P Dow Jones Indices), ԱՄՆ large-cap ակտիվ ֆոնդեր, 2024-ի վերջ</th><th>Զիջել են S&P 500-ին</th></tr><tr><td>1 տարի</td><td>65%</td></tr><tr><td>5 տարի</td><td>76%</td></tr><tr><td>10 տարի</td><td>84%</td></tr><tr><td>15 տարի</td><td>≈ 90%</td></tr></table></div>
      <p>Եթե պրոֆեսիոնալ ֆոնդերի ճնշող մեծամասնությունը չի գերազանցում ինդեքսին, կապիտալի հիմնական մասի համար խելամիտ բազան է ցածր ծախսով, դիվերսիֆիկացված ինդեքսային ներդրումը։ Շատ պրոֆեսիոնալներ կիրառում են <b>core–satellite</b> մոտեցում՝ 80–90% պասիվ core, 10–20% ակտիվ «satellite» թրեյդինգի համար։</p>`},
    {t:"Որտեղից կարող է գալ առավելությունը (edge)", h:"1.5 ժ", b:`<ul><li><b>Ռիսկի պրեմիաներ</b>՝ պարգև ռիսկ կրելու համար. equity premium, value, momentum, carry, volatility premium։ Դրանք լավ ուսումնասիրված են, բայց ունեն երկար վատ ժամանակաշրջաններ</li><li><b>Վարքագծային</b>՝ այլ մասնակիցների համակարգված սխալներ (under-reaction նորություններին → momentum, over-reaction → reversal)</li><li><b>Կառուցվածքային</b>՝ ֆոնդերի ստիպողական գործողություններ (ինդեքսի rebalancing, rollover), hedging-ի պահանջարկ</li><li><b>Տեղեկատվական / վերլուծական</b>՝ ավելի լավ վերլուծություն փոքր, քիչ ուսումնասիրված ակտիվներում (բայց ոչ ներքին տեղեկատվություն՝ insider trading-ը անօրինական է)</li><li><b>Կարգապահություն և համբերություն</b>՝ երկար horizon, երբ մյուսները չեն կարող սպասել</li></ul>
      <div class="formula">Edge-ի ստուգում.  Ակնկալվող եկամուտ մեկ գործարքում − ծախսեր > 0
                  + բավարար թվով գործարքներ (100+)
                  + տրամաբանական բացատրություն՝ ինչու է այն գոյություն ունենում</div>`}
  ],
  practice:{t:"Case study՝ «Ինչու ես կարող եմ տարբերվել»", steps:["Կարդա Barber & Odean-ի կամ Chague et al.-ի հոդվածի ամփոփումը (աղբյուրներում)","Գրիր այն 3 պատճառները, որոնք քեզ ամենաշատն են վերաբերում (օր.՝ հաճախակի առևտուր, լծակ)","Ձևակերպիր մեկ հիպոթեզ քո ապագա edge-ի մասին և նշիր, թե որ կատեգորիային է այն պատկանում","Որոշիր քո core–satellite բաշխումը (օր.՝ 85/15) և հիմնավորիր"], deliverable:"Case study վերլուծություն, edge-ի հիպոթեզ, կապիտալի բաշխում"},

{ n:5, aca:"Մակրո և հիմնարար", title:"Մակրոտնտեսություն և հիմնարար վերլուծություն", short:"Մակրո",
  goal:"Հասկանալ տոկոսադրույքների, գնաճի և տնտեսական տվյալների ազդեցությունը շուկաների վրա և գնահատել ընկերության արժեքը։",
  lessons:[
    {t:"Տոկոսադրույքներ, գնաճ և կենտրոնական բանկեր", h:"1.5 ժ", b:`<ul><li><b>Կենտրոնական բանկերը</b> (Fed, ECB, ՀՀ ԿԲ) փոխում են քաղաքականության տոկոսադրույքը գնաճը վերահսկելու համար։ Բարձր տոկոսադրույքները սովորաբար ճնշում են բաժնետոմսերի գնահատականները և ամրացնում են արժույթը, ցածրերը՝ հակառակը</li><li><b>Պարտատոմսի գինը և եկամտաբերությունը շարժվում են հակառակ ուղղությամբ</b>. եթե տոկոսները աճում են, առկա պարտատոմսերի գները ընկնում են</li><li><b>Yield curve</b>՝ եկամտաբերությունը ըստ ժամկետների. շրջված կորը (կարճաժամկետը բարձր է երկարաժամկետից) պատմականորեն հաճախ նախորդել է ԱՄՆ ռեցեսիաներին, բայց ժամանակը անորոշ է</li><li><b>Իրական տոկոսադրույք</b> = անվանական − գնաճ</li><li><b>Դոլարի ինդեքս (DXY)</b>, նավթ, ոսկի՝ ռիսկի տրամադրության ցուցիչներ</li></ul>`},
    {t:"Տնտեսական օրացույց և ակնկալիքներ", h:"1 ժ", b:`<div class="tbl"><table><tr><th>Ցուցանիշ</th><th>Ինչ է չափում</th><th>Հաճախականություն</th></tr><tr><td>CPI / PCE</td><td>Գնաճ</td><td>Ամսական</td></tr><tr><td>NFP (Non-Farm Payrolls)</td><td>ԱՄՆ աշխատատեղեր</td><td>Ամսական, սովորաբար ամսվա առաջին ուրբաթ</td></tr><tr><td>FOMC որոշում</td><td>Fed-ի տոկոսադրույք</td><td>Տարեկան 8 անգամ</td></tr><tr><td>PMI</td><td>Արտադրության/ծառայությունների ակտիվություն</td><td>Ամսական</td></tr><tr><td>GDP</td><td>Տնտեսական աճ</td><td>Եռամսյակային</td></tr><tr><td>Earnings season</td><td>Ընկերությունների շահույթ</td><td>Եռամսյակային</td></tr></table></div>
      <p><b>Գլխավոր գաղափարը.</b> Շուկան արձագանքում է ոչ թե լավ կամ վատ լուրին, այլ <b>անակնկալին</b>՝ փաստացի թիվը ակնկալիքի (consensus) համեմատ։ Լավ թիվը կարող է գինն իջեցնել, եթե սպասվում էր ավելի լավը։ Նորությունների ժամանակ spread-ը լայնանում է, slippage-ը մեծանում. շատ պրոֆեսիոնալներ նոր դիրք չեն բացում հրապարակումից անմիջապես առաջ։</p>`},
    {t:"Ընկերության գնահատում՝ հիմունքներ", h:"1.5 ժ", b:`<div class="formula">P/E       = Գին / Շահույթ մեկ բաժնետոմսի վրա (EPS)
EV/EBITDA = (Կապիտալիզացիա + Զուտ պարտք) / EBITDA
FCF yield = Ազատ դրամական հոսք / Կապիտալիզացիա
DCF:  Արժեք = Σ FCFₜ / (1 + r)ᵗ  +  Վերջնական արժեք / (1 + r)ⁿ</div>
      <ul><li>Համեմատիր նույն ոլորտի ընկերությունների հետ և ընկերության սեփական պատմության հետ</li><li>Որակի ցուցանիշներ՝ եկամտի աճ, մարժա, ROIC, պարտքի մակարդակ, դրամական հոսքի կայունություն</li><li>DCF-ը շատ զգայուն է ենթադրությունների նկատմամբ (աճ, զեղչման դրույք). օգտագործիր սցենարներ, ոչ թե մեկ թիվ</li><li><b>Կրիպտոյում</b> ավանդական շահույթ չկա. գնահատում են tokenomics (առաջարկ, inflation, unlock-եր), օգտագործում, ցանցի ակտիվություն, ռիսկեր</li></ul>
      <p>Թրեյդերի համար հիմնարար վերլուծությունը օգնում է հասկանալ, թե <i>ինչ</i> գնել (որակ, արժեք), իսկ տեխնիկականը՝ <i>երբ</i> և <i>ինչքան</i>։</p>`}
  ],
  practice:{t:"Մակրո օրագիր և ընկերության մինի վերլուծություն", steps:["Բացիր տնտեսական օրացույց (Investing.com, ForexFactory) և նշիր հաջորդ շաբաթվա 5 կարևոր իրադարձություն","Մեկ իրադարձության համար գրանցիր consensus-ը, փաստացի թիվը և շուկայի արձագանքը (S&P 500, EUR/USD, ոսկի) 1 ժամում","Ընտրիր մեկ ընկերություն և հաշվիր P/E, EV/EBITDA, FCF yield՝ համեմատելով 2 մրցակցի հետ","Գրիր 5 նախադասությամբ՝ այն թանկ է, էժան, թե արդարացի գնահատված և ինչու"], deliverable:"Մակրո օրագիր, գնահատման աղյուսակ և եզրակացություն"},
  quiz:[
    ["Տոկոսադրույքները աճում են։ Առկա պարտատոմսերի գները սովորաբար...",["Աճում են","Ընկնում են","Չեն փոխվում","Կրկնապատկվում են"],1,"Գինը և եկամտաբերությունը հակադարձ են։"],

    ["DCF-ի հիմնական թուլությունը՝",["Չափազանց պարզ է","Շատ զգայուն է աճի և զեղչման դրույքի ենթադրությունների նկատմամբ","Չի օգտագործում դրամական հոսք","Միայն կրիպտոյի համար է"],1,"Օգտագործիր սցենարներ։"]

{ n:6, aca:"Գործընթաց", title:"Թրեյդինգ պլան, ժուռնալ և կանոնավոր պրակտիկա", short:"Պլան",
  goal:"Կազմել գրավոր թրեյդինգ պլան, վարել ժուռնալ և անցնել paper trading → փոքր իրական առևտուր ճիշտ հաջորդականությամբ։",
  lessons:[
    {t:"Թրեյդինգ պլանի կառուցվածքը", h:"1.5 ժ", b:`<div class="formula">1. Նպատակ և ժամանակ — ինչու, որքան ժամ շաբաթական, ինչ horizon
2. Շուկաներ — որ ակտիվներ (watchlist), որ ժամերին
3. Setup-ներ — մուտքի հստակ, ստուգելի կանոններ
4. Ելք — stop-loss, take profit, ժամանակային ելք
5. Դիրքի չափ — ռիսկը մեկ գործարքում (օր.՝ 0.5–1% կապիտալից)
6. Սահմանափակումներ — օրական/շաբաթական կորստի սահման, առավելագույն բաց ռիսկ

      <ul><li><b>Timeframe</b>՝ 1 րոպե, 1 ժամ, 1 օր, 1 շաբաթ. ինչքան փոքր է, այնքան ավելի շատ աղմուկ</li><li><b>Լոգարիթմական սանդղակ</b>՝ օգտագործիր երկար ժամանակաշրջանների և արագ աճող ակտիվների (BTC) համար. հավասար տոկոսային շարժումները ունեն հավասար բարձրություն</li><li><b>Adjusted prices</b>՝ բաժնետոմսերի գները պետք է ճշգրտված լինեն split-երի և դիվիդենդների համար, հակառակ դեպքում backtest-ը սխալ կլինի</li><li><b>Multi-timeframe</b>՝ ավելի բարձր timeframe-ը որոշում է ուղղությունը (օր.՝ շաբաթական), ցածրը՝ մուտքի ժամանակը (օրական). տարածված հարաբերակցություն՝ 4–6 անգամ</li></ul>`},
    {t:"Trend-ի օբյեկտիվ սահմանում", h:"1 ժ", b:`<div class="formula">Uptrend:   Higher Highs + Higher Lows   (HH, HL)
Downtrend: Lower Highs + Lower Lows     (LH, LL)
Մեխանիկական տարբերակ:  Close > 200-օրյա MA  և  50 MA > 200 MA  → uptrend</div>
      <p>«Աչքով» trend-ը սուբյեկտիվ է. տարբեր մարդիկ տարբեր բաներ են տեսնում նույն գրաֆիկում։ Թրեյդերի համար օգտակար է մեխանիկական սահմանումը, որը կարելի է backtest անել։ Trend-ը կարող է լինել տարբեր timeframe-ներում տարբեր. օրական գրաֆիկում uptrend, ժամայինում՝ կարճաժամկետ downtrend (pullback)։</p>
      <p><b>Ռեժիմներ.</b> trending, range (կողային), բարձր volatility։ Ռազմավարությունները աշխատում են տարբեր ռեժիմներում տարբեր կերպ. trend following-ը կորցնում է range-ում, mean reversion-ը՝ ուժեղ trend-ում։</p>`},
    {t:"Support, resistance և գոտիներ", h:"1 ժ", b:`<ul><li><b>Support</b>՝ գոտի, որտեղ նախկինում գնումները կանգնեցրել են անկումը. <b>Resistance</b>՝ որտեղ վաճառքները կանգնեցրել են աճը</li><li>Դրանք <b>գոտիներ</b> են, ոչ թե ճշգրիտ գծեր</li><li>Բեկված resistance-ը հաճախ դառնում է support (role reversal)</li><li>Կլոր թվեր (100, 50 000), նախորդ օրվա/շաբաթվա high/low, all-time high</li><li>Ինչքան շատ են մասնակիցները տեսնում մակարդակը, այնքան ավելի հաճախ են այնտեղ տեղադրվում stop-եր. դրա համար էլ հաճախ լինում են «false breakout»-ներ</li></ul>
      <p><b>Ապացույցների մասին.</b> Ակադեմիական հետազոտությունները գտնում են որոշ տեղեկատվություն գրաֆիկային օրինաչափություններում (Lo, Mamaysky, Wang, 2000), բայց սովորաբար ծախսերից հետո առավելությունը փոքր է կամ բացակայում։ Վերաբերվիր մակարդակներին որպես ռիսկի կառավարման գործիք (որտեղ դնել stop), ոչ թե որպես կանխատեսման երաշխիք։</p>`}
  ],

  lessons:[
    {t:"Moving averages և trend ինդիկատորներ", h:"1 ժ", b:`<div class="formula">SMA(n) = վերջին n փակումների միջինը
EMA:   EMAₜ = α·Pₜ + (1 − α)·EMAₜ₋₁ ,  α = 2 / (n + 1)
MACD = EMA(12) − EMA(26);  Signal = EMA(9) MACD-ից;  Histogram = MACD − Signal</div>
      <ul><li>MA-ն ուշանում է (lag). ավելի կարճ MA՝ ավելի արագ, բայց ավելի շատ կեղծ ազդանշաններ</li><li>Տարածված կանոններ՝ 200-օրյա MA-ից վեր/վար, 50/200 cross (golden/death cross)</li><li>Faber (2007, «A Quantitative Approach to Tactical Asset Allocation») ցույց տվեց, որ 10-ամսյա MA կանոնը պատմականորեն նվազեցրել է խոր անկումները՝ մոտ նույն եկամտաբերությամբ, բայց կան երկար ժամանակաշրջաններ, երբ այն զիջում է buy & hold-ին</li></ul>`},
    {t:"Momentum և oscillator-ներ", h:"1 ժ", b:`<div class="formula">RSI = 100 − 100 / (1 + RS),   RS = միջին աճ / միջին անկում (սովորաբար 14 ժամանակահատված)
RSI > 70 «overbought»,  RSI < 30 «oversold»</div>
      <p><b>Թակարդ.</b> Ուժեղ uptrend-ում RSI-ն կարող է շաբաթներով մնալ 70-ից վեր։ «Overbought» չի նշանակում «կընկնի»։ Oscillator-ները ավելի լավ են աշխատում range ռեժիմում կամ որպես trend-ի ներսում pullback-ի չափիչ (օր.՝ uptrend + RSI(2) < 10 → կարճաժամկետ գնման հնարավորություն, Larry Connors-ի ոճով)։</p>
      <p>Այլ momentum չափումներ՝ Rate of Change (ROC = Pₜ / Pₜ₋ₙ − 1), Stochastic։ 12-ամսյա ROC-ը (հաճախ բացառելով վերջին ամիսը) ակադեմիական momentum-ի հիմքն է։</p>`},
    {t:"Volatility՝ ATR և Bollinger Bands", h:"1 ժ", b:`<div class="formula">True Range = max(High − Low, |High − PrevClose|, |Low − PrevClose|)
ATR(14) = TR-ի միջինը 14 ժամանակահատվածում
Bollinger:  Միջին = SMA(20),  Գոտիներ = SMA ± 2σ</div>
      <ul><li><b>ATR</b>-ը ինդիկատորներից ամենաօգտակարն է ռիսկի համար. stop-ը տեղադրիր, օրինակ, 2×ATR հեռավորությամբ, որպեսզի այն համապատասխանի ակտիվի «նորմալ աղմուկին»</li><li><b>Bollinger squeeze</b>՝ գոտիների նեղացում = ցածր volatility, որին հաճախ հաջորդում է ընդլայնում</li><li><b>Կանոն</b>. ընտրիր մեկ ինդիկատոր յուրաքանչյուր հարցի համար (trend, momentum, volatility). 5 momentum ինդիկատորը միասին չեն ավելացնում տեղեկատվություն, միայն վստահության պատրանք</li></ul>`}
  ],

{ n:3, aca:"Ծավալ և կառուցվածք", title:"Ծավալ, VWAP, breakout-ներ և պատերներ", short:"Ծավալ",
  goal:"Օգտագործել ծավալը, VWAP-ը և breakout-ների տրամաբանությունը և քննադատաբար գնահատել գրաֆիկային պատերները։",
  lessons:[
    {t:"Ծավալ և VWAP", h:"1 ժ", b:`<div class="formula">VWAP = Σ (Գին × Ծավալ) / Σ Ծավալ   (հաշվարկվում է օրվա սկզբից)</div>
      <ul><li>Ծավալը ցույց է տալիս մասնակցությունը. breakout-ը բարձր ծավալով ավելի հավաստի է, քան ցածր ծավալով</li><li><b>Relative volume</b>՝ այսօրվա ծավալը միջինի նկատմամբ (օր.՝ 2× = երկու անգամ ավելի)</li><li><b>VWAP</b>-ը ինստիտուցիոնալ թրեյդերների ելակետն է. գնից վեր VWAP-ը ցույց է տալիս, որ օրվա գնորդները միջինում շահույթի մեջ են</li><li>Ֆորեքսում կենտրոնացված ծավալ չկա. օգտագործվում է tick volume կամ ֆյուչերսների ծավալը</li><li>Կրիպտոյում ծավալը կարող է արհեստականորեն ուռճացված լինել որոշ բորսաներում (wash trading)</li></ul>`},
    {t:"Breakout-ներ և false breakout-ներ", h:"1.5 ժ", b:`<p><b>Breakout</b>՝ գինը դուրս է գալիս range-ից կամ resistance-ից։ <b>Տրամաբանություն</b>. ակումուլյացիայից հետո նոր տեղեկատվությունը կամ պահանջարկը շարժում է գինը։</p>
      <div class="formula">Breakout ստուգաթերթ
□ Բարձր timeframe-ի trend-ը նույն ուղղությամբ է
□ Range-ը տևել է բավական երկար (կոնսոլիդացիա)
□ Ծավալը բեկման պահին ≥ 1.5× միջին

□ Ռիսկ/պարգև ≥ 1:2</div>
      <p><b>False breakout</b>-ները շատ են, որովհետև մակարդակի վերևում կուտակված են stop-եր և պատվերներ։ Որոշ թրեյդերներ առևտուր են անում հենց false breakout-ի դեմ (fade)։ Երկու մոտեցումն էլ պահանջում են backtest քո շուկայում և timeframe-ում։</p>`},

      <p><b>Գիտական մոտեցում.</b> Ամեն պատերն վերածիր ստուգելի կանոնի («եթե X, ապա մուտք, stop Y, ելք Z») և փորձարկիր 100+ դեպքի վրա։ Եթե չես կարող ծրագրավորել կամ ձեռքով օբյեկտիվ հաշվել, դու չգիտես՝ աշխատում է, թե ոչ։ Confirmation bias-ը ստիպում է հիշել հաջողված պատերները և մոռանալ ձախողվածները։</p>`}

  lessons:[
    {t:"Backtest-ի գործընթացը և metrics", h:"1.5 ժ", b:`<div class="formula">Հիպոթեզ → Կանոններ (100% օբյեկտիվ) → Տվյալներ (մաքուր, ճշգրտված)
→ In-sample փորձարկում → Out-of-sample ստուգում → Paper trading → Live</div>
      <div class="tbl"><table><tr><th>Metric</th><th>Բանաձև / իմաստ</th></tr><tr><td>CAGR</td><td>(Վերջնական / Սկզբնական)^(1/տարիներ) − 1</td></tr><tr><td>Max drawdown</td><td>Ամենամեծ անկումը գագաթից մինչև հատակ</td></tr><tr><td>Sharpe ratio</td><td>(Եկամտաբերություն − risk-free) / σ (տարեկանացված)</td></tr><tr><td>Win rate</td><td>Շահութաբեր գործարքների %</td></tr><tr><td>Profit factor</td><td>Համախառն շահույթ / համախառն վնաս</td></tr><tr><td>Expectancy (R)</td><td>Միջին արդյունք մեկ գործարքում՝ ռիսկի միավորներով</td></tr><tr><td>Գործարքների քանակ</td><td>Քիչ գործարքներ = բարձր անորոշություն</td></tr></table></div>
      <p>Բարձր win rate-ը ինքնին լավ չէ. 90% win rate-ով համակարգը կարող է կորցնել, եթե վնասները 10 անգամ մեծ են շահույթներից։</p>`},
    {t:"Կողմնակալություններ, որոնք սպանում են backtest-ը", h:"1.5 ժ", b:`<ul><li><b>Look-ahead bias</b>՝ օգտագործել տվյալ, որը այդ պահին հասանելի չէր (օր.՝ մուտք օրվա բացմանը՝ օգտագործելով նույն օրվա փակումը)</li><li><b>Survivorship bias</b>՝ փորձարկել միայն այսօր գոյություն ունեցող բաժնետոմսերի վրա՝ բացառելով սնանկացածները</li><li><b>Overfitting / curve fitting</b>՝ պարամետրերը այնքան ճշգրտել, որ համակարգը «անգիր» անի անցյալը</li><li><b>Data snooping</b>՝ փորձարկել 200 տարբերակ և ընտրել լավագույնը. պատահականորեն մեկը միշտ լավ կլինի</li><li><b>Ծախսերի և slippage-ի անտեսում</b></li><li><b>Ռեժիմի կախվածություն</b>՝ ամբողջ շահույթը մեկ տարվա մեջ</li></ul>
      <p>Bailey և López de Prado-ն («The Deflated Sharpe Ratio», 2014) ցույց են տալիս, թե ինչպես ճշգրտել Sharpe-ը փորձարկված տարբերակների քանակով։ Պարզ կանոն. ինչքան շատ ես փորձարկել, այնքան ավելի կասկածամիտ եղիր լավագույն արդյունքի նկատմամբ։</p>`},
    {t:"Out-of-sample, walk-forward և robustness", h:"1 ժ", b:`<ul><li><b>In-sample / out-of-sample</b>՝ օր.՝ 2010–2019-ում մշակում, 2020–2025-ում մեկ անգամ ստուգում. եթե out-of-sample-ից հետո փոխում ես պարամետրերը, այն այլևս out-of-sample չէ</li><li><b>Walk-forward</b>՝ պատուհանը տեղաշարժվում է. ուսուցում 3 տարի → ստուգում 1 տարի → տեղաշարժ</li><li><b>Parameter stability</b>՝ եթե MA(50)-ը աշխատում է, բայց MA(45)-ը և MA(55)-ը՝ ոչ, դա overfitting է. լավ համակարգը ունի «սարահարթ», ոչ թե «գագաթ»</li><li><b>Տարբեր շուկաներ</b>՝ trend following-ը պետք է աշխատի բազմաթիվ ակտիվների վրա, ոչ միայն մեկի</li><li><b>Monte Carlo</b>՝ գործարքների հաջորդականության խառնում՝ drawdown-ների բաշխումը տեսնելու համար</li></ul>
      <div class="formula">Ենթադրենք Sharpe ≈ 0.5, ապա t-stat ≈ Sharpe × √տարիներ
5 տարի → 0.5 × 2.24 ≈ 1.1  (վիճակագրորեն թույլ)
16 տարի → 0.5 × 4 = 2.0   (ավելի համոզիչ)</div>`}

  lessons:[
    {t:"Trend following և time-series momentum", h:"1.5 ժ", b:`<p><b>Moskowitz, Ooi, Pedersen, «Time Series Momentum» (Journal of Financial Economics, 2012)</b>. 58 liquid ֆյուչերսների վրա (ինդեքսներ, արժույթներ, ապրանքներ, պարտատոմսեր) ակտիվի անցյալ եկամտաբերությունը կանխատեսում է ապագան 1–12 ամսվա horizon-ում, մասնակի reversal-ով ավելի երկար ժամկետում։ Դիվերսիֆիկացված պորտֆելը լավագույնս է աշխատել ծայրահեղ շուկաներում։</p>
      <div class="formula">Պարզ TSMOM կանոն ամեն ամիս:
Եթե 12-ամսյա եկամտաբերությունը > 0 → long,  հակառակ դեպքում → short / կանխիկ
Դիրքի չափ ∝ 1 / volatility  (volatility targeting)</div>
      <p><b>Ռիսկեր.</b> Երկար կողային ժամանակաշրջաններ, կտրուկ reversal-ներ, շատ փոքր կորուստներ և քիչ մեծ շահույթներ (ցածր win rate՝ 35–45%)։ Հոգեբանորեն դժվար է։</p>`},
    {t:"Cross-sectional momentum և mean reversion", h:"1 ժ", b:`<ul><li><b>Cross-sectional momentum</b> (Jegadeesh & Titman, 1993)՝ գնել վերջին 3–12 ամսում ամենաուժեղ բաժնետոմսերը, վաճառել ամենաթույլերը։ Ռիսկ՝ «momentum crash»-ներ շուկայի կտրուկ շրջադարձերի ժամանակ (օր.՝ 2009)</li><li><b>Կարճաժամկետ reversal</b>՝ շատ կարճ horizon-ում (օրեր, շաբաթ) ծայրահեղ շարժումները հակված են մասնակիորեն վերադառնալու. առավելությունը հաճախ ուտվում է ծախսերով</li><li><b>Mean reversion trend-ի ներսում</b>՝ գնել կարճ pullback-ը (RSI(2) < 10), երբ գինը 200 MA-ից վեր է</li><li><b>Pairs trading</b>՝ երկու կապված ակտիվների գնային տարբերության վերադարձ (cointegration). կապը կարող է կոտրվել</li></ul>`},
    {t:"Carry, value և ռազմավարությունների համադրում", h:"1 ժ", b:`<ul><li><b>Carry</b>՝ պարգև բարձր եկամտաբերությամբ ակտիվ պահելու համար (FX-ում՝ բարձր տոկոսադրույքով արժույթ, ֆյուչերսներում՝ backwardation)։ Ռիսկ՝ կտրուկ անկումներ ճգնաժամերում («աստիճաններով վեր, վերելակով վար»)</li><li><b>Value</b>՝ էժան ակտիվներ (ցածր P/B, P/E) երկարաժամկետում. կարող է զիջել տարիներով</li><li><b>Համադրում</b>՝ Asness, Moskowitz, Pedersen («Value and Momentum Everywhere», 2013) ցույց են տալիս, որ value և momentum-ը բացասաբար կորելացված են. միասին ավելի կայուն են</li></ul>
      <p><b>Գլխավոր դաս.</b> Չկա ռազմավարություն, որը միշտ աշխատում է։ Յուրաքանչյուր հայտնի պրեմիա ունի տարիներ տևող վատ ժամանակաշրջաններ, և հենց դա է պատճառը, որ այն չի վերանում. շատերը հրաժարվում են վատ ժամանակաշրջանում։</p>`}

    {t:"ATR-ով stop և volatility-ի նորմալացում", h:"1 ժ", b:`<div class="formula">Stop հեռավորություն = k × ATR   (օր.՝ k = 2)

      <p>Այսպես յուրաքանչյուր դիրք ունի մոտավորապես հավասար ռիսկ՝ անկախ ակտիվի volatility-ից։ Սա է պատճառը, որ պրոֆեսիոնալ trend follower-ները (Turtle Traders-ի «N» միավորը) ավելի volatile ակտիվներում ավելի փոքր դիրքեր են բացում։ <b>Լծակը</b> հետևանք է, ոչ թե նպատակ. եթե stop-ը շատ մոտ է, հաշվարկը կարող է պահանջել մեծ դիրք. ստուգիր, որ առավելագույն դիրքի և margin-ի սահմանները չեն խախտվում։</p>`},
    {t:"Kelly criterion և ինչու օգտագործել դրա մի մասը", h:"1 ժ", b:`<div class="formula">Kelly f* = W − (1 − W) / R

      <p>Kelly-ն (1956) մաքսիմալացնում է կապիտալի երկարաժամկետ երկրաչափական աճը, <b>եթե ճշգրիտ գիտես</b> W-ն և R-ը։ Իրականում դրանք գնահատականներ են և փոխվում են։ Full Kelly-ն ունի շատ խոր drawdown-ներ, իսկ գնահատման սխալի դեպքում overbetting-ը կործանարար է։ Պրակտիկայում օգտագործում են <b>half կամ quarter Kelly</b> կամ ավելի պարզ 0.5–1% կանոն։ Kelly-ն օգտակար է որպես վերին սահման. եթե քո ռիսկը Kelly-ից բարձր է, դու վստահորեն overbet ես անում։</p>`}

  lessons:[
    {t:"Կորելյացիա և դիվերսիֆիկացիա", h:"1 ժ", b:`<div class="formula">Երկու ակտիվի պորտֆելի σ² = w₁²σ₁² + w₂²σ₂² + 2w₁w₂ρσ₁σ₂
ρ = +1 → դիվերսիֆիկացիա չկա,  ρ = 0 → զգալի նվազում,  ρ < 0 → ամենաուժեղ էֆեկտը</div>
      <ul><li>5 long դիրք տեխնոլոգիական բաժնետոմսերում + Nasdaq ֆյուչերս ≈ մեկ մեծ դիրք</li><li>Կրիպտոյում altcoin-ների մեծ մասը ուժեղ կորելացված է BTC-ի հետ</li><li><b>Ճգնաժամերում կորելյացիաները աճում են</b>. դիվերսիֆիկացիան թուլանում է հենց այն պահին, երբ ամենաշատն է պետք (2008, 2020 մարտ)</li><li>Իրական դիվերսիֆիկացիա՝ տարբեր ակտիվների դասեր, տարբեր ռազմավարություններ, տարբեր timeframe-ներ</li></ul>`},
    {t:"Պորտֆելի սահմանափակումներ", h:"1 ժ", b:`<div class="tbl"><table><tr><th>Սահմանափակում</th><th>Օրինակ</th></tr><tr><td>Ռիսկ մեկ գործարքում</td><td>≤ 1%</td></tr><tr><td>Ընդհանուր բաց ռիսկ (բոլոր stop-երի գումարը)</td><td>≤ 5–6%</td></tr><tr><td>Կորելացված դիրքեր (նույն ոլորտ/թեմա)</td><td>≤ 3% ընդհանուր ռիսկ</td></tr><tr><td>Կոնցենտրացիա մեկ ակտիվում</td><td>≤ 20% կապիտալի</td></tr><tr><td>Օրական կորստի սահման</td><td>−2% → դադար մինչև վաղը</td></tr><tr><td>Ամսական drawdown</td><td>−6% → ռիսկը կիսել, վերանայում</td></tr></table></div>
      <p>Այս թվերը ելակետային օրինակներ են. ճշգրտիր ըստ քո ռազմավարության volatility-ի։ Կարևորը՝ սահմանափակումները գրավոր են և կիրառվում են ավտոմատ, ոչ թե տրամադրությամբ։</p>`},
    {t:"Gap, tail risk և VaR-ի սահմանափակումները", h:"1 ժ", b:`<ul><li><b>Gap risk</b>՝ earnings, լուրեր, շաբաթ-կիրակի. stop-ը չի պաշտպանում gap-ից։ Լուծում՝ փոքր դիրքեր earnings-ից առաջ, օպցիոններով hedging, կամ գործարքից դուրս գալ</li><li><b>Fat tails</b>՝ ծայրահեղ շարժումները ավելի հաճախ են լինում, քան normal բաշխումն է կանխատեսում (1987-ի հոկտեմբերի 19-ին S&P 500-ը ընկավ ≈ 20% մեկ օրում)</li><li><b>VaR</b> (Value at Risk)՝ «95% հավանականությամբ օրական կորուստը չի գերազանցի X»-ը. չի ասում, թե որքան կլինի մնացած 5%-ում. լրացրու <b>Expected Shortfall</b>-ով և stress test-երով</li><li><b>Stress test</b>՝ ինչ կլինի պորտֆելին, եթե կրկնվի 2008-ը, 2020-ի մարտը, 2022-ի կրիպտո անկումը (−75% BTC)</li><li><b>Կոնտրագենտի ռիսկ</b>՝ բորսայի կամ բրոքերի սնանկություն (FTX, 2022). մի պահիր ամբողջ կապիտալը մեկ տեղում</li></ul>`}

{ n:4, aca:"Վարքագծային ֆինանսներ", title:"Վարքագծային ֆինանսներ՝ ինչու ենք սխալվում", short:"Հոգեբանություն",
  goal:"Ճանաչել թրեյդինգում ամենավնասակար ճանաչողական կողմնակալությունները և դրանց դեմ գործնական միջոցներ կիրառել։",
  lessons:[
    {t:"Prospect theory և loss aversion", h:"1 ժ", b:`<p><b>Kahneman & Tversky, «Prospect Theory» (Econometrica, 1979)</b>. Մարդիկ գնահատում են արդյունքները ոչ թե բացարձակ, այլ որևէ ելակետի (reference point) նկատմամբ, և կորուստը «ցավում է» մոտավորապես երկու անգամ ավելի, քան նույն չափի շահույթը ուրախացնում է։</p>
      <ul><li>Շահույթի դաշտում մենք ռիսկից խուսափում ենք → <b>շուտ ենք փակում շահույթը</b></li><li>Կորստի դաշտում մենք ռիսկ ենք փնտրում → <b>պահում ենք վնասաբեր դիրքը</b>՝ «հետ կգա» հույսով, կամ «միջինացնում» ենք</li></ul>
      <p>Kahneman-ի «Thinking, Fast and Slow» գիրքը բացատրում է System 1 (արագ, ինտուիտիվ) և System 2 (դանդաղ, վերլուծական) մտածողությունը։ Թրեյդինգ պլանը և checklist-ը System 2-ի գործիքներ են։</p>`},
    {t:"Disposition effect, overconfidence և այլ թակարդներ", h:"1.5 ժ", b:`<div class="tbl"><table><tr><th>Կողմնակալություն</th><th>Ինչպես է երևում</th><th>Հակաթույն</th></tr>
      <tr><td>Disposition effect (Odean, 1998)</td><td>Վաճառում ես շահույթները, պահում վնասները</td><td>Նախապես ֆիքսված stop և ելքի կանոն</td></tr>
      <tr><td>Overconfidence</td><td>Չափազանց հաճախ առևտուր, մեծ դիրքեր հաջողությունից հետո</td><td>Ռիսկի սահմաններ, վիճակագրություն ժուռնալից</td></tr>
      <tr><td>Recency bias</td><td>Վերջին 3 գործարքը որոշում է ամեն ինչ</td><td>Գնահատիր 50+ գործարքով</td></tr>
      <tr><td>Confirmation bias</td><td>Փնտրում ես միայն հաստատող լուրեր</td><td>Գրիր «ինչը կապացուցի, որ սխալ եմ»</td></tr>
      <tr><td>Sunk cost</td><td>«Արդեն այսքան եմ կորցրել, չեմ փակի»</td><td>Հարց. «Կբացեի՞ այս դիրքը հիմա»</td></tr>
      <tr><td>FOMO / herding</td><td>Գնում ես, որովհետև բոլորն են գնում</td><td>Միայն պլանի setup-ներ</td></tr>
      <tr><td>Revenge trading</td><td>Վնասից անմիջապես հետո մեծ գործարք</td><td>Օրական կորստի սահման և դադար</td></tr></table></div>`},
    {t:"Ինչպես կառավարել զգացմունքները", h:"1 ժ", b:`<ul><li><b>Pre-commitment</b>՝ որոշումները կայացրու շուկայից դուրս (երեկոյան պլան), կատարիր շուկայում (պատվերներ նախապես)</li><li><b>If-then պլաններ</b> (implementation intentions, Gollwitzer)՝ «Եթե 2 վնաս անընդմեջ, ապա 30 րոպե դադար և ժուռնալ»</li><li><b>Ավտոմատացում</b>՝ bracket պատվերներ, ալերտներ էկրանին նայելու փոխարեն</li><li><b>Դիրքի չափը որպես զգացմունքի կարգավորիչ</b>՝ եթե չես կարողանում քնել, դիրքը շատ մեծ է</li><li><b>Ֆիզիոլոգիա</b>՝ քուն, սթրես, ալկոհոլ. Coates-ի հետազոտությունները (The Hour Between Dog and Wolf) ցույց են տալիս, որ սթրեսի հորմոնները ազդում են թրեյդերների ռիսկի ընկալման վրա</li><li><b>Զգացմունքների ժուռնալ</b>՝ գրանցիր զգացմունքը գործարքից առաջ և հետո. կտեսնես օրինաչափություններ</li></ul>`}
  ],
  practice:{t:"Կողմնակալությունների աուդիտ", steps:["Վերանայիր քո ժուռնալը կամ անցյալի ներդրումային որոշումները և գտիր 3 կողմնակալության օրինակ","Յուրաքանչյուրի համար գրիր if-then կանոն","Ստեղծիր զգացմունքների սյունակ ժուռնալում (1–5 սանդղակ)","Գրիր քո «անձնական թակարդների» ցուցակը և կախիր աշխատանքային տեղում"], deliverable:"Աուդիտ, if-then կանոններ, անձնական թակարդների ցուցակ"},

    {t:"Բախտ vs հմտություն", h:"1 ժ", b:`<p>Michael Mauboussin-ը («The Success Equation») առաջարկում է հարց. «Կարո՞ղ ես միտումնավոր պարտվել»։ Եթե այո, հմտությունը կարևոր է։ Կարճ ժամանակահատվածում շուկայի արդյունքները հիմնականում պատահական են։</p>

  lessons:[
    {t:"Պայմանագրի բնութագիր", h:"1 ժ", b:`<div class="tbl"><table><tr><th>Պայմանագիր (CME)</th><th>Բազմապատկիչ</th><th>Tick</th><th>Tick-ի արժեք</th></tr><tr><td>E-mini S&P 500 (ES)</td><td>$50 × ինդեքս</td><td>0.25</td><td>$12.50</td></tr><tr><td>Micro E-mini S&P 500 (MES)</td><td>$5 × ինդեքս</td><td>0.25</td><td>$1.25</td></tr><tr><td>Gold (GC)</td><td>100 ունցիա</td><td>$0.10</td><td>$10</td></tr><tr><td>Micro Gold (MGC)</td><td>10 ունցիա</td><td>$0.10</td><td>$1</td></tr></table></div>

  lessons:[
    {t:"Call, put և payoff", h:"1.5 ժ", b:`<div class="formula">Call — իրավունք ԳՆԵԼ strike գնով մինչև (կամ մարման օրը)
Put  — իրավունք ՎԱՃԱՌԵԼ strike գնով
1 ԱՄՆ բաժնետոմսի օպցիոն = 100 բաժնետոմս

Long call payoff մարման օրը = max(0, S − K) − premium
Long put payoff             = max(0, K − S) − premium
Օրինակ: K = 100, premium = $3 → break-even = 103
S = 110 → (110 − 100 − 3) × 100 = +$700
S = 95  → −$300 (առավելագույն վնասը premium-ն է)</div>
      <p><b>Intrinsic value</b>՝ որքան արժե օպցիոնը, եթե այսօր կատարվի. <b>Time value</b>՝ մնացածը, որը նվազում է մարմանը մոտենալիս։ <b>Գնորդը</b> ունի սահմանափակ ռիսկ (premium), <b>վաճառողը</b> ստանում է premium, բայց կարող է ունենալ շատ մեծ (naked call-ի դեպքում՝ անսահմանափակ) ռիսկ։</p>`},
    {t:"Greeks և implied volatility", h:"1 ժ", b:`<div class="tbl"><table><tr><th>Greek</th><th>Ինչ է չափում</th><th>Օրինակ</th></tr><tr><td>Delta (Δ)</td><td>Օպցիոնի գնի փոփոխությունը բաժնետոմսի $1 շարժման դեպքում</td><td>Δ = 0.5 → $0.50</td></tr><tr><td>Gamma (Γ)</td><td>Delta-ի փոփոխության արագությունը</td><td>Բարձր է ATM-ում, մարմանը մոտ</td></tr><tr><td>Theta (Θ)</td><td>Ժամանակի արժեքի կորուստ օրական</td><td>Θ = −0.05 → −$5/օր 1 պայմանագրի համար</td></tr><tr><td>Vega (ν)</td><td>Զգայունություն implied volatility-ի նկատմամբ</td><td>IV +1% → +$0.12</td></tr></table></div>
      <p><b>Implied volatility (IV)</b>՝ շուկայի ակնկալիքը ապագա տատանումների մասին, որը «թաքնված» է օպցիոնի գնում (Black-Scholes մոդել)։ Earnings-ից առաջ IV-ն բարձրանում է, հետո կտրուկ ընկնում («IV crush»). կարող ես ճիշտ գուշակել ուղղությունը և դեռ կորցնել։ Պատմականորեն IV-ն միջինում մի փոքր բարձր է եղել իրական volatility-ից (volatility risk premium), բայց վաճառողները կրում են tail ռիսկ։</p>`},
    {t:"Պարզ ռազմավարություններ", h:"1 ժ", b:`<div class="tbl"><table><tr><th>Ռազմավարություն</th><th>Կառուցվածք</th><th>Երբ</th><th>Ռիսկ</th></tr><tr><td>Protective put</td><td>Բաժնետոմս + long put</td><td>Պաշտպանություն անկումից (ապահովագրություն)</td><td>Premium-ի ծախս</td></tr><tr><td>Covered call</td><td>Բաժնետոմս + short call</td><td>Լրացուցիչ եկամուտ, չեզոք/թեթև աճ</td><td>Սահմանափակված վերելք, անկման ռիսկը մնում է</td></tr><tr><td>Bull call spread</td><td>Long call K1 + short call K2 (K2 > K1)</td><td>Չափավոր աճ</td><td>Սահմանափակ՝ զուտ premium</td></tr><tr><td>Bear put spread</td><td>Long put K2 + short put K1</td><td>Չափավոր անկում</td><td>Սահմանափակ</td></tr><tr><td>Cash-secured put</td><td>Short put + կանխիկ</td><td>Գնել ավելի էժան</td><td>Ստիպված գնել ընկնող բաժնետոմս</td></tr></table></div>
      <p><b>Կանոն սկսնակի համար.</b> Միայն defined-risk ռազմավարություններ (որտեղ առավելագույն վնասը հայտնի է նախապես)։ Naked short օպցիոնները՝ միայն փորձառու և լավ կապիտալիզացված թրեյդերների համար։ Օպցիոնների գործարքները հաճախ ունեն լայն spread. օգտագործիր limit պատվերներ։</p>`}

/* ========== STATE ========== */
const blankC=()=>({lessons:{},practice:{},labs:{},notes:{},feedback:{},quiz:{},final:null,extra:{},extraQuiz:null,start:null,cert:null,explain:{},qa:{},gen:{},guide:{}});
let S={v:3,name:"",c:{},migrated:false};
let db=null, docRef=null, sample=null, downloads=null, saveTimer=null;
const LS_KEY=ACAD.ls;

function normalize(raw){
  if(!raw||typeof raw!=="object")return;
  if(raw.v===3){S=Object.assign({v:3,name:"",c:{},migrated:false},raw);}
  else{ // v1 / v2: old single PM course
    const pm=blankC(); pm.notes=raw.notes||{}; pm.start=raw.start||null;
    S={v:3,name:"",c:{pm},migrated:true};
  }
  CID.forEach(id=>{S.c[id]=Object.assign(blankC(),S.c[id]||{});});
}
CID.forEach(id=>{S.c[id]=blankC();});
try{const r=localStorage.getItem(LS_KEY); if(r) normalize(JSON.parse(r)); }catch(e){}
const st=id=>S.c[id];

function persist(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
  writeHubSummary();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    if(docRef){try{await docRef.set({state:JSON.stringify(S),updated:Date.now()}); setNote("Առաջընթացը պահպանված է քո հաշվում");}catch(e){setNote("Առաջընթացը պահպանված է միայն այս բրաուզերում");}}
  },700);
}
function setNote(t){document.getElementById("saveNote").textContent=t;}
setNote("Առաջընթացը պահպանվում է այս բրաուզերում");

(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [d,u,s,dl]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample"),claude.use("downloads")]);
    sample=s; downloads=dl;
    if(d&&u){
      const id=await u.id();
      if(id){
        docRef=d.doc("data/users/"+id+"/"+ACAD.db);
        const snap=await docRef.get();
        if(snap.exists){const v=snap.data(); if(v&&v.state){try{normalize(JSON.parse(v.state));}catch(e){}}}
        await docRef.set({state:JSON.stringify(S),updated:Date.now()});
        try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
        setNote("Առաջընթացը պահպանվում է քո հաշվում և հասանելի է ցանկացած սարքից");
      }
    }
    render();
  }catch(e){setNote("Առաջընթացը պահպանվում է այս բրաուզերում"); render();}

/* ========== HELPERS ========== */
const $=(s,r=document)=>r.querySelector(s);
function el(tag,attrs={},html){const e=document.createElement(tag);for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const quizPass=(c,w)=>{const q=st(c.id).quiz[w.n];return !!(q&&q.best>=Math.ceil(w.quiz.length*PASS_QUIZ));};
function weekProgress(c,w){
  const s=st(c.id); const total=w.lessons.length+2; let done=0;
  w.lessons.forEach((_,i)=>{if(s.lessons[w.n+"-"+i])done++;});
  if(s.practice[w.n])done++; if(quizPass(c,w))done++;
  return {done,total,pct:Math.round(done/total*100)};
}
function courseStats(c){
  const s=st(c.id); let d=0,t=0;
  c.weeks.forEach(w=>{const p=weekProgress(c,w);d+=p.done;t+=p.total;});
  t+=1; if(s.final&&s.final.pass)d++;
  return {
    pct:Math.round(d/t*100),
    lessons:c.weeks.reduce((a,w)=>a+w.lessons.filter((_,i)=>s.lessons[w.n+"-"+i]).length,0),
    lessonsTotal:c.weeks.reduce((a,w)=>a+w.lessons.length,0),
    practice:c.weeks.filter(w=>s.practice[w.n]).length,
    quizzes:c.weeks.filter(w=>quizPass(c,w)).length,
    final:s.final
  };
}
function certReady(c){const k=courseStats(c);return {quizzes:k.quizzes===c.weeks.length,practice:k.practice>=PRACTICE_MIN,final:!!(k.final&&k.final.pass)};}
const nextWeek=c=>{for(const w of c.weeks){if(weekProgress(c,w).pct<100)return w.n;}return c.weeks.length;};
function fmtDate(d,opt){try{return new Date(d).toLocaleDateString("hy-AM",opt||{day:"numeric",month:"long",year:"numeric"});}catch(e){return new Date(d).toDateString();}}
function stripHtml(h){const d=document.createElement("div");d.innerHTML=h;return d.textContent.replace(/\s+/g," ").trim();}

/* ========== ROUTING ========== */
function route(){
  const h=(location.hash||"").slice(1);
  const m=h.match(new RegExp("^("+CID.join("|")+")(?:-(w\\d+|exam|extra|cert))?$"));
  if(!m)return{v:"home"};
  const c=course(m[1]); const sub=m[2]||"";
  if(sub.startsWith("w"))return{v:"week",c,n:Math.max(1,Math.min(+sub.slice(1),c.weeks.length))};
  if(sub==="exam")return{v:"exam",c};
  if(sub==="extra"&&c.extra)return{v:"extra",c};
  if(sub==="cert")return{v:"cert",c};
  return{v:"course",c};
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});

function fmtWeek(start,n){const d=new Date(start);d.setDate(d.getDate()+(n-1)*7);return fmtDate(d,{day:"numeric",month:"short"});}

/* ========== RENDER ========== */
function render(){
  const r=route(); renderChips(r); renderCourseHead(r);
  const v=$("#view"); v.innerHTML="";
  if(r.c)v.style.setProperty("--cc",`var(--c-${r.c.id})`);
  if(r.v==="home")v.appendChild(viewHome());
  else if(r.v==="course")v.appendChild(viewCourse(r.c));
  else if(r.v==="week")v.appendChild(viewWeek(r.c,r.c.weeks[r.n-1]));
  else if(r.v==="exam")v.appendChild(viewExam(r.c));
  else if(r.v==="extra")v.appendChild(viewExtra(r.c));
  else if(r.v==="cert")v.appendChild(viewCert(r.c));
}

/* Q&A thread: ask anything you did not understand */
function qaBox(c,qkey,context,label,open){
  const s=st(c.id);
  const d=el("details",{class:"qa"}); if(open)d.open=true;
  d.appendChild(el("summary",{},`${label}${s.qa[qkey]&&s.qa[qkey].length?` <span class="mono small muted">(${Math.ceil(s.qa[qkey].length/2)})</span>`:""}`));
  const thread=el("div",{class:"qa-thread"});
  const draw=()=>{thread.innerHTML="";(s.qa[qkey]||[]).forEach(m=>{const b=el("div",{class:"msg "+(m.r==="u"?"u":"a")});b.textContent=m.t;thread.appendChild(b);});};
  draw();
  const ta=el("textarea",{class:"qa-in",id:"qa-"+qkey.replace(/[^a-z0-9]/gi,"-"),placeholder:ACAD.qaPh});
  const send=el("button",{class:"btn small"},"Հարցնել");
  const clear=el("button",{class:"btn small ghost"},"Մաքրել զրույցը");
  const status=el("span",{class:"small muted"});
  send.addEventListener("click",async()=>{
    const q=ta.value.trim(); if(!q){ta.focus();return;}
    s.qa[qkey]=(s.qa[qkey]||[]).concat({r:"u",t:q}); ta.value=""; draw();
    const bubble=el("div",{class:"msg a"}); bubble.textContent="Մտածում եմ…"; thread.appendChild(bubble);
    send.disabled=true; status.textContent="";
    let hist=s.qa[qkey].slice(-12); if(hist[0].r!=="u")hist=hist.slice(1);
    const msgs=hist.map((m,i)=>({role:m.r==="u"?"user":"assistant",content:i===0?`Դու ${c.title} ոլորտի համբերատար դասախոս ես։ Ուսանողը սկսնակ է։ Պատասխանիր հայերեն, պարզ, կոնկրետ օրինակներով, պարզ տեքստով առանց markdown նշանների։ Անգլերեն տերմինները բացատրիր։ Եթե հարցը դասից դուրս է, բայց կապված է ոլորտի հետ, միևնույն է պատասխանիր։ Եթե չգիտես կամ փաստը կարող է փոխված լինել, ասա այդ մասին։\n\nԿոնտեքստ՝\n${context}\n\nՈւսանողի հարցը՝ ${m.t}`:m.t}));
    if(msgs[0].role!=="user")msgs.shift();
    try{const r=await sample(msgs,{modelTier:"default",cache:false,onText:({text})=>{bubble.textContent=text;}});
      s.qa[qkey].push({r:"a",t:r.text}); s.qa[qkey]=s.qa[qkey].slice(-30); persist(); draw();}
    catch(e){bubble.textContent=e&&e.code==="not_granted"?"Հարց ու պատասխանը հասանելի չէ այս դիտման մեջ։":"Չհաջողվեց պատասխանել։ Փորձիր նորից։"; s.qa[qkey].pop(); ta.value=q;}
    send.disabled=false;
  });
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))send.click();});
  clear.addEventListener("click",()=>{delete s.qa[qkey];persist();draw();});
  const row=el("div",{class:"row"}); row.append(send,clear,status);
  d.append(thread,ta,row); return d;
}

let examState={};
function viewExam(c){
  const s=st(c.id);
  const sec=el("section",{class:"panel"});

  sec.appendChild(el("div",{},`<span class="eyebrow">Ավարտական քննություն</span><h2>${c.title}</h2><p class="muted" style="margin-top:6px">${total} հարց (${c.final.length} սցենարային + ${c.examExtra} պատահական մոդուլային թեստերից) · ${c.examMin} րոպե · անցողիկ՝ ${PASS_FINAL}%</p>`));
  if(s.final)sec.appendChild(el("p",{},`Վերջին արդյունք՝ <b class="mono">${s.final.score}%</b> ${s.final.pass?'<span class="pill ok">Անցած է</span>':'<span class="pill ms">Չի անցել</span>'}`));

  const ex=examState[c.id];

    sec.appendChild(el("div",{class:"row"})).appendChild(el("button",{class:"btn",onclick:()=>{
      const pool=[];c.weeks.forEach(w=>w.quiz.forEach(q=>pool.push(q)));
      for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
      examState[c.id]={qs:c.final.concat(pool.slice(0,c.examExtra)),end:Date.now()+c.examMin*60000};render();}},"Սկսել քննությունը"));
    return sec;
  }
  const tm=el("p",{class:"timer"}); sec.appendChild(tm);
  const runner=quizRunner(ex.qs,(sc)=>{clearInterval(iv);const pct=Math.round(sc/ex.qs.length*100);s.final={score:pct,pass:pct>=PASS_FINAL,date:Date.now()};persist();renderCourseHead(route());delete examState[c.id];
    if(pct>=PASS_FINAL){const r=certReady(c);sec.appendChild(el("div",{class:"notice"},r.quizzes&&r.practice?`<span>Շնորհավորում եմ։ Բոլոր պահանջները կատարված են։</span><a class="btn small" href="#${c.id}-cert">Ստանալ սերտիֆիկատը</a>`:`<span>Քննությունն անցած է։ Սերտիֆիկատի համար ավարտիր մնացած պահանջները։</span><a class="btn small ghost" href="#${c.id}-cert">Տեսնել պահանջները</a>`));}
  },Math.ceil(ex.qs.length*PASS_FINAL/100));
  const tick=()=>{const left=Math.max(0,ex.end-Date.now());const m=Math.floor(left/60000),sc=Math.floor(left%60000/1000);tm.textContent=`Մնացած ժամանակ՝ ${String(m).padStart(2,"0")}:${String(sc).padStart(2,"0")}`;if(left<=0){clearInterval(iv);runner._submit();}};
  const iv=setInterval(()=>{if(!document.body.contains(tm)){clearInterval(iv);return;}tick();},1000); tick();
  sec.appendChild(runner);
  return sec;
}

      out.textContent=`PERT E = ${E.toFixed(2)}    Triangular = ${T.toFixed(2)}    σ = ${sd.toFixed(2)}\n68%՝ ${(E-sd).toFixed(1)} – ${(E+sd).toFixed(1)}\n95%՝ ${(E-2*sd).toFixed(1)} – ${(E+2*sd).toFixed(1)}`;};

    const out=el("div",{class:"formula"}); b.appendChild(out); const f=n=>Math.round(n).toLocaleString("en-US");
    const calc=()=>{const BAC=+$("#bac",b).value,PV=+$("#pv",b).value,AC=+$("#ac",b).value,pc=+$("#pc",b).value/100;const EV=pc*BAC,CPI=EV/AC,SPI=EV/PV,EAC=BAC/CPI;
      out.textContent=`EV  = ${f(EV)}\nCV  = ${f(EV-AC)}   ${EV-AC<0?"(գերծախս)":"(խնայողություն)"}\nSV  = ${f(EV-PV)}   ${EV-PV<0?"(ուշացում)":"(առաջ)"}\nCPI = ${CPI.toFixed(2)}    SPI = ${SPI.toFixed(2)}\nEAC = ${f(EAC)}\nETC = ${f(EAC-AC)}\nVAC = ${f(BAC-EAC)}\nTCPI = ${((BAC-EV)/(BAC-AC)).toFixed(2)}`;};

    const calc=()=>{const v=vi.value.split(/[,\s]+/).map(Number).filter(x=>x>0);const bl=+$("#bl",b).value;const wip=+$("#wip",b).value,thr=+$("#thr",b).value;
      let t="";if(v.length){const avg=v.reduce((a,x)=>a+x,0)/v.length,mx=Math.max(...v),mn=Math.min(...v);t+=`Միջին velocity = ${avg.toFixed(1)}\nԿանխատեսում՝ ${Math.ceil(bl/mx)}–${Math.ceil(bl/mn)} sprint (միջինով՝ ${Math.ceil(bl/avg)})\n\n`;}
      t+=thr>0?`Little's Law: Cycle time = ${wip} / ${thr} = ${(wip/thr).toFixed(1)} շաբաթ`:"";out.textContent=t;};
    b.addEventListener("input",calc); calc(); return b;},
  rice(){const b=el("div",{class:"box"}); b.appendChild(el("h3",{},"RICE հաշվիչ"));
    const g=el("div",{class:"cols"}); g.append(numField("rr","Reach (օգտատեր/եռամսյակ)",2000),numField("ri","Impact (0.25–3)",2),numField("rc","Confidence (%)",80),numField("re","Effort (person-month)",4)); b.appendChild(g);
    const out=el("div",{class:"formula"}); b.appendChild(out);
    const calc=()=>{const R=+$("#rr",b).value,I=+$("#ri",b).value,C=+$("#rc",b).value/100,E=+$("#re",b).value;out.textContent=E>0?`RICE = (${R} × ${I} × ${C}) / ${E} = ${(R*I*C/E).toFixed(0)}`:"Effort-ը պետք է լինի 0-ից մեծ";};
    b.addEventListener("input",calc); calc(); return b;},
  interview(c){const b=el("div",{class:"box"}); b.appendChild(el("h3",{},`Փորձնական հարցազրույց՝ ${ROLE[c.id]}`));
    if(!sample){b.appendChild(el("p",{class:"small muted"},"AI հարցազրույցը հասանելի չէ այս դիտման մեջ։ Օգտագործիր դասերում նշված հարցերը և պատասխանիր գրավոր։"));return b;}
    const types=["վարքային (STAR)","սցենարային","տեխնիկական","case study"]; let qtext=""; let count=0;
    const qbox=el("div",{class:"feedback"}); qbox.textContent="Սեղմիր «Նոր հարց»՝ սկսելու համար։";
    const ta=el("textarea",{id:"iv-"+c.id,placeholder:"Քո պատասխանը…",style:"min-height:140px"});
    const fb=el("div",{class:"feedback"}); fb.hidden=true;
    const nq=el("button",{class:"btn ghost"},"Նոր հարց"), ev=el("button",{class:"btn"},"Գնահատել պատասխանը");
    nq.addEventListener("click",async()=>{nq.disabled=true;fb.hidden=true;ta.value="";const t=types[count++%types.length];qbox.textContent="Պատրաստում եմ հարցը…";
      try{const r=await sample(`Դու ${ROLE[c.id]} պաշտոնի համար հարցազրույց վարող փորձառու hiring manager ես ${ACAD.ivOrg}։ Տուր ՄԵԿ ${t} հարց junior/middle մակարդակի թեկնածուի համար։ Պատասխանիր միայն հարցով, հայերեն, առանց նախաբանի։ Պատահական թեմա՝ ${Math.random().toString(36).slice(2,6)}`,{modelTier:"quick",cache:false});qtext=r.text.trim();qbox.textContent=qtext;}
      catch(e){qbox.textContent="Չհաջողվեց ստանալ հարց։ Փորձիր նորից։";}nq.disabled=false;});
    ev.addEventListener("click",async()=>{if(!qtext||!ta.value.trim()){fb.hidden=false;fb.textContent="Նախ ստացիր հարց և գրիր պատասխանդ։";return;}ev.disabled=true;fb.hidden=false;fb.textContent="Գնահատում եմ…";
      try{const r=await sample(`Դու ${ROLE[c.id]} պաշտոնի հարցազրույց վարող ես։ Հարց՝ «${qtext}»\nԹեկնածուի պատասխան՝ """${ta.value.slice(0,6000)}"""\nԳնահատիր հայերեն, պարզ տեքստով (առանց markdown). Գնահատական X/10, ինչ էր լավ, ինչ պակասեց, ինչպես կհնչեր ուժեղ պատասխանը (կարճ օրինակ)։`,{modelTier:"default",cache:false,onText:({text})=>{fb.textContent=text;}});fb.textContent=r.text;}
      catch(e){fb.textContent="Չհաջողվեց գնահատել։ Փորձիր նորից։";}ev.disabled=false;});
    const row=el("div",{class:"row"}); row.append(nq,ev);
    b.append(qbox,ta,row,fb); return b;}
};

Object.assign(TOOLS,EXTRA_TOOLS);
render();
</script>
