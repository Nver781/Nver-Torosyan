<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: planning-board — a course catalog leads to one course at a time; each course has a Gantt strip of 8 modules, then theory / practice / test per module, a final exam and a certificate */
:root{
  --paper:#f3f5f4; --sheet:#ffffff; --ink:#14232b; --muted:#5b6b70; --line:#d5dddb;
  --accent:#0f6a7a; --accent-soft:#dbedf0; --milestone:#c9821b; --milestone-soft:#f8ead2;
  --ok:#2f7d3a; --bad:#b23a2e; --bad-soft:#f7e1de; --ok-soft:#e0f0e1;
  --c-pmp:#0f6a7a; --c-p2:#7a4fb8; --c-psm:#2a63b8; --c-gen:#a85a1c;
  --f-display:"Noto Serif Armenian",Georgia,serif;
  --f-body:"Noto Sans Armenian","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f171a; --sheet:#162125; --ink:#e4ecea; --muted:#9aaaa8; --line:#2a3a3e;

  --ok:#6cc27a; --bad:#ec7b6e; --bad-soft:#3d1f1c; --ok-soft:#1c3520;
  --c-pmp:#5cbfd0; --c-p2:#b394e6; --c-psm:#7aa8ec; --c-gen:#e6a065; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f171a; --sheet:#162125; --ink:#e4ecea; --muted:#9aaaa8; --line:#2a3a3e;
  --accent:#5cbfd0; --accent-soft:#16363c; --milestone:#e6a84a; --milestone-soft:#3a2c14;
  --ok:#6cc27a; --bad:#ec7b6e; --bad-soft:#3d1f1c; --ok-soft:#1c3520;
  --c-pmp:#5cbfd0; --c-p2:#b394e6; --c-psm:#7aa8ec; --c-gen:#e6a065; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:clamp(28px,5vw,40px);font-weight:800}
h2{font-size:clamp(22px,3.5vw,26px);font-weight:700}
h3{font-size:19px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header.top{display:flex;flex-direction:column;gap:10px}
header.top .lead,.lead{color:var(--muted);max-width:70ch}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips a{text-decoration:none;color:var(--ink);padding:6px 13px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:var(--sheet);display:inline-flex;align-items:center;gap:7px}
.chips a .dot{width:9px;height:9px;border-radius:50%;background:var(--cc,var(--accent))}
.chips a.on{border-color:var(--cc,var(--accent));box-shadow:inset 0 0 0 1px var(--cc,var(--accent))}
.statrow{display:flex;flex-wrap:wrap;gap:22px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-size:22px;font-weight:500}
.stat span{font-size:13px;color:var(--muted)}
.course-head{display:flex;flex-direction:column;gap:12px;border-left:4px solid var(--cc,var(--accent));padding-left:14px}
.gantt{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto}
.gantt-grid{display:grid;grid-template-columns:repeat(8,minmax(92px,1fr));gap:6px;min-width:760px}
.g-head{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:0 4px}
.g-bar{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-align:left;border-radius:6px;padding:8px;cursor:pointer;font:inherit;font-size:13px;line-height:1.3;display:flex;flex-direction:column;gap:6px;min-height:84px}
.g-bar:hover{border-color:var(--cc,var(--accent))}
.g-bar.active{border-color:var(--cc,var(--accent));box-shadow:inset 0 0 0 1px var(--cc,var(--accent))}
.fill{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
.fill i{display:block;height:100%;background:var(--cc,var(--accent))}
.g-ms{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;gap:10px;flex-wrap:wrap}
.diamond{display:inline-block;width:9px;height:9px;background:var(--milestone);transform:rotate(45deg);margin-right:6px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{text-decoration:none;color:var(--ink);padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:var(--sheet)}
nav.tabs a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
section.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:clamp(16px,3vw,24px);display:flex;flex-direction:column;gap:18px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.cols>*{min-width:0}
.box{border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.course-card{background:var(--sheet);border:1px solid var(--line);border-top:4px solid var(--cc);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink)}
.course-card:hover{border-color:var(--cc)}
.course-card .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
ul,ol{margin:0;padding-left:22px}
li{margin:3px 0}
.lesson{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.lesson-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.lesson .body{max-width:76ch;display:flex;flex-direction:column;gap:8px;min-width:0}
.formula{font-family:var(--f-mono);background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:13.5px;overflow-x:auto;white-space:pre;max-width:100%}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer;user-select:none}
.chk input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap;align-self:flex-start}
.pill.ms{background:var(--milestone-soft);color:var(--milestone)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.sub-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sub-tabs button{appearance:none;border:0;background:none;font:inherit;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.sub-tabs button.on{color:var(--ink);border-bottom-color:var(--cc,var(--accent));font-weight:600}
textarea{width:100%;min-height:180px;font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;resize:vertical}
input[type=number],input[type=text]{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
input[type=number]{font-family:var(--f-mono)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--sheet);font:inherit;font-weight:600;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--milestone);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.q{border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q .opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.opt input{margin-top:5px;accent-color:var(--accent);flex:none}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.expl{font-size:14px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.result{font-size:18px;font-weight:600}
.feedback{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:15px}
.muted{color:var(--muted)}
.small{font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl{overflow-x:auto;max-width:100%}
.timer{font-family:var(--f-mono);font-size:20px}
.save-note{font-size:12px;color:var(--muted)}
.notice{background:var(--milestone-soft);border:1px solid var(--milestone);border-radius:8px;padding:12px 14px;font-size:14px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.req{display:flex;flex-direction:column;gap:6px}
.req div{display:flex;gap:8px;align-items:center}
.req .mark{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;background:var(--line);color:var(--muted)}
.req .mark.done{background:var(--ok);color:var(--sheet)}
.cert{border:2px solid var(--cc);outline:1px solid var(--cc);outline-offset:6px;border-radius:4px;padding:clamp(20px,5vw,48px);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--sheet);margin:10px}
.cert .cname{font-family:var(--f-display);font-size:clamp(26px,5vw,40px);font-weight:800;border-bottom:1px solid var(--line);padding:0 20px 6px;min-width:min(100%,320px)}
.cert .ctitle{font-family:var(--f-display);font-size:clamp(20px,3.5vw,28px);font-weight:700;color:var(--cc)}
.cert .seal{width:64px;height:64px;border-radius:50%;border:2px solid var(--cc);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;color:var(--cc)}
.cert-meta{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.cert-meta b{display:block;color:var(--ink);font-family:var(--f-mono);font-weight:500;font-size:15px}
.intro{background:var(--accent-soft);border-radius:10px;padding:clamp(14px,3vw,20px);display:flex;flex-direction:column;gap:12px}
.intro .box{background:var(--sheet)}
.intro table{background:var(--sheet);border-radius:6px}
.simple{border-left:3px solid var(--milestone);background:var(--milestone-soft);border-radius:0 8px 8px 0;padding:12px 14px;display:flex;flex-direction:column;gap:6px;max-width:76ch}
.pre{white-space:pre-wrap}
.lesson-content{display:flex;flex-direction:column;gap:12px}
.simple .btn{align-self:flex-start}
details.qa{border:1px dashed var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:10px;max-width:76ch}
details.qa[open]{border-style:solid;background:var(--paper)}
details.qa summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
details.qa[open] summary{margin-bottom:10px}
details.qa textarea{min-height:70px;margin-top:10px;background:var(--sheet)}
details.qa .row{margin-top:8px}
.qa-thread{display:flex;flex-direction:column;gap:8px}
.msg{white-space:pre-wrap;padding:10px 12px;border-radius:10px;font-size:15px;max-width:92%}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--sheet);border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--sheet);border:1px solid var(--line);border-bottom-left-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.backlink{font-size:14px;text-decoration:none;color:var(--muted)}.backlink:hover{color:var(--accent)}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink)}
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.method .box p{font-size:15px}

<script>
try{if(window.parent!==window&&window.parent.HUB)document.getElementById("backlink").hidden=true;}catch(e){}
/* ========== PM 1: PMP ========== */
const PMP = { id:"pmp", title:"PMP նախապատրաստում (PMBOK 8, 2026 ECO)", short:"PMP",
lead:"PMI-ի Project Management Professional քննության նախապատրաստում՝ 2026-ի հուլիսից գործող Examination Content Outline-ի (People, Process, Business Environment) և PMBOK® Guide 8-րդ հրատարակության հիման վրա՝ predictive, agile և hybrid մոտեցումներով։",
weeks:[
{ n:1, aca:"Քննություն և PMBOK 8", title:"PMP քննությունը և PMBOK 8-ի կառուցվածքը", short:"Ներածություն",
  goal:"Իմանալ քննության ձևաչափը, իրավասության պահանջները, PMBOK 8-ի սկզբունքները, performance domain-ները և կազմել նախապատրաստման պլան։",
  lessons:[
    {t:"Քննության ձևաչափը (2026-ի հուլիսի 9-ից)", h:"1 ժ", b:`<div class="tbl"><table><tr><th>Պարամետր</th><th>Արժեք</th></tr><tr><td>Հարցեր</td><td>180 (170 գնահատվող + 10 չգնահատվող pretest)</td></tr><tr><td>Ժամանակ</td><td>240 րոպե</td></tr><tr><td>People</td><td>33%</td></tr><tr><td>Process</td><td>41%</td></tr><tr><td>Business Environment</td><td>26%</td></tr><tr><td>Մոտեցումներ</td><td>≈ 40% predictive, ≈ 60% agile և hybrid՝ ինտեգրված բոլոր domain-ներում</td></tr><tr><td>Հարցերի տեսակներ</td><td>Սցենարային multiple choice, multiple response, matching, hotspot, լրացում</td></tr></table></div>
      <p><b>Իրավասություն</b> (ստուգիր pmi.org-ում, քանի որ պահանջները թարմացվում են). 35 ժամ նախագծերի կառավարման ուսուցում + նախագծեր ղեկավարելու փորձ (սովորաբար 36 ամիս բակալավրի աստիճանի դեպքում կամ 60 ամիս միջնակարգ կրթության դեպքում)։ Այս դասընթացի դասերը, թեստերը և գործնականները օգնում են նախապատրաստվել, բայց PMI-ի պաշտոնական 35 ժամը պետք է ստանալ PMI-ի կողմից ընդունվող մատակարարից։</p>`},
    {t:"PMBOK® Guide 8-րդ հրատարակություն", h:"1.5 ժ", b:`<div class="tbl"><table><tr><th>6 սկզբունք</th><th>7 performance domain</th><th>5 focus area</th></tr><tr><td>Adopt a holistic view<br>Focus on value<br>Embed quality<br>Lead accountably<br>Integrate sustainability<br>Build empowered teams</td><td>Governance<br>Scope<br>Schedule<br>Finance<br>Stakeholders<br>Resources<br>Risk</td><td>Initiating<br>Planning<br>Executing<br>Monitoring & Controlling<br>Closing</td></tr></table></div>
      <p>PMBOK 8-ը (2025-ի վերջ) համադրում է 7-րդ հրատարակության սկզբունքային մոտեցումը և գործնական <b>40 ոչ պարտադրող (non-prescriptive) process</b>-ները։ Այն շեշտում է արժեքը, tailoring-ը (մոտեցման հարմարեցումը նախագծին), կայունությունը և AI-ի դերը նախագծերի կառավարման մեջ։</p>
      <p><b>Կարևոր.</b> PMP-ն քննություն է ECO-ի (Examination Content Outline) վրա, ոչ թե մեկ գրքի։ PMBOK-ը հիմնական, բայց ոչ միակ աղբյուրն է. ագիլ հարցերի համար կարևոր են նաև Agile Practice Guide-ը և Scrum Guide-ը։</p>`},
    {t:"«PMI mindset»՝ ինչպես մտածել քննության ժամանակ", h:"1 ժ", b:`<ul><li><b>Servant leader</b>՝ աջակցիր թիմին, հեռացրու խոչընդոտները, մի՛ հրամայիր</li><li><b>Նախ վերլուծիր, հետո գործիր</b>՝ «assess, analyze, review» սովորաբար գալիս է «escalate» կամ «change»-ից առաջ</li><li><b>Proactive</b>՝ ռիսկերը կանխիր, մի՛ սպասիր, որ դառնան խնդիր</li><li><b>Հետևիր գործընթացին</b>՝ փոփոխությունները՝ change control-ով (predictive) կամ backlog-ով (agile)</li><li><b>Խոսիր անմիջապես</b>՝ կոնֆլիկտը լուծիր անձամբ և առաջին հերթին մասնակիցների հետ, ոչ թե email-ով կամ sponsor-ին բողոքելով</li><li><b>Արժեք և բիզնես նպատակներ</b>՝ որոշումները գնահատիր benefits-ով</li><li><b>Էթիկա</b>՝ PMI Code of Ethics. պատասխանատվություն, հարգանք, արդարություն, ազնվություն</li></ul>`}
  ],

{ n:2, aca:"People", title:"People՝ առաջնորդություն և թիմ", short:"People",
  goal:"Կառավարել թիմը, կոնֆլիկտները, մոտիվացիան և շահակիցների ներգրավվածությունը PMI-ի ակնկալիքներով։",
  lessons:[
    {t:"Թիմի զարգացում և առաջնորդություն", h:"1.5 ժ", b:`<ul><li><b>Tuckman</b>՝ Forming → Storming → Norming → Performing → Adjourning</li><li><b>Situational leadership</b> (Hersey-Blanchard)՝ directing, coaching, supporting, delegating՝ ըստ թիմի անդամի հմտության և մոտիվացիայի</li><li><b>Servant leadership</b>՝ agile միջավայրում PM-ը/Scrum Master-ը ծառայում է թիմին</li><li><b>Emotional intelligence</b> (Goleman)՝ ինքնաճանաչում, ինքնակառավարում, սոցիալական գիտակցում, հարաբերությունների կառավարում</li><li><b>Team charter</b>՝ արժեքներ, աշխատանքի կանոններ, որոշումների կայացում, հաղորդակցություն</li><li><b>Psychological safety</b> (Amy Edmondson, Google Project Aristotle)՝ թիմի արդյունավետության ամենաուժեղ կանխատեսիչներից</li></ul>`},
    {t:"Կոնֆլիկտներ և բանակցություններ", h:"1 ժ", b:`<div class="tbl"><table><tr><th>Thomas-Kilmann ռեժիմ</th><th>Արդյունք</th><th>Երբ</th></tr><tr><td>Collaborating / Problem solving</td><td>Win-win</td><td>Լավագույնը երկարաժամկետ, երբ կա ժամանակ</td></tr><tr><td>Compromising</td><td>Մասնակի win-win</td><td>Հավասար ուժեր, ժամանակի ճնշում</td></tr><tr><td>Smoothing / Accommodating</td><td>Lose-win</td><td>Հարաբերությունները կարևոր են, հարցը՝ փոքր</td></tr><tr><td>Forcing / Directing</td><td>Win-lose</td><td>Արտակարգ իրավիճակ, անվտանգություն</td></tr><tr><td>Withdrawing / Avoiding</td><td>Lose-lose</td><td>Ժամանակավոր՝ «սառեցնելու» համար</td></tr></table></div>
      <p>Քննությունում սովորաբար ճիշտն է <b>collaborating</b>-ը։ Բանակցություններում՝ Harvard Negotiation Project-ի «Getting to Yes» սկզբունքները. առանձնացրու մարդկանց խնդրից, կենտրոնացիր շահերի, ոչ թե դիրքորոշումների վրա, ստեղծիր տարբերակներ, օգտագործիր օբյեկտիվ չափանիշներ, իմացիր քո BATNA-ն։</p>`},
    {t:"Շահակիցներ և հաղորդակցություն", h:"1 ժ", b:`<div class="formula">Power/Interest grid:
  Բարձր ուժ + բարձր հետաքրքրություն → Manage closely
  Բարձր ուժ + ցածր հետաքրքրություն  → Keep satisfied
  Ցածր ուժ + բարձր հետաքրքրություն  → Keep informed
  Ցածր ուժ + ցածր հետաքրքրություն   → Monitor
Engagement levels: Unaware → Resistant → Neutral → Supportive → Leading
Հաղորդակցության ալիքներ = n(n − 1) / 2</div>
      <p><b>Stakeholder engagement assessment matrix</b>՝ ներկա (C) և ցանկալի (D) մակարդակներ յուրաքանչյուր շահակցի համար։ Հաղորդակցության տեսակներ՝ interactive (հանդիպում), push (email, հաշվետվություն), pull (wiki, dashboard)։ Agile-ում՝ information radiators (task board, burndown), sprint review։</p>`}

  practice:{t:"People case study", steps:["Նկարագրիր իրական կամ մտացածին նախագծի թիմ և որոշիր Tuckman-ի փուլը","Գրիր team charter 6 կետով","Կազմիր stakeholder register և power/interest grid 8 շահակցով","Լուծիր կոնֆլիկտային սցենար. երկու ավագ մասնագետ չեն համաձայնում տեխնիկական լուծման շուրջ. գրիր քայլերը","Հաշվիր հաղորդակցության ալիքները, եթե թիմը աճում է 8-ից 12"], deliverable:"Team charter, stakeholder register, grid, կոնֆլիկտի լուծում", tools:["channels"]},

{ n:3, aca:"Process (predictive)", title:"Process՝ scope, schedule, cost, quality, procurement", short:"Predictive",
  goal:"Կիրառել predictive պլանավորում՝ WBS, CPM, գնահատում, EVM, որակ, պայմանագրեր և change control։",
  lessons:[
    {t:"Scope և schedule", h:"1.5 ժ", b:`<ul><li><b>Scope baseline</b> = scope statement + WBS + WBS dictionary. <b>100% կանոն</b>՝ WBS-ը ներառում է ամբողջ աշխատանքը. ամենացածր մակարդակը՝ work package</li><li><b>Կախվածություններ</b>՝ FS, SS, FF, SF. mandatory, discretionary, external. lead և lag</li><li><b>Critical Path Method</b>՝ ամենաերկար ճանապարհը. float = 0</li></ul>
      <div class="formula">Forward pass: ES, EF = ES + Duration
Backward pass: LF, LS = LF − Duration
Total float = LS − ES = LF − EF
Crashing — ռեսուրսներ ավելացնել critical path-ում (ծախսը աճում է)
Fast tracking — զուգահեռացնել (ռիսկը աճում է)</div>`},
    {t:"Cost և Earned Value", h:"1.5 ժ", b:`<div class="formula">EV = % ավարտված × BAC
CV = EV − AC        SV = EV − PV
CPI = EV / AC       SPI = EV / PV        (< 1 վատ, > 1 լավ)
EAC = BAC / CPI                  (ներկա արդյունավետությունը կշարունակվի)
EAC = AC + (BAC − EV)            (շեղումը եզակի էր)
EAC = AC + (BAC − EV)/(CPI×SPI)  (երկուսն էլ ազդում են)
ETC = EAC − AC     VAC = BAC − EAC     TCPI = (BAC − EV)/(BAC − AC)</div>
      <p><b>Գնահատման մեթոդներ</b>՝ analogous (արագ, ոչ ճշգրիտ), parametric (միավորի գին × քանակ), bottom-up (ամենաճշգրիտ), three-point (PERT = (O + 4M + P)/6)։ <b>Reserves</b>՝ contingency (հայտնի ռիսկերի համար, PM-ի վերահսկողության տակ, մտնում է cost baseline-ի մեջ) և management reserve (անհայտ ռիսկեր, sponsor-ի հաստատմամբ, մտնում է բյուջեի մեջ, բայց ոչ baseline-ի)։</p>`},
    {t:"Quality, procurement և change control", h:"1 ժ", b:`<ul><li><b>Quality</b>՝ cost of quality (prevention + appraisal vs internal + external failure), Pareto (80/20), fishbone, control chart (rule of seven՝ 7 կետ միջինի մի կողմում = անկանոնություն), grade vs quality</li><li><b>Պայմանագրեր</b>՝ Fixed Price (ռիսկը վաճառողի վրա), Cost Reimbursable (ռիսկը գնորդի վրա, CPFF, CPIF, CPAF), Time & Materials (փոքր, անորոշ scope)</li><li><b>Integrated change control</b>՝ փոփոխության հարցում → ազդեցության վերլուծություն → CCB → որոշում → baseline-ի թարմացում → հաղորդում։ Մի՛ կատարիր փոփոխությունը նախքան հաստատումը (gold plating-ը նույնպես սխալ է)</li><li><b>Փակում</b>՝ ընդունում, lessons learned, պայմանագրերի փակում, ռեսուրսների ազատում, արխիվ</li></ul>`}
  ],
  practice:{t:"Predictive պլան՝ WBS, CPM, EVM", steps:["Կազմիր WBS փոքր նախագծի համար (օր.՝ գրասենյակի տեղափոխություն)՝ 3 մակարդակով","Կազմիր 8 activity-ի ցանց տևողություններով և հաշվիր critical path-ը, float-երը","Հաշվիր PERT-ը 3 activity-ի համար","Լուծիր EVM case. BAC = 200 000, PV = 80 000, AC = 90 000, ավարտված 35%","Գրիր change request ձևանմուշ"], deliverable:"WBS, ցանցային դիագրամ, CPM հաշվարկ, EVM վերլուծություն", tools:["cpm","evm","pert"]},

  goal:"Ընտրել և հարմարեցնել մոտեցումը (tailoring), կառավարել backlog-ը, iteration-ները և hybrid նախագծերը։",
  lessons:[
    {t:"Մոտեցման ընտրություն և tailoring", h:"1 ժ", b:`<div class="tbl"><table><tr><th>Գործոն</th><th>Predictive</th><th>Agile</th></tr><tr><td>Պահանջների կայունություն</td><td>Բարձր</td><td>Ցածր, փոփոխվող</td></tr><tr><td>Առաքում</td><td>Մեկ անգամ վերջում</td><td>Հաճախակի, incremental</td></tr><tr><td>Փոփոխության գին</td><td>Բարձր (շինարարություն)</td><td>Ցածր (ծրագրային ապահովում)</td></tr><tr><td>Ռիսկ</td><td>Հայտնի, պլանավորվող</td><td>Բարձր անորոշություն</td></tr><tr><td>Հաճախորդի ներգրավվածություն</td><td>Կետային</td><td>Մշտական</td></tr></table></div>
      <p><b>Hybrid</b>՝ օրինակ՝ շենքի կառուցումը predictive, ներքին IT համակարգը՝ agile. կամ predictive ֆազային gate-եր + agile առաքում փուլերի ներսում։ <b>Tailoring</b>՝ ընտրել գործընթացները, արտեֆակտները և ռիտմը ըստ նախագծի չափի, ռիսկի և կազմակերպության մշակույթի։ Agile Manifesto-ն ունի 4 արժեք և 12 սկզբունք։</p>`},
    {t:"Backlog, iteration և առաքում", h:"1.5 ժ", b:`<ul><li><b>Product backlog</b>՝ դասավորված ըստ արժեքի. user stories (INVEST), acceptance criteria, refinement</li><li><b>Առաջնահերթություն</b>՝ MoSCoW, Kano, WSJF, value vs effort</li><li><b>Գնահատում</b>՝ story points, planning poker, T-shirt sizes, affinity estimation</li><li><b>Velocity</b>՝ թիմի պատմական արագություն (չի համեմատվում թիմերի միջև)</li><li><b>Kanban</b>՝ WIP limits, flow, cycle time, cumulative flow diagram</li><li><b>MVP</b>, incremental delivery, release planning, Definition of Done</li><li><b>Information radiators</b>՝ burndown/burnup, task board</li></ul>
      <p><b>Քննական թակարդ.</b> Agile նախագծում նոր պահանջը PM-ը/թիմը չի «մերժում» կամ անմիջապես չի ավելացնում sprint-ին. այն գնում է product backlog, և Product Owner-ը առաջնահերթում է։</p>`},
    {t:"Value delivery և benefits", h:"1 ժ", b:`<ul><li><b>Business case</b>՝ ինչու է նախագիծը արժե (NPV, IRR, payback, ոչ ֆինանսական օգուտներ)</li><li><b>Benefits management plan</b>՝ ով է պատասխանատու օգուտների իրացման համար, երբ և ինչպես են դրանք չափվելու</li><li><b>Value stream</b>, lead time, waste (Lean)</li><li><b>Outcome vs output</b>՝ առաքված ֆունկցիան (output) դեռ արժեք (outcome) չէ</li><li><b>Նախագծի ընտրություն NPV-ով</b>՝ ընտրիր ամենաբարձր NPV-ով նախագիծը (կարևոր չէ տևողությունը, քանի որ արդեն հաշվի է առնված)</li><li><b>Opportunity cost</b>՝ չընտրված լավագույն նախագծի արժեքը</li></ul>`}
  ],
  practice:{t:"Hybrid նախագծի tailoring", steps:["Ընտրիր նախագիծ (օր.՝ բանկի նոր մոբայլ app + մասնաճյուղերի վերանորոգում)","Որոշիր, որ մասերն են predictive, որոնք՝ agile, և հիմնավորիր","Գրիր 8 user story INVEST չափանիշով և դասավորիր MoSCoW-ով","Կազմիր release plan՝ velocity 20-ի դեպքում 120 point backlog-ի համար","Գրիր benefits management plan-ի կարճ տարբերակ"], deliverable:"Tailoring որոշում, backlog, release plan, benefits plan", tools:["forecast"]},
  quiz:[

{ n:5, aca:"Risk և Business Environment", title:"Ռիսկ, compliance, կայունություն և կազմակերպական փոփոխություն", short:"Risk & BE",
  goal:"Կառավարել ռիսկերը և հնարավորությունները, ապահովել compliance-ը, governance-ը և կազմակերպական փոփոխության աջակցությունը։",
  lessons:[
    {t:"Ռիսկի կառավարում", h:"1.5 ժ", b:`<div class="formula">Ռիսկի հայտարարություն: «Քանի որ [պատճառ], կարող է տեղի ունենալ [ռիսկ], որը կհանգեցնի [ազդեցություն]»
Probability × Impact matrix → առաջնահերթություն
EMV = Probability × Impact   (սպառնալիքը՝ −, հնարավորությունը՝ +)
Decision tree: յուրաքանչյուր ճյուղի EMV-ն գումարվում է ծախսին</div>
      <div class="tbl"><table><tr><th>Սպառնալիքներ</th><th>Հնարավորություններ</th></tr><tr><td>Avoid, Transfer, Mitigate, Accept, Escalate</td><td>Exploit, Share, Enhance, Accept, Escalate</td></tr></table></div>
      <p><b>Risk owner</b>, trigger, contingency plan, fallback plan, residual և secondary risks, risk register, risk review։ Agile-ում ռիսկը նվազում է կարճ iteration-ներով և վաղ feedback-ով. risk-adjusted backlog։</p>`},
    {t:"Governance, compliance և կայունություն", h:"1 ժ", b:`<ul><li><b>Governance</b>՝ ով է որոշում կայացնում, phase gates, escalation path-եր, PMO-ի դեր</li><li><b>Compliance</b>՝ օրենքներ, կանոնակարգեր (տվյալների պաշտպանություն, անվտանգություն, ոլորտային ստանդարտներ), կազմակերպական քաղաքականություններ. compliance requirements-ը ներառվում են պլանում և ստուգվում</li><li><b>Կայունություն (sustainability)</b>՝ բնապահպանական, սոցիալական և տնտեսական ազդեցություն, ESG պահանջներ, «sustainability standards» ECO-ում</li><li><b>Արտաքին միջավայր</b>՝ շուկայի, տեխնոլոգիական, քաղաքական փոփոխություններ, որոնք կարող են ազդել scope-ի և benefits-ի վրա. PM-ը պարբերաբար վերանայում է business case-ը</li></ul>`},
    {t:"Կազմակերպական փոփոխություն և AI նախագծերում", h:"1 ժ", b:`<ul><li><b>Kotter-ի 8 քայլ</b>՝ urgency, coalition, vision, communicate, empower, short-term wins, consolidate, anchor in culture</li><li><b>ADKAR</b> (Prosci)՝ Awareness, Desire, Knowledge, Ability, Reinforcement</li><li><b>Կազմակերպական մշակույթ</b>՝ functional, matrix (weak/balanced/strong), projectized. PM-ի իշխանությունը ամենամեծն է projectized-ում</li><li><b>AI-ը նախագծերում</b>՝ գնահատումների, ռիսկերի, հաշվետվությունների, ամփոփումների ավտոմատացում. PM-ը պատասխանատու է տվյալների գաղտնիության, AI-ի արդյունքների ստուգման և էթիկական օգտագործման համար</li></ul>`}
  ],
  practice:{t:"Risk register և decision tree", steps:["Կազմիր risk register 10 ռիսկով (8 սպառնալիք, 2 հնարավորություն)՝ պատճառ-ռիսկ-ազդեցություն ձևաչափով","Գնահատիր P×I և ընտրիր արձագանքի ռազմավարություններ","Լուծիր decision tree. «Կառուցել ($500k, 30% հավանականություն $200k լրացուցիչ ծախսի)» vs «Գնել ($620k, 10% հավանականություն $50k)»","Կազմիր ADKAR պլան նոր գործիքի ներդրման համար"], deliverable:"Risk register, decision tree վերլուծություն, փոփոխության պլան", tools:["emv"]},

{ n:6, aca:"Քննական ռազմավարություն", title:"Քննական ռազմավարություն և mock exam-ներ", short:"Exam",
  goal:"Տիրապետել սցենարային հարցերի լուծման տեխնիկային, ժամանակի կառավարմանը և վերջին շաբաթների պլանին։",
  lessons:[
    {t:"Սցենարային հարցերի տեխնիկա", h:"1 ժ", b:`<ol><li>Կարդա <b>վերջին նախադասությունը</b> նախ. ինչ է հարցնում (առաջին քայլը, լավագույնը, ինչ պետք է արվեր նախկինում)</li><li>Որոշիր կոնտեքստը՝ predictive, agile, թե hybrid</li><li>Գտիր, թե նախագիծը որ փուլում է</li><li>Բացառիր տարբերակներ, որոնք՝ անտեսում են խնդիրը, անմիջապես escalate են անում, խախտում են գործընթացը, կամ PM-ը միայնակ է որոշում թիմի փոխարեն</li><li>Մնացածից ընտրիր ամենա proactive և servant leader տարբերակը</li></ol>
      <p><b>Բանալի բառեր</b>՝ FIRST, NEXT, BEST, MOST LIKELY, SHOULD HAVE։ «Should have» հարցերը հաճախ վերաբերում են պլանավորմանը (risk register, communications plan, stakeholder engagement)։</p>`},
    {t:"Ժամանակ և ֆիզիկական պատրաստվածություն", h:"1 ժ", b:`<div class="formula">240 րոպե / 180 հարց ≈ 1.33 րոպե մեկ հարցին
Ստուգման կետեր (մոտավոր):  հարց 60 → ≈ 80 րոպե,  հարց 120 → ≈ 160 րոպե
Mark for review — չմնալ մեկ հարցի վրա > 2.5 րոպե</div>
      <ul><li>Ստուգիր PMI-ի և Pearson VUE-ի ընթացիկ կանոնները ընդմիջումների, online proctoring-ի և նույնականացման համար</li><li>Վերջին 2 շաբաթում՝ 2–3 լիարժեք mock exam ժամաչափով, ամեն սխալի վերլուծություն («ինչու ընտրեցի սխալը»)</li><li>Mock-երում կայուն 70%+ բարձր որակի հարցերով (օր.՝ PMI Study Hall) սովորաբար համարվում է պատրաստվածության լավ նշան</li></ul>`},

    {t:"Tailoring և project context", h:"1 ժ", b:`<ul><li><b>Tailoring</b>-ը PRINCE2-ի հարմարեցումն է նախագծի չափին, բարդությանը, ռիսկին, ոլորտին և կազմակերպությանը. սկզբունքները չեն փոխվում, իսկ պրակտիկաները, գործընթացները, դերերը և փաստաթղթերը կարող են հարմարեցվել</li><li>Փոքր նախագծում մեկ մարդը կարող է կատարել մի քանի դեր (բացի նշված անհամատեղելիներից), փաստաթղթերը կարող են միավորվել</li><li><b>PRINCE2 և agile</b>՝ PRINCE2-ը կարող է լինել կառավարման շրջանակ, իսկ առաքումը՝ Scrum կամ Kanban (PRINCE2 Agile)</li><li>Tailoring-ի որոշումները փաստաթղթավորվում են <b>Project Initiation Documentation (PID)</b>-ում</li></ul>`}

  lessons:[
    {t:"Business case պրակտիկա", h:"1 ժ", b:`<ul><li><b>Business case</b>՝ արդյոք նախագիծը ցանկալի (desirable), կենսունակ (viable) և իրագործելի (achievable) է</li><li>Բովանդակություն՝ executive summary, պատճառներ, տարբերակներ (ներառյալ «ոչինչ չանել»), ակնկալվող benefits և dis-benefits, ժամանակ, ծախսեր, ներդրումային գնահատում, հիմնական ռիսկեր</li><li><b>Output → Outcome → Benefit</b>. օր.՝ նոր համակարգ (output) → աշխատակիցները արագ են մշակում հայտերը (outcome) → 20% ծախսերի կրճատում (benefit)</li><li><b>Benefits management approach</b>՝ ինչպես և երբ կչափվեն benefits-ը (հաճախ նախագծից հետո)</li><li>Business case-ը թարմացվում է յուրաքանչյուր փուլի վերջում</li></ul>`},
    {t:"Plans պրակտիկա և product-based planning", h:"1.5 ժ", b:`<div class="formula">Պլանների մակարդակներ: Project plan → Stage plan → Team plan
                       + Exception plan (փոխարինում է stage/project plan-ին)
Product-based planning:
1. Project product description (ամբողջ արդյունքը, acceptance criteria)
2. Product breakdown structure (PBS)
3. Product descriptions (յուրաքանչյուր product-ի համար)
4. Product flow diagram (հաջորդականություն)
→ ապա activity-ներ, գնահատումներ, ժամանակացույց</div>
      <p>PRINCE2-ը պլանավորում է սկսում <b>products</b>-ից (focus on products սկզբունք), ոչ թե activity-ներից։ Management products (փաստաթղթեր) և specialist products (մասնագիտական արդյունքներ)։</p>`},
    {t:"Quality պրակտիկա", h:"1 ժ", b:`<ul><li><b>Quality planning</b>՝ customer's quality expectations → acceptance criteria → project product description → quality management approach → product descriptions (quality criteria, tolerance, method, responsibilities)</li><li><b>Quality control</b>՝ quality methods (inspection, testing, quality review technique) և quality register-ում գրանցումներ</li><li><b>Quality assurance</b>՝ անկախ ստուգում, որ գործընթացները ճիշտ են կիրառվում (կազմակերպության, ոչ թե նախագծի պատասխանատվություն)</li><li><b>Quality review technique</b>-ի դերեր՝ chair, presenter, reviewer, administrator</li><li><b>Acceptance records</b>՝ product-ի հաստատում</li></ul>`}
  ],

  lessons:[
    {t:"Risk պրակտիկա", h:"1 ժ", b:`<div class="formula">Risk management procedure: Identify → Assess → Plan → Implement  (+ Communicate ամբողջ ընթացքում)
Risk description: Cause → Event → Effect
Risk appetite (կազմակերպության) → risk tolerance (նախագծի)</div>
      <ul><li><b>Threat responses</b>՝ avoid, reduce, transfer, share, accept, prepare contingent plans</li><li><b>Opportunity responses</b>՝ exploit, enhance, share, reject, prepare contingent plans</li><li><b>Risk owner</b> (պատասխանատու ռիսկի համար) և <b>risk actionee</b> (կատարում է արձագանքը)</li><li><b>Risk register</b>, risk management approach, <b>risk budget</b></li></ul>`},
    {t:"Issues պրակտիկա (նախկին Change)", h:"1 ժ", b:`<div class="tbl"><table><tr><th>Issue-ի տեսակ</th><th>Օրինակ</th></tr><tr><td>Request for change</td><td>Ավելացնել նոր ֆունկցիա baseline-ին</td></tr><tr><td>Off-specification</td><td>Product-ը չի համապատասխանում նկարագրությանը</td></tr><tr><td>Problem / concern</td><td>Ցանկացած այլ հարց, որը պետք է լուծել</td></tr></table></div>
      <div class="formula">Issue procedure: Capture → Assess → Recommend → Decide → Implement
Change budget — գումար փոփոխությունների համար, Change Authority-ի տնօրինությամբ
Configuration management — product-ների տարբերակների վերահսկում (baseline)</div>
      <p>Փոքր issue-ները կարող են կառավարվել ոչ ֆորմալ <b>daily log</b>-ում, ֆորմալները՝ <b>issue register</b>-ում և <b>issue report</b>-ով։</p>`},
    {t:"Progress պրակտիկա", h:"1 ժ", b:`<ul><li><b>Event-driven controls</b>՝ end stage assessment, exception report, project closure</li><li><b>Time-driven controls</b>՝ checkpoint report (Team Manager → PM), highlight report (PM → Board)</li><li><b>Exception process</b>՝ PM-ը կանխատեսում է stage tolerance-ի խախտում → exception report Board-ին → Board-ը որոշում է (exception plan, tolerance-ի փոփոխություն, փակում)</li><li><b>Work package</b>՝ PM-ի և Team Manager-ի միջև համաձայնություն (ինչ, tolerance, հաշվետվություն)</li><li><b>Lessons log</b> և <b>lessons report</b></li><li>Stage-ների քանակը և երկարությունը որոշվում են ռիսկով, բարդությամբ և որոշումների կետերով</li></ul>`}

1. Product Owner-ը կարգավորում է աշխատանքը բարդ խնդրի համար Product Backlog-ում

3. Scrum Team-ը և շահակիցները ստուգում են արդյունքները և հարմարվում հաջորդ Sprint-ի համար
4. Կրկնել</div>`},
    {t:"Empiricism և lean thinking", h:"1 ժ", b:`<p><b>Empiricism</b>՝ գիտելիքը գալիս է փորձից, և որոշումները կայացվում են դիտարկվածի հիման վրա։ <b>Lean thinking</b>՝ նվազեցնել վատնումը և կենտրոնանալ էականի վրա։ Scrum-ը օգտագործում է <b>իտերատիվ, ինկրեմենտալ մոտեցում</b>՝ կանխատեսելիությունը բարելավելու և ռիսկը վերահսկելու համար։</p>
      <div class="tbl"><table><tr><th>Հենասյուն</th><th>Իմաստ</th></tr><tr><td>Transparency</td><td>Գործընթացը և աշխատանքը տեսանելի են և՛ կատարողներին, և՛ ստացողներին. ցածր թափանցիկությամբ արտեֆակտները կարող են հանգեցնել սխալ որոշումների</td></tr><tr><td>Inspection</td><td>Արտեֆակտները և առաջընթացը պետք է ստուգվեն հաճախ և ջանասիրաբար. Scrum իրադարձությունները նախատեսված են դրա համար</td></tr><tr><td>Adaptation</td><td>Եթե շեղումը անընդունելի է, գործընթացը կամ արդյունքը պետք է կարգավորվեն որքան հնարավոր է շուտ</td></tr></table></div>
      <p>Inspection առանց transparency-ի մոլորեցնող է, իսկ inspection առանց adaptation-ի՝ անիմաստ։</p>`},
    {t:"Scrum-ի 5 արժեքները", h:"1 ժ", b:`<div class="formula">Commitment · Focus · Openness · Respect · Courage</div>
      <ul><li><b>Commitment</b>՝ թիմը պարտավորվում է հասնել իր նպատակներին և աջակցել միմյանց</li><li><b>Focus</b>՝ կենտրոնացում Sprint-ի աշխատանքի վրա՝ նպատակների ուղղությամբ լավագույն առաջընթացի համար</li><li><b>Openness</b>՝ թափանցիկություն աշխատանքի և մարտահրավերների մասին</li><li><b>Respect</b>՝ միմյանց հարգանք որպես ունակ, անկախ մարդկանց</li><li><b>Courage</b>՝ քաջություն ճիշտն անելու և բարդ խնդիրների վրա աշխատելու համար</li></ul>
      <p>Երբ այս արժեքները կենդանի են, հենասյուները կյանքի են կոչվում և վստահություն են կառուցում։</p>`}
  ],
  practice:{t:"Scrum Guide-ի ընթերցում", steps:["Կարդա Scrum Guide 2020-ը ամբողջությամբ (13 էջ, scrumguides.org)","Ընդգծիր բոլոր «must» և «should» բառերը և գրիր, թե ինչ են պարտադրում","Գրիր 3 օրինակ քո փորձից, երբ transparency-ի բացակայությունը հանգեցրել է սխալ որոշման","Անցիր Scrum.org-ի անվճար Scrum Open assessment-ը և գրանցիր արդյունքը"], deliverable:"Նշումներ, օրինակներ, Open assessment-ի արդյունք"},

{ n:2, aca:"Scrum Team", title:"Scrum Team և պատասխանատվություններ", short:"Team",
  goal:"Հասկանալ Scrum Team-ի կազմը և Developers-ի, Product Owner-ի և Scrum Master-ի պատասխանատվությունները (accountabilities)։",
  lessons:[
    {t:"Scrum Team", h:"1 ժ", b:`<ul><li>Մեկ Scrum Master, մեկ Product Owner և Developers. <b>չկան ենթաթիմեր և հիերարխիաներ</b></li><li><b>Cross-functional</b>՝ ունեն բոլոր հմտությունները ամեն Sprint արժեք ստեղծելու համար</li><li><b>Self-managing</b>՝ ներքուստ որոշում են՝ ով, ինչ, ինչպես</li><li>Բավական փոքր՝ արագաշարժ լինելու համար, բավական մեծ՝ զգալի աշխատանք կատարելու համար. <b>սովորաբար 10 կամ ավելի քիչ մարդ</b></li><li>Եթե թիմը շատ մեծ է, այն պետք է վերակազմավորվի մի քանի համախմբված Scrum Team-ի՝ կենտրոնացած նույն product-ի վրա. նրանք կիսում են նույն Product Goal-ը, Product Backlog-ը և Product Owner-ը</li><li>Ամբողջ Scrum Team-ը պատասխանատու է ամեն Sprint արժեքավոր, օգտակար Increment ստեղծելու համար</li></ul>`},
    {t:"Developers և Product Owner", h:"1.5 ժ", b:`<p><b>Developers</b>-ը պատասխանատու են (accountable)՝ Sprint Backlog-ի ստեղծման, Definition of Done-ին հավատարմությամբ որակի ապահովման, պլանի ամենօրյա հարմարեցման և միմյանց պատասխանատվության համար որպես պրոֆեսիոնալներ։</p>
      <p><b>Product Owner</b>-ը պատասխանատու է Scrum Team-ի աշխատանքից ստացվող product-ի արժեքի մաքսիմալացման համար, ինչպես նաև Product Backlog-ի արդյունավետ կառավարման համար.</p>
      <ul><li>Product Goal-ի մշակում և հստակ հաղորդում</li><li>Product Backlog item-ների ստեղծում և հստակ հաղորդում</li><li>Item-ների դասավորում (ordering)</li><li>Product Backlog-ի թափանցիկության, տեսանելիության և հասկանալիության ապահովում</li></ul>
      <p>PO-ն կարող է պատվիրակել այս աշխատանքը, բայց մնում է պատասխանատու։ PO-ն <b>մեկ մարդ է, ոչ թե կոմիտե</b>. ով ուզում է փոխել Product Backlog-ը, պետք է համոզի PO-ին։ PO-ի որոշումները պետք է հարգվեն ամբողջ կազմակերպությունում։</p>`},
    {t:"Scrum Master", h:"1.5 ժ", b:`<p><b>Scrum Master</b>-ը պատասխանատու է Scrum-ի ստեղծման համար՝ ինչպես սահմանված է Scrum Guide-ում, և Scrum Team-ի արդյունավետության համար։ SM-ը <b>իրական առաջնորդ է, որը ծառայում է</b> (true leader who serves)։</p>
      <div class="tbl"><table><tr><th>Ում է ծառայում</th><th>Ինչպես</th></tr><tr><td>Scrum Team-ին</td><td>Coaching self-management-ում և cross-functionality-ում, Definition of Done-ին համապատասխանող Increment-ների վրա կենտրոնացում, խոչընդոտների հեռացման խթանում, Scrum իրադարձությունների դրական, արդյունավետ և timebox-ի մեջ անցկացման ապահովում</td></tr><tr><td>Product Owner-ին</td><td>Product Goal-ի և backlog-ի կառավարման տեխնիկաներ, empirical product planning, շահակիցների համագործակցության խթանում</td></tr><tr><td>Կազմակերպությանը</td><td>Scrum-ի ներդրման առաջնորդում, ուսուցում և coaching, Scrum-ի պլանավորում և խորհրդատվություն, շահակիցների և թիմերի միջև խոչընդոտների հեռացում</td></tr></table></div>
      <p>SM-ը մենեջեր չէ, որը բաժանում է առաջադրանքներ, և «քարտուղար» չէ, որը միայն կազմակերպում է հանդիպումներ։</p>`}
  ],
  practice:{t:"Պատասխանատվությունների քարտեզ", steps:["Նկարագրիր քո (կամ ծանոթ) թիմը և համեմատիր Scrum Guide-ի հետ. որտեղ կան շեղումներ","Գրիր 10 տարածված գործողություն (օր.՝ «ով է որոշում, թե քանի item վերցնել Sprint») և նշիր ճիշտ պատասխանատուն","Նկարագրիր 3 իրավիճակ, որտեղ SM-ը պետք է ծառայի կազմակերպությանը","Գրիր, թե ինչպես կբացատրեիր ղեկավարին, որ PO-ն չի կարող լինել կոմիտե"], deliverable:"Gap վերլուծություն, պատասխանատվությունների աղյուսակ"},

{ n:3, aca:"Իրադարձություններ", title:"Scrum-ի իրադարձությունները", short:"Events",
  goal:"Իմանալ 5 իրադարձությունների նպատակը, մասնակիցները, timebox-երը և տարածված սխալները։",
  lessons:[
    {t:"Sprint և Sprint Planning", h:"1.5 ժ", b:`<p><b>Sprint</b>՝ ֆիքսված տևողությամբ (մեկ ամիս կամ ավելի քիչ) իրադարձություն, որը պարունակում է մնացած բոլոր իրադարձությունները։ Նոր Sprint-ը սկսվում է նախորդի ավարտից անմիջապես հետո։ Sprint-ի ընթացքում՝ փոփոխություններ, որոնք վտանգում են Sprint Goal-ը, չեն արվում, որակը չի նվազում, Product Backlog-ը refinement է արվում ըստ անհրաժեշտության, scope-ը կարող է հստակեցվել և վերաբանակցվել PO-ի հետ։</p>
      <p><b>Sprint-ը կարող է չեղարկվել միայն Product Owner-ի կողմից</b>, եթե Sprint Goal-ը հնացել է։</p>
      <div class="formula">Sprint Planning (առավելագույնը 8 ժամ մեկամսյա Sprint-ի համար)
Topic 1: Ինչու է այս Sprint-ը արժեքավոր → Sprint Goal (ամբողջ Scrum Team)
Topic 2: Ինչ կարելի է անել → Developers-ը ընտրում են item-ներ
Topic 3: Ինչպես կկատարվի աշխատանքը → Developers-ը պլանավորում են
Արդյունք: Sprint Backlog = Sprint Goal + ընտրված item-ներ + առաքման պլան</div>`},
    {t:"Daily Scrum և Sprint Review", h:"1 ժ", b:`<p><b>Daily Scrum</b>՝ 15 րոպե, Developers-ի համար, ամեն օր նույն ժամին և վայրում։ Նպատակ՝ ստուգել առաջընթացը դեպի Sprint Goal և հարմարեցնել Sprint Backlog-ը։ Developers-ը կարող են ընտրել ցանկացած կառուցվածք (երեք հարցը պարտադիր չեն)։ Եթե PO-ն կամ SM-ը ակտիվորեն աշխատում են Sprint Backlog-ի item-ների վրա, մասնակցում են որպես Developers։ SM-ը ապահովում է, որ այն տեղի ունենա, բայց պարտադիր չէ, որ ինքը վարի։</p>
      <p><b>Sprint Review</b>՝ առավելագույնը 4 ժամ մեկամսյա Sprint-ի համար։ Ստուգել Sprint-ի արդյունքը և որոշել հետագա հարմարեցումները. Scrum Team-ը ներկայացնում է արդյունքները հիմնական շահակիցներին, քննարկվում է Product Goal-ի առաջընթացը։ Սա <b>աշխատանքային նիստ է</b>, ոչ թե միայն ներկայացում։ Product Backlog-ը կարող է թարմացվել։</p>`},
    {t:"Sprint Retrospective և timebox-եր", h:"1 ժ", b:`<p><b>Sprint Retrospective</b>՝ առավելագույնը 3 ժամ մեկամսյա Sprint-ի համար, ավարտում է Sprint-ը։ Նպատակ՝ պլանավորել որակը և արդյունավետությունը բարձրացնելու ուղիներ. ինչպես անցավ վերջին Sprint-ը՝ մարդկանց, փոխազդեցությունների, գործընթացների, գործիքների և Definition of Done-ի տեսանկյունից։ Ամենաազդեցիկ բարելավումները կարող են ավելացվել հաջորդ Sprint Backlog-ին։</p>
      <div class="tbl"><table><tr><th>Իրադարձություն</th><th>Timebox (մեկամսյա Sprint)</th></tr><tr><td>Sprint</td><td>≤ 1 ամիս</td></tr><tr><td>Sprint Planning</td><td>≤ 8 ժամ</td></tr><tr><td>Daily Scrum</td><td>15 րոպե</td></tr><tr><td>Sprint Review</td><td>≤ 4 ժամ</td></tr><tr><td>Sprint Retrospective</td><td>≤ 3 ժամ</td></tr></table></div>
      <p>Ավելի կարճ Sprint-ների դեպքում իրադարձությունները սովորաբար ավելի կարճ են։ <b>Product Backlog refinement</b>-ը իրադարձություն չէ, այլ շարունակական գործունեություն։</p>`}

{ n:4, aca:"Արտեֆակտներ", title:"Արտեֆակտներ և պարտավորություններ", short:"Artifacts",
  goal:"Հասկանալ 3 արտեֆակտները և դրանց պարտավորությունները՝ Product Goal, Sprint Goal, Definition of Done։",
  lessons:[
    {t:"Product Backlog և Product Goal", h:"1 ժ", b:`<div class="formula">Արտեֆակտ          → Պարտավորություն (commitment)
Product Backlog   → Product Goal
Sprint Backlog    → Sprint Goal
Increment         → Definition of Done</div>
      <p><b>Product Backlog</b>՝ product-ի բարելավման համար անհրաժեշտ ամեն ինչի առաջացող, դասավորված ցանկ, Scrum Team-ի աշխատանքի միակ աղբյուրը։ <b>Refinement</b>՝ item-ների բաժանում և մանրամասնում (նկարագրություն, կարգ, չափ). <b>Developers-ը պատասխանատու են չափի գնահատման համար</b>, PO-ն կարող է օգնել։</p>
      <p><b>Product Goal</b>՝ product-ի ապագա վիճակը, թիմի երկարաժամկետ նպատակը։ Թիմը պետք է կատարի (կամ հրաժարվի) մեկ նպատակից, նախքան հաջորդը վերցնելը։</p>`},
    {t:"Sprint Backlog և Sprint Goal", h:"1 ժ", b:`<ul><li><b>Sprint Backlog</b> = Sprint Goal (ինչու) + ընտրված Product Backlog item-ներ (ինչ) + Increment-ի առաքման պլան (ինչպես)</li><li>Այն Developers-ի կողմից, Developers-ի համար պլան է, թարմացվում է Sprint-ի ընթացքում</li><li><b>Sprint Goal</b>՝ Sprint-ի միակ նպատակը, ստեղծվում է Sprint Planning-ում, չի փոխվում Sprint-ի ընթացքում, տալիս է ճկունություն աշխատանքի ճշգրիտ բովանդակության հարցում</li><li>Եթե աշխատանքը տարբերվում է սպասվածից, Developers-ը համագործակցում են PO-ի հետ՝ scope-ը վերաբանակցելու համար՝ առանց Sprint Goal-ը փոխելու</li></ul>`},
    {t:"Increment և Definition of Done", h:"1 ժ", b:`<ul><li><b>Increment</b>՝ քայլ դեպի Product Goal. յուրաքանչյուր Increment-ը ավելանում է նախորդներին և ամբողջովին ստուգված է, որ բոլորը միասին աշխատեն։ Մեկ Sprint-ում կարող են ստեղծվել մի քանի Increment</li><li>Increment-ը կարող է առաքվել շահակիցներին Sprint-ի ավարտից առաջ. Sprint Review-ը չպետք է դիտարկվի որպես արժեքի թողարկման «դարպաս»</li><li><b>Definition of Done</b>՝ Increment-ի վիճակի ֆորմալ նկարագրություն, երբ այն համապատասխանում է product-ի որակի պահանջներին։ Item-ը, որը չի համապատասխանում DoD-ին, չի կարող թողարկվել կամ ներկայացվել Sprint Review-ում. այն վերադառնում է Product Backlog</li><li>Եթե DoD-ը կազմակերպության ստանդարտ է, բոլոր թիմերը պետք է հետևեն դրան որպես նվազագույն. եթե ոչ, Scrum Team-ը պետք է ստեղծի DoD</li><li>Նույն product-ի վրա աշխատող մի քանի թիմ պետք է կիսեն նույն DoD-ը</li></ul>`}

  goal:"Ճանաչել Scrum-ի մասին տարածված սխալ պատկերացումները և լուծել PSM I-ի բարդ սցենարային հարցեր։",
  lessons:[
    {t:"Scrum-ի միֆեր", h:"1.5 ժ", b:`<div class="tbl"><table><tr><th>Միֆ</th><th>Իրականություն (Scrum Guide 2020)</th></tr>
      <tr><td>«Sprint 0», «hardening sprint», «release sprint»</td><td>Ամեն Sprint պետք է ստեղծի արժեքավոր, օգտակար Increment</td></tr>

    {t:"Բարդ սցենարներ", h:"1.5 ժ", b:`<ul><li><b>Developers-ը չեն ավարտում աշխատանքը</b>՝ Sprint-ը չի երկարացվում. չավարտված item-ները վերադառնում են Product Backlog. թիմը retrospective-ում քննարկում է պատճառները</li><li><b>Շահակիցը ուղիղ դիմում է Developer-ին նոր պահանջով</b>՝ Developer-ը ուղղորդում է PO-ին. SM-ը coaching է անում</li><li><b>Թիմը չի ուզում Retrospective անել</b>՝ SM-ը բացատրում է նպատակը, փորձում է տարբեր ձևաչափեր. Retrospective-ը պարտադիր է</li><li><b>Մի քանի թիմ նույն product-ի վրա</b>՝ մեկ PO, մեկ backlog, ընդհանուր DoD, ինտեգրված Increment. Scrum.org-ը առաջարկում է Nexus շրջանակը</li><li><b>Ղեկավարը ուզում է մասնակցել Daily Scrum-ին և ստանալ հաշվետվություն</b>՝ SM-ը ուսուցանում է ղեկավարին և պաշտպանում իրադարձության նպատակը</li><li><b>Տեխնիկական պարտք</b>՝ Developers-ը թափանցիկ են դարձնում այն Product Backlog-ում և DoD-ում</li></ul>`},
    {t:"Scrum-ը կազմակերպությունում", h:"1 ժ", b:`<ul><li>Scrum-ի փոփոխելը կամ դրա մասերը բաց թողնելը թաքցնում է խնդիրները և սահմանափակում է օգուտները. արդյունքը այլևս Scrum չէ</li><li>Scrum-ը կարող է լրացվել այլ պրակտիկաներով (Kanban, XP, DevOps, user stories, story points)</li><li><b>Կազմակերպական խոչընդոտներ</b>՝ ֆունկցիոնալ սիլոսներ, անհատական KPI-ներ, պլանավորման տարեկան բյուջետավորում. SM-ը աշխատում է կազմակերպության հետ դրանք հեռացնելու համար</li><li>Scrum-ը կիրառվում է ոչ միայն ծրագրային ապահովման, այլև մարքեթինգի, հետազոտությունների, կրթության և այլ բարդ աշխատանքների համար</li></ul>`}
  ],

    {t:"Թակարդ բառեր և ռազմավարություն", h:"1 ժ", b:`<ul><li><b>«Must» vs «should» vs «may»</b>՝ Scrum Guide-ը ճշգրիտ է. օր.՝ Daily Scrum-ը «must» չէ, որ վարի SM-ը</li><li><b>«Accountable» vs «responsible»</b>՝ PO-ն accountable է backlog-ի համար, բայց կարող է պատվիրակել աշխատանքը</li><li><b>«Scrum Team» vs «Developers»</b>՝ Sprint Goal-ը ստեղծում է ամբողջ Scrum Team-ը, Sprint Backlog-ը՝ Developers-ը</li><li><b>Multiple answer</b>՝ հարցում նշված է, քանի պատասխան ընտրել. մասնակի ճիշտը չի հաշվվում</li><li>Եթե տարբերակը ավելացնում է դեր, իրադարձություն կամ արտեֆակտ, որը չկա Scrum Guide-ում, այն հավանաբար սխալ է</li><li>Առաջին անցում արագ, bookmark կասկածելիները, մնացած ժամանակում վերադառնալ</li></ul>`},

weeks:[
{ n:1, aca:"Շինարարություն", title:"Շինարարական նախագծեր", short:"Շինարարություն",
  goal:"Հասկանալ շինարարական նախագծի կյանքի ցիկլը, ժամանակացույցը, ծախսերի նախահաշիվը, պայմանագրերը և անվտանգությունը։",
  lessons:[
    {t:"Կյանքի ցիկլ և շահակիցներ", h:"1 ժ", b:`<div class="formula">Նախաձեռնում (feasibility) → Նախագծում (concept → schematic → detailed design)
→ Թույլտվություններ → Մրցույթ (tender) → Կառուցում → Ընդունում (commissioning)
→ Շահագործման հանձնում → Երաշխիքային ժամկետ (defects liability period)</div>
      <ul><li><b>Շահակիցներ</b>՝ պատվիրատու (client/employer), ճարտարապետ, ինժեներներ, գլխավոր կապալառու, ենթակապալառուներ, տեխնիկական հսկողություն, պետական տեսչություններ, հարևաններ, ապագա օգտատերեր</li><li><b>Մատակարարման մոդելներ</b>՝ Design–Bid–Build (ավանդական), Design & Build (մեկ պատասխանատու), Construction Management, EPC (turnkey)</li><li>Փոփոխության գինը կտրուկ աճում է նախագծումից կառուցման անցնելիս, ուստի հիմնականում predictive մոտեցում է կիրառվում, իսկ նախագծման փուլում կարող են կիրառվել իտերատիվ մեթոդներ և BIM</li></ul>`},
    {t:"Ժամանակացույց, BOQ և ծախսեր", h:"1.5 ժ", b:`<ul><li><b>Critical Path Method</b>՝ բետոնի ամրացման ժամանակ, եղանակային պատուհաններ, նյութերի առաքում. ժամանակացույցը սովորաբար Primavera P6 կամ MS Project</li><li><b>Bill of Quantities (BOQ)</b>՝ աշխատանքների և նյութերի քանակների ցուցակ միավորի գներով. մրցույթի և վճարումների հիմք</li><li><b>Նախահաշիվ</b>՝ ուղղակի ծախսեր (նյութ, աշխատուժ, տեխնիկա) + անուղղակի (կառավարում, ապահովագրություն) + contingency (սովորաբար 5–15%՝ կախված նախագծման մակարդակից) + escalation (գնաճ)</li><li><b>Interim payments</b>՝ ամսական կատարված աշխատանքների չափում, retention (պահուստային մաս, սովորաբար 5–10%, վերադարձվում է երաշխիքային ժամկետից հետո)</li><li><b>EVM</b>՝ CPI և SPI շինարարությունում շատ կիրառելի է չափելի քանակների պատճառով</li></ul>`},
    {t:"Պայմանագրեր, փոփոխություններ և անվտանգություն", h:"1 ժ", b:`<div class="tbl"><table><tr><th>FIDIC (միջազգային ստանդարտ պայմանագրեր)</th><th>Կիրառություն</th></tr><tr><td>Red Book</td><td>Շինարարություն՝ պատվիրատուի նախագծով</td></tr><tr><td>Yellow Book</td><td>Plant & Design-Build՝ կապալառուի նախագծով</td></tr><tr><td>Silver Book</td><td>EPC / Turnkey՝ ռիսկի մեծ մասը կապալառուի վրա</td></tr></table></div>
      <ul><li><b>Variations / change orders</b>՝ գրավոր հրահանգ, գնահատում, ժամանակի երկարացում (extension of time), claims</li><li><b>Անվտանգություն</b>՝ ռիսկերի գնահատում, անհատական պաշտպանության միջոցներ, բարձրության վրա աշխատանք, toolbox talks, միջադեպերի գրանցում. անվտանգությունը միշտ գերակա է ժամանակացույցից</li><li><b>Որակ</b>՝ inspection and test plan (ITP), նյութերի սերտիֆիկատներ, թաքնված աշխատանքների ակտեր</li><li>ՀՀ-ում ստուգիր քաղաքաշինական օրենսդրությունը, թույլտվությունների կարգը և պետական գնումների պահանջները, եթե պատվիրատուն պետական է</li></ul>`}
  ],
  practice:{t:"Փոքր շինարարական նախագծի պլան", steps:["Ընտրիր նախագիծ (օր.՝ 2-հարկանի առանձնատան կամ դպրոցի վերանորոգում)","Կազմիր WBS և 12 activity-ի ժամանակացույց կախվածություններով, հաշվիր critical path-ը","Կազմիր պարզեցված BOQ 10 տողով և հաշվիր contingency-ն","Ընտրիր պայմանագրի տեսակը (FIDIC Red/Yellow/Silver) և հիմնավորիր","Գրիր անվտանգության 8 հիմնական կանոն"], deliverable:"WBS, CPM, BOQ, պայմանագրի ընտրություն, անվտանգության կանոններ", tools:["cpm","evm"]},

    ["Ո՞ր FIDIC պայմանագիրն է EPC/Turnkey։",["Red","Yellow","Silver","Green"],2,"Silver Book։"],

    ["Ժամանակացույցը ուշանում է, և կապալառուն առաջարկում է բաց թողնել անվտանգության որոշ ընթացակարգեր։ PM-ը...",["Համաձայնում է","Մերժում է. անվտանգությունը գերակա է. փնտրում է այլ միջոցներ (crashing, fast tracking)","Թողնում է կապալառուին որոշել","Չի արձագանքում"],1,"Safety first։"]

{ n:2, aca:"Պետական հատված", title:"Պետական հատվածի նախագծեր", short:"Պետական",
  goal:"Կառավարել պետական նախագծերը՝ գնումներ, բյուջետային ցիկլ, թափանցիկություն, արդյունքահեն կառավարում և շահակիցներ։",
  lessons:[
    {t:"Պետական նախագծերի առանձնահատկությունները", h:"1 ժ", b:`<ul><li><b>Հանրային արժեք</b>՝ նպատակը ոչ թե շահույթն է, այլ քաղաքացիների համար արդյունքը (ծառայության որակ, հասանելիություն, անվտանգություն)</li><li><b>Հաշվետվողականություն</b>՝ աուդիտ, խորհրդարանական վերահսկողություն, լրատվամիջոցներ, հանրային կարծիք</li><li><b>Բյուջետային ցիկլ</b>՝ տարեկան բյուջե և միջնաժամկետ ծախսային ծրագիր (ՄԺԾԾ). չօգտագործված միջոցները կարող են չփոխանցվել հաջորդ տարի</li><li><b>Կարգավորումներ</b>՝ գնումների օրենսդրություն, տվյալների պաշտպանություն, հասանելիություն, լեզվական պահանջներ</li><li><b>Քաղաքական ցիկլ</b>՝ առաջնահերթությունները կարող են փոխվել ընտրություններից հետո. բիզնես քեյսը պետք է լինի դիմացկուն</li><li><b>Միջազգային դոնորներ</b>՝ Համաշխարհային բանկ, ԱԶԲ, ԵՄ, USAID և այլն, որոնք ունեն իրենց ընթացակարգերը</li></ul>`},
    {t:"Պետական գնումներ", h:"1.5 ժ", b:`<ul><li>ՀՀ-ում պետական գնումները կարգավորվում են «Գնումների մասին» օրենքով և իրականացվում են էլեկտրոնային համակարգով (armeps.am). ստուգիր օրենքի ընթացիկ խմբագրությունը և շեմերը</li><li><b>Ընթացակարգեր</b>՝ բաց մրցույթ, գնանշման հարցում, մեկ անձից գնում (սահմանափակ դեպքերում), շրջանակային համաձայնագրեր</li><li><b>Տեխնիկական բնութագիր</b>՝ պետք է լինի չեզոք (առանց ապրանքանիշի, եթե չկա հիմնավորում), չափելի, ստուգելի. վատ բնութագիրը հանգեցնում է վատ մատակարարման կամ բողոքարկումների</li><li><b>Ժամանակ</b>՝ գնման ընթացակարգը կարող է տևել շաբաթներից ամիսներ. այն պետք է լինի ժամանակացույցի critical path-ում</li><li><b>Բողոքարկում</b>՝ մասնակիցները կարող են բողոքարկել. սա ռիսկ է, որը պետք է պլանավորել</li><li><b>Էթիկա</b>՝ շահերի բախման բացակայության հայտարարություն, կոռուպցիայի կանխարգելում</li></ul>`},
    {t:"Արդյունքահեն կառավարում (RBM)", h:"1 ժ", b:`<div class="formula">Results chain:
Inputs → Activities → Outputs → Outcomes → Impact
Օրինակ: բյուջե, մասնագետներ → դպրոցների վերանորոգում → 20 վերանորոգված դպրոց
→ ուսուցման պայմանների բարելավում, հաճախումների աճ → կրթական արդյունքների բարելավում</div>
      <ul><li><b>Ցուցանիշներ (KPI)</b>՝ SMART, ելակետային արժեք (baseline), թիրախ, տվյալների աղբյուր, հաճախականություն</li><li><b>Մոնիթորինգ vs գնահատում</b>՝ մոնիթորինգը շարունակական է (արդյո՞ք պլանով ենք գնում), գնահատումը՝ պարբերական (արդյո՞ք ճիշտ բանն ենք անում և ինչ ազդեցություն ունենք)</li><li><b>OECD DAC չափանիշներ</b>՝ relevance, coherence, effectiveness, efficiency, impact, sustainability</li></ul>`}

{ n:3, aca:"ՀԿ և դոնորային ծրագրեր", title:"ՀԿ-ներ, դրամաշնորհներ և logframe", short:"ՀԿ",
  goal:"Կառավարել դոնորային նախագծեր՝ Project DPro մոտեցում, Theory of Change, logframe, MEAL և դոնորային հաշվետվություններ։",
  lessons:[
    {t:"Project DPro (PMD Pro) մոտեցում", h:"1 ժ", b:`<p><b>PM4NGOs</b>-ի Project DPro ուղեցույցը (2-րդ հրատարակություն, Creative Commons լիցենզիա) զարգացման և մարդասիրական ոլորտի նախագծերի կառավարման ստանդարտ է՝ հասանելի մի քանի լեզուներով և սերտիֆիկացման քննությամբ։</p>
      <div class="formula">Կյանքի ցիկլ (Project DPro):
Identification & Design → Set Up → Planning → Implementation → Closure
+ Monitoring, Evaluation & Control՝ ամբողջ ընթացքում</div>
      <ul><li>Շեշտը՝ շահառուների ներգրավվածություն, համատեքստի վերլուծություն, կայունություն, «do no harm»</li><li>Դոնորի, գործընկերների և համայնքի շահերի հավասարակշռում</li><li>Կարողությունների զարգացում և նախագծից հետո արդյունքների պահպանում (exit strategy)</li></ul>`},
    {t:"Theory of Change և logframe", h:"1.5 ժ", b:`<p><b>Theory of Change</b>՝ «եթե... ապա... քանի որ...» տրամաբանություն, որը բացատրում է, թե ինչպես են գործողությունները հանգեցնում փոփոխության, և որ ենթադրությունների վրա է հիմնված։</p>
      <div class="tbl"><table><tr><th>Մակարդակ</th><th>Նկարագրություն</th><th>Ցուցանիշներ</th><th>Ստուգման միջոցներ</th><th>Ենթադրություններ</th></tr><tr><td>Goal</td><td>Երկարաժամկետ ազդեցություն</td><td>…</td><td>Ազգային վիճակագրություն</td><td>…</td></tr><tr><td>Outcomes</td><td>Փոփոխություններ շահառուների մոտ</td><td>…</td><td>Հարցումներ</td><td>…</td></tr><tr><td>Outputs</td><td>Ապրանքներ և ծառայություններ</td><td>…</td><td>Գրանցամատյաններ</td><td>…</td></tr><tr><td>Activities</td><td>Գործողություններ</td><td>Inputs / բյուջե</td><td>Հաշվապահություն</td><td>Նախապայմաններ</td></tr></table></div>
      <p><b>Ուղղահայաց տրամաբանություն</b>՝ եթե activities + ենթադրություններ → outputs, և այդպես շարունակ։ <b>Հորիզոնական տրամաբանություն</b>՝ յուրաքանչյուր մակարդակ ունի չափելի ցուցանիշ և տվյալների աղբյուր։</p>`},
    {t:"MEAL և դոնորային հաշվետվություններ", h:"1 ժ", b:`<ul><li><b>MEAL</b>՝ Monitoring, Evaluation, Accountability, Learning. հաշվետվողականություն նաև շահառուների առջև (feedback մեխանիզմներ, բողոքների համակարգ)</li><li><b>Baseline, midline, endline</b> հետազոտություններ</li><li><b>Դոնորային հաշվետվություններ</b>՝ նարատիվ (ինչ արվեց, արդյունքներ, մարտահրավերներ, դասեր) և ֆինանսական (բյուջե vs փաստացի, շեղումների բացատրություն). ժամկետները պարտադիր են</li><li><b>Բյուջետային կանոններ</b>՝ թույլատրելի ծախսեր, line item-ների միջև վերաբաշխման սահմաններ (հաճախ 10–15%՝ առանց դոնորի հաստատման, ըստ պայմանագրի), անուղղակի ծախսեր (overhead)</li><li><b>Compliance</b>՝ գնումների կանոններ, ֆինանսական աուդիտ, հակակոռուպցիոն և safeguarding քաղաքականություններ</li></ul>`}
  ],

{ n:4, aca:"Միջոցառումներ", title:"Միջոցառումների կառավարում", short:"Միջոցառումներ",
  goal:"Պլանավորել և անցկացնել միջոցառումներ՝ բյուջե, մատակարարներ, run-of-show, ռիսկեր և անվտանգություն։",
  lessons:[
    {t:"Միջոցառման կյանքի ցիկլը և բյուջեն", h:"1 ժ", b:`<div class="formula">Նպատակ և KPI → Կոնցեպտ → Բյուջե → Վայր և ամսաթիվ → Մատակարարներ
→ Մարքեթինգ և գրանցում → Լոգիստիկա → Run-of-show → Միջոցառում → Ամփոփում</div>
      <ul><li><b>Նպատակ և KPI</b>՝ մասնակիցներ, գոհունակություն (NPS), լիդեր, հովանավորների ROI, լրատվական ծածկույթ</li><li><b>Բյուջե</b>՝ վայր, սնունդ, տեխնիկա (ձայն, լույս, էկրաններ), դիզայն և տպագրություն, բանախոսներ, տրանսպորտ, ապահովագրություն, թույլտվություններ + contingency (հաճախ 10–15%)</li><li><b>Break-even</b>՝ (ֆիքսված ծախսեր) / (տոմսի գին − փոփոխական ծախս մեկ մասնակցի վրա)</li><li><b>Ժամանակացույց հետ-հաշվարկով</b>՝ միջոցառման ամսաթվից դեպի հետ (T−90, T−60, T−30, T−7, T−1)</li></ul>`},
    {t:"Մատակարարներ և run-of-show", h:"1 ժ", b:`<ul><li><b>Մատակարարների կառավարում</b>՝ գրավոր պայմանագրեր, չեղարկման պայմաններ, կանխավճարներ, մանրամասն brief, պատասխանատու կոնտակտ, պահուստային մատակարար կրիտիկական ծառայությունների համար</li><li><b>Run-of-show</b>՝ րոպե առ րոպե ծրագիր. ժամ, տևողություն, գործողություն, պատասխանատու, տեխնիկական cue (միկրոֆոն, սլայդ, երաժշտություն), նշումներ</li><li><b>Production schedule</b>՝ մոնտաժ (load-in), փորձեր, ապամոնտաժ (load-out)</li><li><b>Ճգնաժամային կոնտակտների ցուցակ</b> և ռադիոկապ/խումբ թիմի համար</li></ul>`},
    {t:"Ռիսկեր, անվտանգություն և ամփոփում", h:"1 ժ", b:`<div class="tbl"><table><tr><th>Ռիսկ</th><th>Արձագանք</th></tr><tr><td>Վատ եղանակ (բացօթյա)</td><td>Վրան կամ պահուստային ներքին վայր, որոշման ժամկետ</td></tr><tr><td>Բանախոսը չի գալիս</td><td>Պահուստային բանախոս կամ panel, video</td></tr><tr><td>Տեխնիկական խափանում</td><td>Փորձ, պահուստային սարքավորում, տեխնիկ տեղում</td></tr><tr><td>Մարդկանց հոսքի խնդիրներ</td><td>Մուտքի/ելքի պլան, տարողության սահմաններ, վթարային ելքեր, անվտանգության աշխատակազմ</td></tr><tr><td>Բժշկական միջադեպ</td><td>Առաջին օգնություն տեղում, շտապ օգնության հետ համաձայնեցում</td></tr></table></div>
      <p><b>Ամփոփում</b>՝ մասնակիցների հարցում 48 ժամում, KPI vs թիրախ, բյուջե vs փաստացի, թիմի lessons learned, շնորհակալագրեր մատակարարներին և հովանավորներին։</p>`}

  goal:"Ղեկավարել մարդկանց փոփոխության միջով՝ Kotter, ADKAR, դիմադրության կառավարում և հաղորդակցություն։",
  lessons:[
    {t:"Ինչու են ձախողվում փոփոխությունները", h:"1 ժ", b:`<p>Նախագիծը կարող է ժամանակին առաքել նոր համակարգ, շենք կամ ընթացակարգ, բայց եթե մարդիկ չեն փոխում վարքը, օգուտները չեն իրացվում։ John Kotter-ը («Leading Change», Harvard Business Review, 1995) նկարագրել է տարածված սխալներ. անբավարար urgency, թույլ coalition, vision-ի բացակայություն, անբավարար հաղորդակցություն, խոչընդոտների չհեռացում, կարճաժամկետ հաղթանակների բացակայություն, վաղաժամ «հաղթանակի հայտարարում», մշակույթում չամրագրում։</p>
      <div class="formula">Kotter-ի 8 քայլ:
1 Urgency  2 Coalition  3 Vision & strategy  4 Communicate the vision
5 Empower action / remove barriers  6 Short-term wins
7 Consolidate gains  8 Anchor in culture</div>`},
    {t:"ADKAR և դիմադրություն", h:"1 ժ", b:`<div class="tbl"><table><tr><th>ADKAR</th><th>Հարց</th><th>Գործիք</th></tr><tr><td>Awareness</td><td>Ինչու՞ է փոփոխությունը պետք</td><td>Հաղորդակցություն ղեկավարից</td></tr><tr><td>Desire</td><td>Ի՞նչ է դա տալիս ինձ</td><td>Անձնական զրույց, WIIFM</td></tr><tr><td>Knowledge</td><td>Ինչպե՞ս փոխվել</td><td>Ուսուցում</td></tr><tr><td>Ability</td><td>Կարո՞ղ եմ իրականում անել</td><td>Պրակտիկա, coaching, ժամանակ</td></tr><tr><td>Reinforcement</td><td>Ինչպե՞ս պահպանել</td><td>Ճանաչում, չափումներ, KPI</td></tr></table></div>
      <p><b>Դիմադրությունը</b> տեղեկատվություն է, ոչ թե թշնամություն. մարդիկ կարող են ունենալ իրական մտահոգություններ (աշխատանքի անվտանգություն, ծանրաբեռնվածություն, հմտություններ)։ Լսիր, ներգրավիր (co-design), արագ լուծիր վավեր խնդիրները։</p>`},
    {t:"Հաղորդակցության պլան", h:"1 ժ", b:`<div class="tbl"><table><tr><th>Ում</th><th>Ինչ</th><th>Երբ</th><th>Ալիք</th><th>Ով</th></tr><tr><td>Բոլոր աշխատակիցներ</td><td>Ինչու և ինչ է փոխվում</td><td>Մեկնարկ, ամսական</td><td>Town hall, email</td><td>Sponsor</td></tr><tr><td>Ազդվող թիմեր</td><td>Ինչպես է փոխվում իրենց աշխատանքը</td><td>Շաբաթական</td><td>Թիմային հանդիպում</td><td>Գծային ղեկավար</td></tr><tr><td>Change champions</td><td>Մանրամասներ, feedback</td><td>Շաբաթական</td><td>Աշխատաժողով</td><td>PM</td></tr><tr><td>Ղեկավարություն</td><td>Առաջընթաց, ռիսկեր, որոշումներ</td><td>Երկշաբաթյա</td><td>Dashboard</td><td>PM</td></tr></table></div>
      <p>Հետազոտությունները (Prosci) ցույց են տալիս, որ աշխատակիցները նախընտրում են լսել «ինչու»-ն բարձրագույն ղեկավարից, իսկ «ինչպես է դա ազդում ինձ վրա»-ն՝ իրենց անմիջական ղեկավարից։</p>`}

function HOME(){
  const wrap=el("div",{style:"display:flex;flex-direction:column;gap:24px"});
  const cat=el("div",{class:"catalog"});
  COURSES.forEach(c=>{const k=courseStats(c); const s=st(c.id);
    const a=el("a",{href:"#"+c.id,class:"course-card",style:`--cc:var(--c-${c.id})`});
    a.innerHTML=`<span class="eyebrow">${c.weeks.length} մոդուլ · ${k.lessonsTotal} դաս · քննություն + վկայական</span><h3>${c.title}</h3><p class="small muted">${c.lead}</p>
      <span class="fill"><i style="width:${k.pct}%"></i></span>
      <div class="meta"><span class="mono">${k.pct}% · թեստեր ${k.quizzes}/${c.weeks.length}</span><span>${s.cert?'<span class="pill ok">Վկայական ստացված</span>':(k.pct>0?"Ընթացքում":"Չսկսված")}</span></div>`;
    cat.appendChild(a);});
  wrap.appendChild(cat);
  const p=el("section",{class:"panel"});
  p.innerHTML=`<div><span class="eyebrow">Մեթոդ</span><h2>Ինչպես է կառուցված ուսուցումը</h2></div>
  <div class="method">
   <div class="box"><span class="pill">1 · Պարզից բարդ</span><p>Ամեն դաս սկսվում է պարզ բացատրությամբ և կյանքից օրինակով, հետո՝ մանրամասն նյութ բանաձևերով, աղյուսակներով և աղբյուրներով։ Չհասկացածը կարող ես հարցնել հենց դասի տակ։</p></div>
   <div class="box"><span class="pill">2 · Case method</span><p>Harvard Business School-ի ոճով. իրական իրավիճակներ, որոշումներ անորոշության պայմաններում, trade-off-ներ։ Ավարտական քննության հարցերը սցենարային են։</p></div>
   <div class="box"><span class="pill">3 · Retrieval practice</span><p>Ինքնաստուգումը սովորեցնում է ավելի լավ, քան կրկնակի ընթերցումը (Roediger & Karpicke)։ Ամեն մոդուլ ունի թեստ, իսկ «Թեստային առաջադրանքներ» բաժնում կարող ես ստեղծել անսահմանափակ նոր հարցեր։</p></div>
   <div class="box"><span class="pill">4 · Deliberate practice</span><p>Ամեն մոդուլ ունի գործնական առաջադրանք, որը ստանում է AI գնահատում՝ ուժեղ կողմեր, բացեր և հաջորդ քայլեր։ Աշխատանքները կառուցվում են մեկ capstone նախագծի շուրջ։</p></div>
   <div class="box"><span class="pill ms">5 · Քննություն և վկայական</span><p>Մոդուլային թեստեր (≥70%), առնվազն ${PRACTICE_MIN} գործնական և ժամաչափված ավարտական քննություն (≥${PASS_FINAL}%)։ Դրանից հետո՝ անվանական վկայական։</p></div>
  </div>
  ${ACAD.homeNote}`;
  wrap.appendChild(p);
  return wrap;
}

function outBox(b){const o=el("div",{class:"formula"});b.appendChild(o);return o;}
const fmt=(n,d=2)=>Number.isFinite(n)?n.toLocaleString("en-US",{maximumFractionDigits:d}):"—";
const EXTRA_TOOLS={
  cost(){const b=el("div",{class:"box"}); b.appendChild(el("h3",{},"Գործարքների տարեկան ծախսի հաշվիչ"));
    const g=el("div",{class:"cols"}); g.append(numField("cc","Կապիտալ ($)",10000),numField("crt","Ծախս մեկ round trip-ում (%)",0.05),numField("cn","Round trip-ներ օրական",2),numField("cd","Առևտրային օրեր տարեկան",250)); b.appendChild(g);
    const out=outBox(b);
    const calc=()=>{const C=+$("#cc",b).value,r=+$("#crt",b).value/100,n=+$("#cn",b).value,d=+$("#cd",b).value;const y=C*r*n*d;
      out.textContent=`Ծախս մեկ round trip-ում = $${fmt(C*r)}\nՏարեկան ծախս = $${fmt(y,0)}  =  ${fmt(y/C*100,1)}% կապիտալից\nՀամախառն եկամուտը պետք է գերազանցի այս թիվը, որ զուտ արդյունքը լինի դրական։`;};
    b.addEventListener("input",calc); calc(); return b;},
  expect(){const b=el("div",{class:"box"}); b.appendChild(el("h3",{},"Expectancy և R հաշվիչ"));
    const g=el("div",{class:"cols"}); g.append(numField("ew","Win rate (%)",40),numField("eaw","Միջին շահույթ (R)",2.5),numField("eal","Միջին վնաս (R)",1),numField("en","Գործարքների քանակ",100),numField("er","1R ($)",100)); b.appendChild(g);
    const out=outBox(b);
    const calc=()=>{const W=+$("#ew",b).value/100,aw=+$("#eaw",b).value,al=+$("#eal",b).value,n=+$("#en",b).value,R=+$("#er",b).value;const E=W*aw-(1-W)*al;const pf=(1-W)*al>0?(W*aw)/((1-W)*al):Infinity;const be=aw+al>0?al/(aw+al):0;
      out.textContent=`Expectancy = ${fmt(E,3)}R մեկ գործարքում\nՍպասվող արդյունք ${n} գործարքում ≈ ${fmt(E*n,1)}R = $${fmt(E*n*R,0)}\nProfit factor = ${fmt(pf)}\nBreak-even win rate այս R-ով = ${fmt(be*100,1)}%`;};
    b.addEventListener("input",calc); calc(); return b;},
  dd(){const b=el("div",{class:"box"}); b.appendChild(el("h3",{},"Կորուստ և վերականգնում"));
    const g=el("div",{class:"cols"}); g.append(numField("ddl","Կորուստ (%)",30),numField("ddr","Ռիսկ մեկ գործարքում (%)",1),numField("ddn","Վնասների շարք",10)); b.appendChild(g);

const $=(s,r=document)=>r.querySelector(s);
function el(tag,attrs={},html){const e=document.createElement(tag);for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const quizPass=(c,w)=>{const q=st(c.id).quiz[w.n];return !!(q&&q.best>=Math.ceil(w.quiz.length*PASS_QUIZ));};
function weekProgress(c,w){
  const s=st(c.id); const total=w.lessons.length+2; let done=0;
  w.lessons.forEach((_,i)=>{if(s.lessons[w.n+"-"+i])done++;});
  if(s.practice[w.n])done++; if(quizPass(c,w))done++;
  return {done,total,pct:Math.round(done/total*100)};
}
function courseStats(c){
  const s=st(c.id); let d=0,t=0;
  c.weeks.forEach(w=>{const p=weekProgress(c,w);d+=p.done;t+=p.total;});
  t+=1; if(s.final&&s.final.pass)d++;
  return {
    pct:Math.round(d/t*100),
    lessons:c.weeks.reduce((a,w)=>a+w.lessons.filter((_,i)=>s.lessons[w.n+"-"+i]).length,0),
    lessonsTotal:c.weeks.reduce((a,w)=>a+w.lessons.length,0),
    practice:c.weeks.filter(w=>s.practice[w.n]).length,
    quizzes:c.weeks.filter(w=>quizPass(c,w)).length,
    final:s.final
  };
}
function certReady(c){const k=courseStats(c);return {quizzes:k.quizzes===c.weeks.length,practice:k.practice>=PRACTICE_MIN,final:!!(k.final&&k.final.pass)};}
const nextWeek=c=>{for(const w of c.weeks){if(weekProgress(c,w).pct<100)return w.n;}return c.weeks.length;};
function fmtDate(d,opt){try{return new Date(d).toLocaleDateString("hy-AM",opt||{day:"numeric",month:"long",year:"numeric"});}catch(e){return new Date(d).toDateString();}}
function stripHtml(h){const d=document.createElement("div");d.innerHTML=h;return d.textContent.replace(/\s+/g," ").trim();}

function route(){
  const h=(location.hash||"").slice(1);
  const m=h.match(new RegExp("^("+CID.join("|")+")(?:-(w\\d+|exam|extra|cert))?$"));
  if(!m)return{v:"home"};
  const c=course(m[1]); const sub=m[2]||"";
  if(sub.startsWith("w"))return{v:"week",c,n:Math.max(1,Math.min(+sub.slice(1),c.weeks.length))};
  if(sub==="exam")return{v:"exam",c};
  if(sub==="extra"&&c.extra)return{v:"extra",c};
  if(sub==="cert")return{v:"cert",c};
  return{v:"course",c};
}

function qaBox(c,qkey,context,label,open){

  d.appendChild(el("summary",{},`${label}${s.qa[qkey]&&s.qa[qkey].length?` <span class="mono small muted">(${Math.ceil(s.qa[qkey].length/2)})</span>`:""}`));

  const draw=()=>{thread.innerHTML="";(s.qa[qkey]||[]).forEach(m=>{const b=el("div",{class:"msg "+(m.r==="u"?"u":"a")});b.textContent=m.t;thread.appendChild(b);});};
  draw();
  const ta=el("textarea",{class:"qa-in",id:"qa-"+qkey.replace(/[^a-z0-9]/gi,"-"),placeholder:ACAD.qaPh});
  const send=el("button",{class:"btn small"},"Հարցնել");
  const clear=el("button",{class:"btn small ghost"},"Մաքրել զրույցը");
  const status=el("span",{class:"small muted"});
  send.addEventListener("click",async()=>{
    const q=ta.value.trim(); if(!q){ta.focus();return;}
    s.qa[qkey]=(s.qa[qkey]||[]).concat({r:"u",t:q}); ta.value=""; draw();
    const bubble=el("div",{class:"msg a"}); bubble.textContent="Մտածում եմ…"; thread.appendChild(bubble);
    send.disabled=true; status.textContent="";

    if(msgs[0].role!=="user")msgs.shift();
    try{const r=await sample(msgs,{modelTier:"default",cache:false,onText:({text})=>{bubble.textContent=text;}});
      s.qa[qkey].push({r:"a",t:r.text}); s.qa[qkey]=s.qa[qkey].slice(-30); persist(); draw();}
    catch(e){bubble.textContent=e&&e.code==="not_granted"?"Հարց ու պատասխանը հասանելի չէ այս դիտման մեջ։":"Չհաջողվեց պատասխանել։ Փորձիր նորից։"; s.qa[qkey].pop(); ta.value=q;}
    send.disabled=false;
  });
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))send.click();});
  clear.addEventListener("click",()=>{delete s.qa[qkey];persist();draw();});
  const row=el("div",{class:"row"}); row.append(send,clear,status);
  d.append(thread,ta,row); return d;
}

function quizRunner(qs,onDone,passN){
  const wrap=el("div",{style:"display:flex;flex-direction:column;gap:12px"});
  const name="q"+Math.random().toString(36).slice(2,7);
  qs.forEach((q,i)=>{
    const b=el("div",{class:"q"});
    b.appendChild(el("p",{},`<b class="mono">${i+1}.</b> ${esc(q[0])}`));
    const o=el("div",{class:"opts"});
    q[1].forEach((t,j)=>{const lab=el("label",{class:"opt"});const r=el("input",{type:"radio",name:name+i,value:j,id:name+i+"_"+j});const sp=el("span");sp.textContent=t;lab.append(r,sp);o.appendChild(lab);});
    b.appendChild(o); const ex=el("p",{class:"expl"}); ex.hidden=true; ex.textContent=q[3]; b.appendChild(ex);
    wrap.appendChild(b);
  });
  const res=el("p",{class:"result"}); res.hidden=true;
  const btn=el("button",{class:"btn"},"Ստուգել պատասխանները");
  btn.addEventListener("click",()=>{
    let sc=0;
    wrap.querySelectorAll(".q").forEach((b,i)=>{
      const sel=b.querySelector("input:checked"); const right=qs[i][2];
      b.querySelectorAll(".opt").forEach((lab,j)=>{lab.classList.remove("right","wrong");if(j===right)lab.classList.add("right");else if(sel&&+sel.value===j)lab.classList.add("wrong");});
      b.querySelector(".expl").hidden=false;
      if(sel&&+sel.value===right)sc++;
    });
    res.hidden=false; res.textContent=`Արդյունք՝ ${sc}/${qs.length} (${Math.round(sc/qs.length*100)}%) — ${sc>=passN?"Անցած է ✓":"Չի անցել. կրկնիր դասերը և փորձիր նորից"}`;
    res.style.color=sc>=passN?"var(--ok)":"var(--bad)";
    btn.disabled=true; onDone(sc);
  });
  const again=el("button",{class:"btn ghost",onclick:()=>render()},"Նորից");
  const row=el("div",{class:"row"}); row.append(btn,again);
  wrap.append(row,res); wrap._submit=()=>{if(!btn.disabled)btn.click();}; return wrap;
}

    const types=["վարքային (STAR)","սցենարային","տեխնիկական","case study"]; let qtext=""; let count=0;
    const qbox=el("div",{class:"feedback"}); qbox.textContent="Սեղմիր «Նոր հարց»՝ սկսելու համար։";
    const ta=el("textarea",{id:"iv-"+c.id,placeholder:"Քո պատասխանը…",style:"min-height:140px"});
    const fb=el("div",{class:"feedback"}); fb.hidden=true;
    const nq=el("button",{class:"btn ghost"},"Նոր հարց"), ev=el("button",{class:"btn"},"Գնահատել պատասխանը");
    nq.addEventListener("click",async()=>{nq.disabled=true;fb.hidden=true;ta.value="";const t=types[count++%types.length];qbox.textContent="Պատրաստում եմ հարցը…";
      try{const r=await sample(`Դու ${ROLE[c.id]} պաշտոնի համար հարցազրույց վարող փորձառու hiring manager ես ${ACAD.ivOrg}։ Տուր ՄԵԿ ${t} հարց junior/middle մակարդակի թեկնածուի համար։ Պատասխանիր միայն հարցով, հայերեն, առանց նախաբանի։ Պատահական թեմա՝ ${Math.random().toString(36).slice(2,6)}`,{modelTier:"quick",cache:false});qtext=r.text.trim();qbox.textContent=qtext;}
      catch(e){qbox.textContent="Չհաջողվեց ստանալ հարց։ Փորձիր նորից։";}nq.disabled=false;});
    ev.addEventListener("click",async()=>{if(!qtext||!ta.value.trim()){fb.hidden=false;fb.textContent="Նախ ստացիր հարց և գրիր պատասխանդ։";return;}ev.disabled=true;fb.hidden=false;fb.textContent="Գնահատում եմ…";
      try{const r=await sample(`Դու ${ROLE[c.id]} պաշտոնի հարցազրույց վարող ես։ Հարց՝ «${qtext}»\nԹեկնածուի պատասխան՝ """${ta.value.slice(0,6000)}"""\nԳնահատիր հայերեն, պարզ տեքստով (առանց markdown). Գնահատական X/10, ինչ էր լավ, ինչ պակասեց, ինչպես կհնչեր ուժեղ պատասխանը (կարճ օրինակ)։`,{modelTier:"default",cache:false,onText:({text})=>{fb.textContent=text;}});fb.textContent=r.text;}
      catch(e){fb.textContent="Չհաջողվեց գնահատել։ Փորձիր նորից։";}ev.disabled=false;});
    const row=el("div",{class:"row"}); row.append(nq,ev);
    b.append(qbox,ta,row,fb); return b;}
};

Object.assign(TOOLS,EXTRA_TOOLS);
render();
</script>
