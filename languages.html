  {id:"r1",m:1,t:"Род и согласование",hy:"Սեռ և ածականի համաձայնություն",rule:`<p>Ռուսերենում գոյականն ունի 3 սեռ (հայերենում սեռ չկա, ուստի բառը միշտ սովորեք ածականի հետ)։</p><ul><li><b>Արական</b>՝ բաղաձայն կամ -й (стол, музей) → <span class="ex">новый стол</span></li><li><b>Իգական</b>՝ -а/-я (книга, неделя) → <span class="ex">новая книга</span></li><li><b>Չեզոք</b>՝ -о/-е (окно, море) → <span class="ex">новое окно</span></li><li><b>Հոգնակի</b>՝ <span class="ex">новые книги</span></li></ul><p>-ь վերջավորությունը կարող է լինել և՛ արական (день), և՛ իգական (ночь)։ Նույն կերպ՝ мой/моя/моё/мои, наш/наша/наше/наши։</p>`,qs:[
   {type:"mcq",q:"У меня ___ машина.",o:["новый","новая","новое","новые"],a:1,x:"машина-ն ավարտվում է -а-ով → իգական → новая։"},
   {type:"mcq",q:"Это ___ окно.",o:["большой","большая","большое","большие"],a:2,x:"окно → -о → չեզոք → большое։"},
   {type:"mcq",q:"Где мой ___?",o:["телефон","книга","письмо","сумка"],a:0,x:"мой-ն արական է, իսկ телефон-ը միակ արական բառն է։"},
   {type:"mcq",q:"___ дом очень красивый.",o:["Наш","Наша","Наше","Наши"],a:0,x:"дом → բաղաձայն → արական → наш։"},
   {type:"mcq",q:"Это ___ друзья.",o:["мой","моя","моё","мои"],a:3,x:"друзья՝ հոգնակի → мои։"},
   {type:"gap",q:"Это очень ___ (интересный) книга.",acc:["интересная"],x:"книга՝ իգական → -ая։"}]},
  {id:"r2",m:1,t:"Предложный падеж",hy:"Նախդրային հոլով (որտե՞ղ, ում մասին)",rule:`<p><b>Где?</b> (որտե՞ղ) → <code>в / на + -е</code>՝ <span class="ex">в Москве, на работе, в школе</span>։ Հայերենի «-ում» կամ «վրա»։</p><ul><li>-ия → -ии՝ <span class="ex">в России, в Армении</span></li><li><b>о + նախդրային</b>՝ «մասին»՝ <span class="ex">о маме, о работе</span>, դերանուններ՝ обо мне, о тебе</li><li><b>на</b>՝ բաց տարածքներ և միջոցառումներ (на улице, на работе, на концерте), <b>в</b>՝ փակ տարածքներ, քաղաքներ, երկրներ</li></ul>`,qs:[
   {type:"mcq",q:"Я живу в ___.",o:["Москва","Москве","Москву","Москвой"],a:1,x:"Где? → в + նախդրային → Москве։"},
   {type:"mcq",q:"Мы работаем на ___.",o:["завод","заводе","завода","заводом"],a:1,x:"на + նախդրային → заводе։"},
   {type:"gap",q:"Мой брат живёт в ___ (Армения).",acc:["Армении"],x:"-ия → -ии։"},
   {type:"mcq",q:"Книга лежит на ___.",o:["стол","столе","стола","столу"],a:1,x:"Որտե՞ղ է → на столе։"},
   {type:"gap",q:"Мы говорим о ___ (работа).",acc:["работе"],x:"о + նախդրային → работе։"},
   {type:"mcq",q:"Она учится в ___.",o:["университет","университете","университета","университету"],a:1,x:"Где? → в университете։"}]},
  {id:"r3",m:2,t:"Винительный падеж",hy:"Հայցական (ի՞նչ, ո՞ւմ, ո՞ւր)",rule:`<p>Ուղիղ խնդիր (ի՞նչ եմ տեսնում, ո՞ւմ եմ սիրում)՝</p><ul><li>Իգական՝ -а → <b>-у</b>, -я → <b>-ю</b>՝ <span class="ex">читаю книгу, вижу Таню</span></li><li>Արական անշունչ և չեզոք՝ չի փոխվում՝ <span class="ex">вижу стол, окно</span></li><li>Արական շնչավոր՝ <b>-а/-я</b>՝ <span class="ex">вижу брата</span></li></ul><p><b>Куда?</b> (ո՞ւր) → <code>в / на + հայցական</code>՝ <span class="ex">еду в Москву, иду на работу</span>։ Համեմատեք՝ в Москве (որտե՞ղ) ↔ в Москву (ո՞ւր)։</p>`,qs:[
   {type:"mcq",q:"Я читаю ___.",o:["книга","книгу","книге","книгой"],a:1,x:"Ուղիղ խնդիր, իգական -а → -у։"},
   {type:"mcq",q:"Я вижу ___.",o:["брат","брата","брату","братом"],a:1,x:"Արական շնչավոր → -а։"},
   {type:"gap",q:"Мы идём на ___ (работа).",acc:["работу"],x:"Куда? → на + հայցական → работу։"},
   {type:"mcq",q:"Она любит ___.",o:["музыка","музыку","музыке","музыки"],a:1,x:"Ուղիղ խնդիր → музыку։"},
   {type:"mcq",q:"Я еду в ___.",o:["Москве","Москву","Москва","Москвы"],a:1,x:"Ո՞ւր → в Москву (ոչ թե в Москве)։"},
   {type:"gap",q:"Я покупаю ___ (вода).",acc:["воду"],x:"-а → -у։"}]},
  {id:"r4",m:2,t:"Родительный падеж",hy:"Սեռական (չկա, -ի, քանակ)",rule:`<ul><li><b>нет + սեռական</b>՝ <span class="ex">нет времени, нет машины</span></li><li><b>у меня есть / нет</b>՝ «ունեմ / չունեմ»</li><li>Պատկանելություն՝ <span class="ex">книга брата</span> (եղբոր գիրքը)</li><li>Քանակ՝ <span class="ex">много воды, стакан чая</span></li></ul><p>Վերջավորություններ՝ արական/չեզոք <b>-а/-я</b>, իգական <b>-ы/-и</b>։</p><p><b>Թվեր</b>՝ 1 + ուղղական (один брат), 2–4 + եզակի սեռական (два брата), 5+ + հոգնակի սեռական (пять братьев)։ Հայերենում թվից հետո բառը չի փոխվում, ուստի այս կանոնը պետք է հատուկ մարզել։</p>`,qs:[
   {type:"mcq",q:"У меня нет ___.",o:["машина","машины","машину","машине"],a:1,x:"нет + սեռական, իգական → -ы։"},
   {type:"mcq",q:"Это книга ___.",o:["брат","брата","брату","братом"],a:1,x:"Պատկանելություն → սեռական → брата։"},
   {type:"mcq",q:"У меня два ___.",o:["брат","брата","братьев","братья"],a:1,x:"2–4 + եզակի սեռական։"},
   {type:"mcq",q:"У нас пять ___.",o:["урок","урока","уроков","уроки"],a:2,x:"5 և ավելի → հոգնակի սեռական → уроков։"},
   {type:"gap",q:"Сегодня нет ___ (дождь).",acc:["дождя"],x:"нет + սեռական, -ь → -я։"},
   {type:"mcq",q:"Дайте, пожалуйста, стакан ___.",o:["вода","воды","воду","водой"],a:1,x:"Քանակ (բաժակ ջուր) → սեռական → воды։"}]},
  {id:"r5",m:3,t:"Глаголы движения",hy:"Շարժման բայեր",rule:`<p>Հայերենի մեկ «գնալ»-ի փոխարեն ռուսերենը տարբերում է երկու բան՝</p><ul><li><b>Ոտքով</b>՝ идти / ходить, <b>տրանսպորտով</b>՝ ехать / ездить</li><li><b>идти, ехать</b>՝ մեկ ուղղությամբ, հենց հիմա՝ <span class="ex">Я иду домой.</span></li><li><b>ходить, ездить</b>՝ կրկնվող կամ գնալ-գալ՝ <span class="ex">Я хожу в спортзал. Вчера я ходил в кино.</span></li></ul><p>Խոնարհում՝ иду, идёшь, идут · еду, едешь, едут · хожу, ходишь, ходят · езжу, ездишь, ездят։</p>`,qs:[
   {type:"mcq",q:"Сейчас я ___ домой пешком.",o:["иду","хожу","еду","езжу"],a:0,x:"Հիմա, մեկ ուղղությամբ, ոտքով → иду։"},
   {type:"mcq",q:"Каждый день она ___ на работу на автобусе.",o:["едет","ездит","идёт","ходит"],a:1,x:"Ամեն օր (կրկնվող), տրանսպորտով → ездит։"},
   {type:"mcq",q:"Куда ты ___ сейчас на машине?",o:["едешь","ездишь","идёшь","ходишь"],a:0,x:"Հիմա, մեքենայով → едешь։"},
   {type:"mcq",q:"Мы часто ___ в кино.",o:["идём","ходим","едем","ездим"],a:1,x:"Հաճախ (կրկնվող) → ходим։"},
   {type:"mcq",q:"Вчера я ___ в театр.",o:["шёл","ходил","ехал","иду"],a:1,x:"Գնացել եմ ու վերադարձել → ходил։"},
   {type:"gap",q:"Летом мы ___ (ездить) на море каждый год.",acc:["ездим"],x:"мы ездим։"}]},
  {id:"r6",m:4,t:"Вид глагола",hy:"Բայի ասպեկտ",rule:`<p>Ռուսերենի մեծ մասի բայերը զույգեր են՝</p><ul><li><b>Անկատար</b> (несовершенный)՝ գործընթաց կամ կրկնություն՝ <span class="ex">делал, читал</span> — «անում էի, կարդում էի»</li><li><b>Կատարյալ</b> (совершенный)՝ մեկանգամյա արդյունք՝ <span class="ex">сделал, прочитал</span> — «արեցի, կարդացի»</li></ul><p>Ապառնի՝ <code>буду + անկատար ինֆինիտիվ</code> (буду читать) կամ կատարյալի դիմավոր ձևը (прочитаю)։ <b>Երբեք</b> буду + կատարյալ։</p>`,qs:[
   {type:"mcq",q:"Вчера я весь вечер ___ книгу.",o:["читал","прочитал","прочитаю","буду читать"],a:0,x:"Ամբողջ երեկո՝ գործընթաց → читал։"},
   {type:"mcq",q:"Я уже ___ эту книгу, можешь взять.",o:["читал","прочитал","читаю","буду читать"],a:1,x:"Արդյունք կա (ավարտել եմ) → прочитал։"},
   {type:"mcq",q:"Каждое утро он ___ кофе.",o:["пьёт","выпьет","выпил","выпьем"],a:0,x:"Ամեն առավոտ՝ կրկնություն → անկատար пьёт։"},
   {type:"mcq",q:"Завтра я ___ тебе.",o:["позвоню","звонил","позвонил","звоню"],a:0,x:"Մեկանգամյա գործողություն ապագայում → позвоню։"},
   {type:"gap",q:"Что ты будешь ___ (делать / сделать) в субботу?",acc:["делать"],x:"буду + միայն անկատար ինֆինիտիվ։"},
   {type:"mcq",q:"Она ___ письмо и отправила его.",o:["писала","написала","пишет","напишет"],a:1,x:"Ավարտեց, հետո ուղարկեց → написала։"}]},
  {id:"r7",m:5,t:"Дательный падеж",hy:"Տրական (ո՞ւմ)",rule:`<p>Ո՞ւմ եմ տալիս, ո՞ւմ եմ զանգում։ Իգական՝ <b>-е</b> (маме), արական/չեզոք՝ <b>-у/-ю</b> (брату)։ Դերանուններ՝ мне, тебе, ему, ей, нам, вам, им։</p><ul><li><span class="ex">Мне нравится…</span> — Ինձ դուր է գալիս (հոգնակիով՝ нравятся)</li><li><span class="ex">Мне нужно…</span> — Ինձ պետք է</li><li><span class="ex">Мне 25 лет. Мне холодно.</span></li><li><b>к + տրական</b>՝ մոտ՝ <span class="ex">иду к врачу</span></li></ul>`,qs:[
   {type:"mcq",q:"___ нравится этот фильм.",o:["Я","Меня","Мне","Мной"],a:2,x:"нравиться-ի հետ անձը տրականով է՝ мне։"},
   {type:"mcq",q:"Я звоню ___.",o:["мама","маму","маме","мамой"],a:2,x:"звонить кому? → տրական → маме։"},
   {type:"gap",q:"___ (он) тридцать лет.",acc:["Ему"],x:"Տարիքը՝ տրականով → ему։"},
   {type:"mcq",q:"Нам ___ купить билеты.",o:["нужно","нужен","нужна","нужны"],a:0,x:"Ինֆինիտիվի հետ → нужно։"},
   {type:"mcq",q:"Я иду к ___.",o:["врач","врача","врачу","врачом"],a:2,x:"к + տրական → врачу։"},
   {type:"mcq",q:"Мне ___ эти цветы.",o:["нравится","нравятся","нравиться","нравишься"],a:1,x:"цветы՝ հոգնակի → нравятся։"}]},
  {id:"r8",m:6,t:"Творительный падеж",hy:"Գործիական (ինչո՞վ, ո՞ւմ հետ)",rule:`<p>Արական/չեզոք՝ <b>-ом/-ем</b> (с братом), իգական՝ <b>-ой/-ей</b> (с мамой)։ Դերանուններ՝ со мной, с тобой, с ним, с ней, с нами։</p><ul><li><b>с + գործիական</b>՝ հետ՝ <span class="ex">чай с сахаром</span></li><li>Մասնագիտություն՝ <span class="ex">работать / быть / стать врачом</span></li><li>Զբաղմունք՝ <span class="ex">заниматься спортом, интересоваться музыкой</span></li></ul>`,qs:[
   {type:"mcq",q:"Я пью чай с ___.",o:["сахар","сахара","сахаром","сахару"],a:2,x:"с + գործիական → сахаром։"},
   {type:"mcq",q:"Она работает ___.",o:["врач","врача","врачом","врачу"],a:2,x:"работать кем? → врачом։"},
   {type:"mcq",q:"Ты пойдёшь со ___ в кино?",o:["я","мне","мной","меня"],a:2,x:"со мной։"},
   {type:"gap",q:"Он занимается ___ (спорт).",acc:["спортом"],x:"заниматься чем? → спортом։"},
   {type:"mcq",q:"Мы гуляли с ___.",o:["подруга","подругу","подругой","подруге"],a:2,x:"с + իգական → -ой։"},

   {id:"rl1",m:1,title:"Мой день",text:"Меня зовут Арам. Я живу в Ереване и работаю в банке. Каждый день я встаю в семь часов. Сначала я пью кофе, потом еду на работу на метро. Работа начинается в девять. Обычно я обедаю с коллегами в кафе рядом с офисом. Вечером я хожу в спортзал или гуляю с друзьями. В выходные я люблю читать и смотреть фильмы. В субботу я обычно звоню маме.",qs:[{q:"Где работает Арам?",o:["в школе","в банке","в кафе","в спортзале"],a:1},{q:"Как он едет на работу?",o:["на автобусе","на метро","на машине","пешком"],a:1},{q:"Во сколько начинается работа?",o:["в семь","в восемь","в девять","в десять"],a:2},{q:"Что он обычно делает в субботу?",o:["звонит маме","работает","ходит в банк","едет на море"],a:0}],dict:["Каждый день я встаю в семь часов.","В выходные я люблю читать и смотреть фильмы."]},
   {id:"rl2",m:2,title:"В магазине",text:"Уважаемые покупатели! Наш магазин работает каждый день с девяти утра до десяти вечера. Сегодня у нас большие скидки на фрукты и овощи. Свежий хлеб вы можете купить в начале зала, справа от входа. Если вам нужна помощь, обратитесь к нашим сотрудникам. Касса номер пять сегодня не работает. Спасибо за покупку!",qs:[{q:"Когда работает магазин?",o:["с восьми до десяти","с девяти до десяти","с девяти до девяти","с десяти до десяти"],a:1},{q:"На что сегодня скидки?",o:["на хлеб","на фрукты и овощи","на молоко","на всё"],a:1},{q:"Где можно купить хлеб?",o:["справа от входа","слева от кассы","в конце зала","на втором этаже"],a:0},{q:"Какая касса не работает?",o:["третья","четвёртая","пятая","шестая"],a:2}],dict:["Сегодня у нас большие скидки на фрукты и овощи.","Если вам нужна помощь, обратитесь к нашим сотрудникам."]},
   {id:"rl3",m:4,title:"Поездка в Петербург",text:"Прошлым летом мы с женой ездили в Санкт-Петербург. Мы были там неделю. Погода была не очень хорошая: почти каждый день шёл дождь. Но нам всё равно очень понравилось. Мы ходили в Эрмитаж, гуляли по Невскому проспекту и смотрели, как ночью разводят мосты. Самое интересное — белые ночи: в июне там почти не бывает темно. В следующем году мы хотим поехать в Москву.",qs:[{q:"Куда они ездили?",o:["в Москву","в Санкт-Петербург","на море","в Ереван"],a:1},{q:"Какая была погода?",o:["жаркая","почти каждый день шёл дождь","шёл снег","очень хорошая"],a:1},{q:"Что особенного там в июне?",o:["белые ночи","снег","скидки","праздник"],a:0},{q:"Куда они хотят поехать в следующем году?",o:["в Москву","в Сочи","в Минск","в Казань"],a:0}],dict:["Погода была не очень хорошая.","В следующем году мы хотим поехать в Москву."]}

 tr:{name:"Թուրքերեն",native:"Türkçe",bcp:"tr-TR",exam:"TYS",
  months:["Ձայնավորների ներդաշնակություն, հոլովներ","Ներկա -iyor, պատկանելություն","Անցյալ -di, հայցական, ապառնի -ecek","Բազմակի ժամանակ -ir","-miş, -ebil, -meli","-se, դերբայներ -en/-dik, -ip/-ince/-ken"],
  units:[
  {id:"t1",m:1,t:"Ünlü uyumu, -ler/-lar, var/yok",hy:"Ձայնավորների ներդաշնակություն, հոգնակի",rule:`<p>Բառի <b>վերջին ձայնավորը</b> որոշում է վերջածանցի ձայնավորը։</p><ul><li><b>2 ձև</b> (e/a)՝ e, i, ö, ü-ից հետո → e, a, ı, o, u-ից հետո → a՝ <span class="ex">evler, kitaplar</span>։ Հայերենի «-եր/-ներ»-ի նման</li><li><b>4 ձև</b> (i/ı/ü/u)՝ e,i → i · a,ı → ı · o,u → u · ö,ü → ü</li><li><b>var</b> = կա, <b>yok</b> = չկա՝ <span class="ex">Evde kedi var. Param yok.</span></li><li>Թվից հետո <b>հոգնակի չի դրվում</b>՝ <span class="ex">iki kalem</span> (ոչ iki kalemler)</li></ul>`,qs:[
   {type:"mcq",q:"kitap + հոգնակի → ___",o:["kitapler","kitaplar","kitaplır","kitaplur"],a:1,x:"Վերջին ձայնավորը a է → -lar։"},
   {type:"mcq",q:"ev + հոգնակի → ___",o:["evlar","evler","evlır","evlür"],a:1,x:"Վերջին ձայնավորը e է → -ler։"},
   {type:"mcq",q:"Evde kedi ___. (կա)",o:["var","yok","değil","mi"],a:0,x:"var = կա։"},
   {type:"mcq",q:"Masada iki ___ var.",o:["kalem","kalemler","kalemlar","kalemi"],a:0,x:"Թվից հետո գոյականը մնում է եզակի։"},
   {type:"mcq",q:"Bugün param ___. (չկա)",o:["var","yok","değil","mı"],a:1,x:"yok = չկա։"},
   {type:"mcq",q:"okul + հոգնակի → ___",o:["okuller","okullar","okullır","okulür"],a:1,x:"u → 2 ձևում a → -lar։"}]},
  {id:"t2",m:1,t:"-e / -de / -den",hy:"Տրական, տեղական, բացառական",rule:`<p>Հայերենի հոլովների նման՝</p><ul><li><b>-e/-a</b> (ո՞ւր, ում)՝ <span class="ex">eve, okula</span> — «դեպի տուն»։ Ձայնավորից հետո՝ -ye/-ya՝ <span class="ex">sinemaya</span></li><li><b>-de/-da</b> (որտե՞ղ)՝ <span class="ex">evde, okulda</span> — «տանը, դպրոցում»</li><li><b>-den/-dan</b> (որտեղի՞ց)՝ <span class="ex">evden, okuldan</span> — «տնից, դպրոցից»</li></ul><p>Խուլ բաղաձայններից (p, ç, t, k, f, s, ş, h) հետո d → t՝ <span class="ex">Paris'te, Paris'ten</span>։ Հատուկ անունները՝ ապաթարցով։</p>`,qs:[
   {type:"mcq",q:"Ben ___ yaşıyorum. (Երևանում)",o:["Erivan'a","Erivan'da","Erivan'dan","Erivan'ı"],a:1,x:"Որտե՞ղ → -da։"},
   {type:"mcq",q:"___ geliyorum. (դպրոցից)",o:["Okula","Okulda","Okuldan","Okulu"],a:2,x:"Որտեղի՞ց → -dan։"},
   {type:"mcq",q:"Yarın ___ gidiyoruz. (Ստամբուլ, ո՞ւր)",o:["İstanbul'a","İstanbul'da","İstanbul'dan","İstanbul'u"],a:0,x:"Ո՞ւր → -a։"},
   {type:"mcq",q:"Kitap ___. (սեղանի վրա է)",o:["masada","masaya","masadan","masayı"],a:0,x:"Որտե՞ղ → -da։"},
   {type:"mcq",q:"Uçak ___ kalkıyor. (Փարիզից)",o:["Paris'ten","Paris'den","Paris'te","Paris'e"],a:0,x:"s-ից հետո d → t → -ten։"},
   {type:"gap",q:"Akşam ___ gidelim. (sinema → ո՞ւր)",acc:["sinemaya"],x:"Ձայնավորից հետո -ya։"}]},
  {id:"t3",m:2,t:"Şimdiki zaman -iyor",hy:"Ներկա ժամանակ -iyor",rule:`<p>Բայահիմք + <b>-iyor</b> (i/ı/u/ü) + դեմք՝ -um, -sun, —, -uz, -sunuz, -lar։</p><ul><li><span class="ex">geliyorum, geliyorsun, geliyor, geliyoruz, geliyorsunuz, geliyorlar</span></li><li>Ձայնավորով ավարտվող հիմք՝ ձայնավորը ընկնում է՝ <span class="ex">başla → başlıyorum</span></li><li>git → gid (ձայնավորից առաջ)՝ <span class="ex">gidiyorum</span></li><li>Ժխտական՝ <b>-m-</b>՝ <span class="ex">gelmiyorum</span>։ Հարց՝ <b>mu</b> + դեմք՝ <span class="ex">geliyor musun?</span></li></ul>`,qs:[
   {type:"mcq",q:"Ben şimdi kitap ___.",o:["okuyorum","okuyorsun","okuyor","okuyoruz"],a:0,x:"Ben → -um։"},
   {type:"mcq",q:"Sen nereye ___?",o:["gidiyorum","gidiyorsun","gidiyor","gidiyoruz"],a:1,x:"Sen → -sun։"},
   {type:"mcq",q:"Onlar Türkçe ___.",o:["öğreniyorlar","öğreniyoruz","öğreniyorsun","öğreniyorum"],a:0,x:"Onlar → -lar։"},
   {type:"gap",q:"Ben kahve ___. (içmek, ժխտական)",acc:["içmiyorum"],x:"iç + mi + yor + um։"},
   {type:"mcq",q:"Sen beni anlıyor ___?",o:["mi","mu","musun","misin"],a:2,x:"-yor-ից հետո՝ mu + sun → musun։"},
   {type:"mcq",q:"Biz saat dokuzda ___. (başlamak)",o:["başlıyoruz","başlayoruz","başlarız","başlıyorlar"],a:0,x:"a-ն ընկնում է → başlıyoruz։"}]},
  {id:"t4",m:2,t:"İyelik ekleri ve -(n)in",hy:"Պատկանելություն և սեռական",rule:`<ul><li>Իմ՝ <b>-(i)m</b>, քո՝ <b>-(i)n</b>, նրա՝ <b>-(s)i</b>, մեր՝ <b>-(i)miz</b>, ձեր՝ <b>-(i)niz</b>, նրանց՝ <b>-leri</b></li><li><span class="ex">evim, evin, evi · arabam, araban, arabası</span></li><li>Սեռական՝ <b>-(n)in</b>՝ <span class="ex">benim evim, Ali'nin arabası</span> — ճիշտ հայերենի «Ալիի մեքենան» կառույցով</li><li>k → ğ ձայնավորից առաջ՝ <span class="ex">çocuk → çocuğu</span>, p → b՝ <span class="ex">kitap → kitabı</span></li></ul>`,qs:[
   {type:"mcq",q:"Bu benim ___. (տուն)",o:["evim","evin","evi","evimiz"],a:0,x:"benim → -im։"},
   {type:"mcq",q:"Senin ___ nerede? (մեքենա)",o:["araban","arabam","arabası","arabanız"],a:0,x:"senin → -n։"},
   {type:"mcq",q:"___ kardeşi doktor. (Ալիի)",o:["Ali'nin","Ali'ye","Ali'de","Ali'yi"],a:0,x:"Սեռական → -nin։"},
   {type:"gap",q:"Onun ___ çok güzel. (anne)",acc:["annesi"],x:"Ձայնավորից հետո՝ -si։"},
   {type:"mcq",q:"Bizim ___ büyük. (տուն)",o:["evimiz","eviniz","evleri","evim"],a:0,x:"bizim → -imiz։"},
   {type:"mcq",q:"Kitabın ___ ne? (ad)",o:["adı","adım","adın","adısı"],a:0,x:"Գրքի անունը → adı։"}]},
  {id:"t5",m:3,t:"Geçmiş zaman -di, -(y)i",hy:"Անցյալ -di և հայցական",rule:`<p><b>-di/-dı/-du/-dü</b> (խուլից հետո -ti/-tı/-tu/-tü) + -m, -n, —, -k, -niz, -ler՝ <span class="ex">geldim, gittin, yaptı, okuduk</span>։ Ժխտ.՝ <span class="ex">gelmedim</span>։</p><p><b>Հայցական -(y)i</b>՝ որոշյալ ուղիղ խնդիր՝ <span class="ex">Kitabı okudum</span> (կարդացի գիրքը) ↔ <span class="ex">Kitap okudum</span> (գիրք կարդացի)։ Հայերենի «-ը/-ն» հոդի նման։</p>`,qs:[
   {type:"mcq",q:"Dün sinemaya ___. (ես)",o:["gittim","gittin","gitti","gittik"],a:0,x:"ben → -m։ t-ից հետո -ti։"},
   {type:"mcq",q:"Biz akşam yemeği ___.",o:["yedik","yedim","yediler","yediniz"],a:0,x:"biz → -k։"},
   {type:"mcq",q:"O, ___ okudu. (այդ գիրքը)",o:["kitabı","kitap","kitaba","kitapta"],a:0,x:"Որոշյալ ուղիղ խնդիր → kitabı։"},
   {type:"gap",q:"Ben dün ___. (çalışmak, ժխտական)",acc:["çalışmadım"],x:"çalış + ma + dı + m։"},
   {type:"mcq",q:"Sen ___ gördün mü? (ֆիլմը)",o:["filmi","filme","filmde","filmden"],a:0,x:"Որոշյալ ուղիղ խնդիր → filmi։"},
   {type:"mcq",q:"Onlar geçen yıl Türkiye'ye ___.",o:["gittiler","gittik","gittin","gidiyorum"],a:0,x:"onlar → -ler։"}]},
  {id:"t6",m:3,t:"Gelecek -ecek, -ebil",hy:"Ապառնի և կարողանալ",rule:`<p><b>-ecek/-acak</b> + դեմք՝ <span class="ex">geleceğim, geleceksin, gelecek, geleceğiz, geleceksiniz, gelecekler</span>։ k → ğ ձայնավորից առաջ։ Ձայնավորից հետո՝ -yecek՝ <span class="ex">okuyacağım</span>։</p><p><b>-ebil/-abil</b>՝ կարողանալ՝ <span class="ex">yüzebilirim</span> (կարող եմ լողալ)։ Ժխտ.՝ <b>-eme/-ama</b>՝ <span class="ex">yüzemem</span> (չեմ կարող)։</p>`,qs:[
   {type:"mcq",q:"Yarın sana ___. (կզանգեմ)",o:["arayacağım","arayacaksın","arıyorum","aradım"],a:0,x:"ara + y + acağ + ım։"},

  {type:"mcq",q:"They ___ in this flat for five years, and they still love it.",o:["lived","have lived","live","had lived"],a:1,x:"for five years + դեռ ապրում են → Present Perfect։"},
  {type:"gap",q:"The film ___ (just/start). Hurry up!",acc:["has just started","'s just started"],x:"just-ը դրվում է have/has-ի և V3-ի միջև։"},
  {type:"mcq",q:"When ___ you ___ your job?",o:["have / left","did / leave","had / left","do / leave"],a:1,x:"When-ով հարցնում ենք կոնկրետ պահի մասին → Past Simple։"}
 ]},
 {id:"u2",m:1,t:"Past Continuous & Past Perfect",rule:`<p><b>Past Continuous</b> (was/were + -ing)՝ անցյալում ընթացքի մեջ գտնվող գործողություն, որը հաճախ «ընդհատվում է» Past Simple-ով (when, while)։</p><p><b>Past Perfect</b> (had + V3)՝ գործողություն, որը տեղի է ունեցել անցյալի մեկ այլ պահից <b>առաջ</b> (by the time, already, before)։</p><ul><li class="ex">I <b>was cooking</b> when the phone <b>rang</b>.</li><li class="ex">When we arrived, the train <b>had</b> already <b>left</b>.</li></ul>`,qs:[
  {type:"mcq",q:"I ___ dinner when the phone rang.",o:["cooked","was cooking","had cooked","have cooked"],a:1,x:"Երկար գործողությունը ընդհատվում է կարճով → Past Continuous + Past Simple։"},
  {type:"mcq",q:"When we arrived, the train ___ already ___.",o:["has / left","had / left","was / leaving","did / leave"],a:1,x:"Գնացքը մեկնել էր մեր գալուց առաջ → Past Perfect։"},
  {type:"gap",q:"While she ___ (walk) home, it started to rain.",acc:["was walking"],x:"while + ընթացքի մեջ գործողություն → Past Continuous։"},
  {type:"gap",q:"He was tired because he ___ (not/sleep) well the night before.",acc:["hadn't slept","had not slept"],x:"Ավելի վաղ անցյալ (նախորդ գիշեր) → Past Perfect։"},
  {type:"mcq",q:"By the time I got to the cinema, the film ___.",o:["started","had started","was starting","has started"],a:1,x:"by the time + Past Simple → մյուս մասում Past Perfect։"},
  {type:"mcq",q:"What ___ you ___ at 8 pm last night?",o:["did / do","were / doing","had / done","have / done"],a:1,x:"Կոնկրետ պահին ընթացող գործողություն → Past Continuous։"},
  {type:"gap",q:"I realised I ___ (leave) my keys at the office.",acc:["had left","'d left"],x:"Բանալիները թողել էի «հասկանալուց» առաջ → Past Perfect։"},
  {type:"mcq",q:"They ___ TV when the lights went out.",o:["watched","had watched","were watching","have watched"],a:2,x:"Ընթացող գործողություն, որն ընդհատվեց → Past Continuous։"}
 ]},
 {id:"u3",m:2,t:"Conditionals 0–3",rule:`<ul><li><b>Zero</b>՝ If + Present, Present — ընդհանուր ճշմարտություն։ <span class="ex">If you heat ice, it melts.</span></li><li><b>First</b>՝ If + Present, will + V — իրական ապագա։ <span class="ex">If it rains, we'll stay home.</span></li><li><b>Second</b>՝ If + Past, would + V — անիրական ներկա/ապագա։ <span class="ex">If I had time, I would travel.</span></li><li><b>Third</b>՝ If + Past Perfect, would have + V3 — անիրական անցյալ։ <span class="ex">If I had known, I would have helped.</span></li></ul><p>Ուշադրություն՝ if-ով մասում <b>will չենք դնում</b>։ Unless = if not։</p>`,qs:[
  {type:"mcq",q:"If you heat ice, it ___.",o:["melts","will melt","would melt","melted"],a:0,x:"Գիտական ճշմարտություն → Zero conditional։"},
  {type:"gap",q:"If it ___ (rain) tomorrow, we'll stay at home.",acc:["rains"],x:"First conditional. if-ով մասում Present Simple է, ոչ will։"},
  {type:"mcq",q:"If I ___ more time, I would learn Spanish.",o:["have","had","would have","will have"],a:1,x:"would-ով մասը ցույց է տալիս Second conditional → If + Past Simple։"},
  {type:"gap",q:"If she had studied harder, she ___ (pass) the exam.",acc:["would have passed","'d have passed"],x:"Անիրական անցյալ → would have + V3։"},
  {type:"mcq",q:"I ___ him if I were you.",o:["will call","would call","call","would have called"],a:1,x:"If I were you՝ խորհուրդ, Second conditional → would + V։"},
  {type:"mcq",q:"Unless you hurry, you ___ the bus.",o:["miss","would miss","will miss","missed"],a:2,x:"Unless = if not, իրական ապագա → will։"},
  {type:"gap",q:"If we ___ (not/miss) the flight, we would have arrived on time.",acc:["hadn't missed","had not missed"],x:"Third conditional → If + Past Perfect։"},
  {type:"mcq",q:"What would you do if you ___ the lottery?",o:["win","won","will win","had won"],a:1,x:"Երևակայական իրավիճակ → If + Past Simple։"}
 ]},
 {id:"u4",m:2,t:"Modals of deduction & past modals",rule:`<p><b>must</b>՝ համոզված ենք, որ այո. <b>might / may / could</b>՝ հնարավոր է. <b>can't</b>՝ համոզված ենք, որ ոչ։</p><p>Անցյալի մասին՝ <code>modal + have + V3</code>։ <b>should have + V3</b>՝ ափսոսանք կամ քննադատություն։</p><ul><li class="ex">He must <b>have forgotten</b>. — հաստատ մոռացել է</li><li class="ex">You should <b>have told</b> me! — պետք է ասեիր, բայց չասացիր</li></ul>`,qs:[
  {type:"mcq",q:"She's been working all day. She ___ be exhausted.",o:["must","can't","should","mustn't"],a:0,x:"Տրամաբանական եզրակացություն՝ համոզված ենք → must։"},
  {type:"mcq",q:"That ___ be Tom — he's in Paris this week.",o:["must","might","can't","should"],a:2,x:"Համոզված ենք, որ անհնար է → can't։"},
  {type:"gap",q:"I can't find my phone. I ___ (might/leave) it in the taxi.",acc:["might have left"],x:"Անցյալի հնարավորություն → might have + V3։"},
  {type:"mcq",q:"You ___ told me earlier! Now it's too late.",o:["should have","must have","can't have","would"],a:0,x:"Քննադատություն անցյալի մասին → should have + V3։"},
  {type:"gap",q:"He didn't answer. He ___ (must/be) asleep.",acc:["must have been"],x:"Անցյալի մասին վստահ եզրակացություն → must have been։"},
  {type:"mcq",q:"The door is open. Someone ___ forgotten to lock it.",o:["must have","should","can't have","would"],a:0,x:"Ապացույցի հիման վրա եզրակացություն → must have + V3։"},
  {type:"mcq",q:"Take an umbrella — it ___ rain later.",o:["must","might","can't","should have"],a:1,x:"Հնարավորություն ապագայում → might։"},
  {type:"gap",q:"She ___ (can't/see) us — she didn't wave.",acc:["can't have seen","cannot have seen","couldn't have seen"],x:"Անցյալի անհնարինություն → can't have + V3։"}
 ]},
 {id:"u5",m:3,t:"The Passive Voice",rule:`<p>Կրավորական սեռ՝ <code>be + V3</code>։ Օգտագործում ենք, երբ կարևոր է գործողությունը կամ արդյունքը, ոչ թե կատարողը (կատարողը՝ by-ով)։</p><ul><li class="ex">is made · was made · has been made · will be made · is being made · must be made</li><li class="ex">It is expected that… — ձևական, լրատվական ոճ</li></ul>`,qs:[
  {type:"mcq",q:"This bridge ___ in 1890.",o:["built","was built","has built","is building"],a:1,x:"Կամուրջն ինքը չի կառուցել. անցյալ + կրավորական → was built։"},
  {type:"gap",q:"English ___ (speak) all over the world.",acc:["is spoken"],x:"Ընդհանուր փաստ → Present Simple Passive։"},
  {type:"mcq",q:"The results ___ next week.",o:["will announce","will be announced","are announcing","announced"],a:1,x:"Ապագա կրավորական → will be + V3։"},
  {type:"gap",q:"The report ___ (already/send) to the client.",acc:["has already been sent"],x:"Present Perfect Passive → has been + V3, already-ն has-ից հետո։"},
  {type:"mcq",q:"My car ___ at the moment, so I'm taking the bus.",o:["is repairing","is being repaired","has repaired","repairs"],a:1,x:"Հենց հիմա ընթացող կրավորական → is being + V3։"},
  {type:"gap",q:"The meeting ___ (cancel) yesterday because of the storm.",acc:["was cancelled","was canceled"],x:"yesterday → Past Simple Passive։"},
  {type:"mcq",q:"It ___ that the economy will grow next year.",o:["expects","is expected","is expecting","expected"],a:1,x:"Անանձնական կառույց՝ It is expected that…"},
  {type:"mcq",q:"All applications must ___ by Friday.",o:["submit","be submitted","submitted","be submitting"],a:1,x:"Մոդալ + be + V3։"}
 ]},
 {id:"u6",m:3,t:"Reported speech & polite questions",rule:`<p>Անուղղակի խոսքում ժամանակը սովորաբար «մեկ քայլ հետ» է գնում՝ am → was, will → would, have done → had done, do → did։</p><p><b>say</b> something, բայց <b>tell</b> someone something։</p><p>Անուղղակի և քաղաքավարի հարցերում բառակարգը <b>հաստատական</b> է՝ <span class="ex">Could you tell me where the station <b>is</b>?</span> Այո/ոչ հարցերի համար՝ if / whether։</p>`,qs:[
  {type:"mcq",q:"She said she ___ tired.",o:["is","was","has been","will be"],a:1,x:"Ժամանակը «հետ» է գնում՝ am → was։"},
  {type:"gap",q:"\"I will call you,\" he said. → He said he ___ call me.",acc:["would"],x:"will → would։"},
  {type:"mcq",q:"He ___ me that the meeting was cancelled.",o:["said","told","asked","spoke"],a:1,x:"Անձ կա (me) → told։ said-ից հետո անմիջապես անձ չի դրվում։"},
  {type:"mcq",q:"Could you tell me where ___?",o:["is the station","the station is","does the station","the station does be"],a:1,x:"Անուղղակի հարցում բառակարգը հաստատական է։"},
  {type:"gap",q:"\"Where do you live?\" → She asked me where I ___.",acc:["lived"],x:"do live → lived, առանց do-ի։"},
  {type:"mcq",q:"I was wondering ___ you could help me.",o:["that","if","what","do"],a:1,x:"Այո/ոչ քաղաքավարի հարց → if/whether։"},
  {type:"mcq",q:"\"I have finished.\" → She said she ___.",o:["has finished","had finished","finished","have finished"],a:1,x:"have finished → had finished։"},
  {type:"gap",q:"\"Are you coming?\" → He asked ___ I was coming.",acc:["if","whether"],x:"Այո/ոչ հարց → if կամ whether։"}
 ]},
 {id:"u7",m:4,t:"Relative clauses",rule:`<ul><li><b>who</b>՝ մարդ, <b>which</b>՝ առարկա, <b>that</b>՝ երկուսն էլ (միայն որոշիչ նախադասություններում)</li><li><b>whose</b>՝ որի/ում (պատկանելություն), <b>where</b>՝ տեղ, <b>when</b>՝ ժամանակ</li><li>Ստորակետերով (non-defining) նախադասություններում <b>that չի օգտագործվում</b>։</li></ul><p class="ex">My laptop, which I bought last year, has stopped working.</p>`,qs:[
  {type:"mcq",q:"The woman ___ lives next door is a doctor.",o:["which","who","whose","where"],a:1,x:"Մարդ → who։"},
  {type:"mcq",q:"This is the town ___ I grew up.",o:["which","where","when","who"],a:1,x:"Տեղ → where (= in which)։"},
  {type:"gap",q:"That's the man ___ car was stolen.",acc:["whose"],x:"Պատկանելություն (նրա մեքենան) → whose։"},
  {type:"mcq",q:"My laptop, ___ I bought last year, has stopped working.",o:["that","which","who","what"],a:1,x:"Ստորակետերով նախադասություն → which, ոչ that։"},
  {type:"mcq",q:"I'll never forget the day ___ we met.",o:["which","when","where","whose"],a:1,x:"Ժամանակ → when։"},
  {type:"gap",q:"The book ___ you lent me was fantastic.",acc:["that","which"],x:"Որոշիչ նախադասություն, առարկա → that կամ which (կարելի է նաև բաց թողնել)։"},
  {type:"mcq",q:"Paris, ___ is the capital of France, attracts millions of tourists.",o:["that","which","where","what"],a:1,x:"Լրացուցիչ տեղեկություն ստորակետերով → which։"},
  {type:"mcq",q:"She's the colleague ___ idea won the award.",o:["who","whose","which","whom"],a:1,x:"Նրա գաղափարը → whose։"}
 ]},
 {id:"u8",m:4,t:"Linkers of contrast and result",rule:`<ul><li><b>although / even though</b> + նախադասություն</li><li><b>despite / in spite of</b> + գոյական կամ -ing</li><li><b>However,</b> — նոր նախադասության սկզբում, ստորակետով</li><li><b>whereas / while</b> — երկու բանի համեմատություն</li><li><b>because of / due to</b> + գոյական; <b>therefore / consequently</b> — արդյունք</li></ul>`,qs:[
  {type:"mcq",q:"___ the rain, we went for a walk.",o:["Although","Despite","However","Whereas"],a:1,x:"Հետո գոյական է (the rain) → Despite։"},
  {type:"mcq",q:"___ it was late, she kept working.",o:["Despite","In spite of","Although","However"],a:2,x:"Հետո ամբողջական նախադասություն է → Although։"},
  {type:"mcq",q:"The plan is expensive. ___, it could save money in the long term.",o:["Although","Despite","However","Whereas"],a:2,x:"Նոր նախադասության սկիզբ + ստորակետ → However։"},
  {type:"mcq",q:"My brother loves sport, ___ I prefer reading.",o:["whereas","despite","however","because of"],a:0,x:"Երկու մարդու համեմատություն → whereas։"},
  {type:"gap",q:"The flight was delayed ___ to bad weather.",acc:["due"],x:"due to + գոյական։"},
  {type:"mcq",q:"In spite of ___ tired, he finished the race.",o:["be","being","he was","been"],a:1,x:"in spite of + -ing։"},
  {type:"mcq",q:"Sales fell sharply. ___, the company cut its budget.",o:["Consequently","Although","Despite","Whereas"],a:0,x:"Արդյունք → Consequently։"},
  {type:"gap",q:"___ though he is rich, he lives simply.",acc:["even"],x:"Even though՝ ուժեղացված although։"}
 ]},
 {id:"u9",m:5,t:"Hedging & academic style",rule:`<p>Ակադեմիական գրավոր խոսքում խուսափում ենք բացարձակ պնդումներից՝ <b>may, might, could, tend to, appear to, seem to, it is likely that, to some extent, arguably</b>։</p><p>Ձևական ոճ՝ առանց սեղմ ձևերի (do not, it is), անանձնական կառույցներ (<span class="ex">It is widely believed that…</span>), ձևական բառեր (a considerable number of, rather than a lot of)։</p>`,qs:[
  {type:"mcq",q:"Which sentence is the most appropriate for an academic essay?",o:["Social media is totally destroying society.","Social media may have a negative impact on society.","Social media is bad, everyone knows it.","I think social media is kinda harmful."],a:1,x:"Զգուշավոր պնդում (may) և չեզոք տոն։"},
  {type:"mcq",q:"Young people ___ to spend more time online than older generations.",o:["tend","are tend","tending","tends"],a:0,x:"tend to + V՝ ընդհանուր միտում։ Ենթական հոգնակի է → tend։"},
  {type:"gap",q:"It is widely ___ that exercise improves mental health. (believe)",acc:["believed"],x:"It is widely believed that… — անանձնական կրավորական։"},
  {type:"mcq",q:"The results ___ to suggest a link between sleep and memory.",o:["seem","are seem","seeming","seems that"],a:0,x:"seem to + V, ենթական հոգնակի։"},
  {type:"mcq",q:"Choose the most formal option: The government ___ more money on education.",o:["should spend","gotta spend","has to splash out","needs to throw"],a:0,x:"Մնացածները խոսակցական են։"},
  {type:"gap",q:"It is ___ that prices will rise next year. (an adjective meaning 'probable')",acc:["likely"],x:"It is likely that… — հավանական է, որ…"},
  {type:"mcq",q:"To some ___, technology has made life easier.",o:["extent","degree of","part","ways"],a:0,x:"Կայուն արտահայտություն՝ to some extent։"},
  {type:"mcq",q:"Which phrase best replaces 'a lot of' in formal writing?",o:["loads of","a considerable number of","tons of","heaps of"],a:1,x:"Մնացածները ոչ ձևական են։"}
 ]},
 {id:"u10",m:5,t:"Inversion & emphasis",rule:`<p>Ժխտական կամ սահմանափակող բառից հետո (Never, Rarely, Seldom, Not only, Hardly, No sooner, Only after) գալիս է <b>օժանդակ բայ + ենթակա</b>՝ ինչպես հարցում։</p><ul><li class="ex">Never <b>have I seen</b> such a view.</li><li class="ex">No sooner <b>had we</b> sat down <b>than</b> the phone rang.</li></ul><p>Շեշտադրող (cleft) կառույցներ՝ <span class="ex">What I need is a holiday. · It was my sister who told me.</span></p>`,qs:[
  {type:"mcq",q:"Never ___ such a beautiful sunset.",o:["I have seen","have I seen","I saw","did I saw"],a:1,x:"Never-ից հետո շրջադասություն՝ have I seen։"},
  {type:"mcq",q:"Not only ___ late, but he also forgot the tickets.",o:["he was","was he","he is","did he was"],a:1,x:"Not only + օժանդակ բայ + ենթակա։"},
  {type:"gap",q:"Rarely ___ we see such talent. (write the auxiliary)",acc:["do"],x:"Ներկա ժամանակ → do։"},
  {type:"mcq",q:"No sooner had we sat down ___ the phone rang.",o:["when","than","then","that"],a:1,x:"No sooner… than։ (Hardly… when)"},

  {lv:"B2",title:"The myth of multitasking",text:"The idea that multitasking makes us more productive is increasingly being challenged. Research suggests that what we call multitasking is in fact rapid switching between tasks, and each switch carries a small cost in time and accuracy. Individually these costs may seem trivial, but over a working day they can add up considerably. Interestingly, people who consider themselves skilled multitaskers often perform worse on tests of attention than those who rarely attempt it, possibly because habitual switching makes it harder to filter out irrelevant information. This does not mean that all task-switching is harmful: routine activities that require little conscious thought, such as walking, can often be combined with conversation without difficulty. The problem arises mainly when two tasks compete for the same mental resources.",qs:[{q:"According to the text, multitasking is really…",o:["doing two things at exactly the same moment","rapid switching between tasks","a skill that improves with practice","a cause of illness"],a:1},{q:"People who see themselves as skilled multitaskers…",o:["perform better on attention tests","often perform worse on attention tests","never switch tasks","are more accurate"],a:1},{q:"When is combining tasks least problematic?",o:["when both tasks need a lot of thought","when one task is routine and needs little conscious thought","at the end of the working day","when both tasks are written"],a:1}]}
