pdm:[
 {about:"Product Manager-ը որոշում է, թե ինչ արտադրանք կառուցել և ինչու։ Նա խոսում է օգտատերերի հետ, գտնում նրանց իրական խնդիրները և թիմի հետ միասին ստեղծում լուծում, որը օգտակար է և՛ մարդկանց, և՛ բիզնեսի համար։",
  analogy:"Պատկերացրու, որ բացում ես սրճարան։ Նախքան 20 տեսակ տորթ պատրաստելը, դու հարցնում ես մարդկանց, թե ինչ են ուզում, սկզբում վաճառում ես 2 տեսակ (MVP), նայում ես՝ որն է ավելի լավ վաճառվում, և միայն հետո ընդլայնում ես մենյուն։ Սա հենց product մտածողությունն է։",
  why:"Product Manager-ը IT-ի ամենապահանջված և լավ վարձատրվող դերերից է։ Այս մոդուլը տալիս է ամբողջ մասնագիտության քարտեզը։",
  terms:[["Outcome","Փոփոխություն օգտատիրոջ վարքում կամ բիզնեսում"],["Output","Ստեղծված ֆունկցիաներ"],["MVP","Նվազագույն արտադրանք՝ գաղափարը ստուգելու համար"],["Roadmap","Ապագա աշխատանքների ուղղություն"],["RICE","Առաջնահերթության գնահատման մեթոդ"],["Discovery","Խնդրի և լուծման ստուգում նախքան կառուցելը"]]},
 {about:"Growth-ը նշանակում է աճեցնել արտադրանքը՝ ավելի շատ օգտատերեր, որոնք մնում են և վճարում։ Product-Led Growth-ում արտադրանքն ինքն է դառնում աճի գլխավոր շարժիչը, ոչ թե միայն գովազդը կամ վաճառքի թիմը։",
  analogy:"Duolingo-ն ամեն օր հիշեցնում է քեզ դաս անել (trigger), դասը կարճ է (action), ստանում ես միավորներ և «շարք» (reward), և չես ուզում կորցնել 100-օրյա շարքդ (investment)։ Այսպես է ձևավորվում սովորությունը։",
  why:"Ցանկացած product թիմի հիմնական հարցն է՝ «Ինչպես աճել»։ Այս մոդուլը սովորեցնում է աճը կառուցել փորձարկումներով, ոչ թե գուշակությամբ։",
  terms:[["PLG","Աճ, որը առաջնորդվում է արտադրանքով"],["AARRR","Ձեռքբերում, ակտիվացում, պահպանում, հրավեր, եկամուտ"],["Retention","Վերադարձող օգտատերերի բաժին"],["A/B test","Երկու տարբերակի համեմատություն պատահական խմբերով"],["Freemium","Անվճար հիմնական տարբերակ + վճարովի հավելյալ"],["Churn","Կորցրած օգտատերերի տոկոս"]]},
 {about:"Product analytics-ը թվերով ցույց է տալիս, թե ինչ են անում օգտատերերը։ Սովորում ենք հիմնական ցուցանիշները, գործիքները և նույնիսկ պարզ SQL, որ կարողանաս ինքնուրույն գտնել պատասխանները։",
  analogy:"Analytics-ը մեքենայի վահանակն է. արագություն, վառելիք, ջերմաստիճան։ Առանց դրա դու վարում ես աչքերդ փակ։ Retention-ը ցույց է տալիս՝ արդյոք «բաքը ծակ է». եթե օգտատերերը չեն վերադառնում, նոր օգտատերեր բերելը իմաստ չունի։",
  why:"Product որոշումները պետք է հիմնված լինեն տվյալների վրա։ PM-ը, որը կարող է ինքնուրույն վերլուծել տվյալները, ավելի արագ է որոշում կայացնում։",
  terms:[["DAU / MAU","Օրական / ամսական ակտիվ օգտատերեր"],["Cohort","Միևնույն ժամանակ գրանցված օգտատերերի խումբ"],["Activation","Օգտատիրոջ առաջին արժեքավոր փորձը"],["LTV","Մեկ հաճախորդից ստացվող ընդհանուր եկամուտ"],["CAC","Մեկ հաճախորդ ձեռք բերելու ծախս"],["Funnel","Քայլերի շղթա, որտեղ օգտատերերը դուրս են գալիս"]]},
 {about:"Product design-ը այն մասին է, թե ինչպես անել արտադրանքը հասկանալի և հաճելի։ Սովորում ենք խոսել օգտատերերի հետ, ստեղծել պարզ prototype-ներ և ստուգել դրանք իրական մարդկանց վրա, նախքան ծրագրավորողները սկսեն կոդ գրել։",
  analogy:"Նախքան տուն կառուցելը, ճարտարապետը նկարում է էսքիզ, հետո մանրակերտ, և ցույց է տալիս ապագա բնակիչներին։ Փոխել էսքիզը շատ ավելի էժան է, քան քանդել պատը։ Wireframe-ը և prototype-ը հենց այդ էսքիզն ու մանրակերտն են։",
  why:"Օգտատերերի հետ վաղ ստուգումը կանխում է ամիսների ապարդյուն աշխատանքը։ PM-ը պետք է կարողանա անցկացնել հարցազրույց և usability test։",
  terms:[["Design Thinking","Օգտատիրոջ կարիքից սկսվող լուծումների գործընթաց"],["Persona","Տիպիկ օգտատիրոջ նկարագրություն"],["Journey map","Օգտատիրոջ ճանապարհի քարտեզ"],["Wireframe","Էկրանի պարզ կմախք"],["Prototype","Ինտերակտիվ մոդել՝ ստուգման համար"],["Accessibility","Հասանելիություն բոլոր մարդկանց համար"]]},
 {about:"Արհեստական բանականությունը փոխում է և՛ արտադրանքները, և՛ PM-ի աշխատանքը։ Սովորում ենք, թե ինչ է AI-ն պարզ լեզվով, երբ է այն ճիշտ լուծում, ինչպես չափել դրա որակը և ինչպես օգտագործել այն ամենօրյա աշխատանքում։",
  analogy:"LLM-ը նման է շատ կարդացած, բայց երբեմն վստահորեն սխալվող օգնականի։ Նա արագ գրում է սևագիր, բայց դու պետք է ստուգես փաստերը։ Evals-ը նման են քննության հարցերի, որոնցով ստուգում ես՝ արդյոք օգնականը լավ է աշխատում։",
  why:"Գրեթե բոլոր ընկերությունները ավելացնում են AI գործառույթներ։ PM-ը, որը հասկանում է AI-ի հնարավորություններն ու սահմանափակումները, մեծ առավելություն ունի։",
  terms:[["LLM","Մեծ լեզվական մոդել"],["Prompt","Հրահանգ AI մոդելին"],["Hallucination","Վստահ, բայց սխալ պատասխան"],["RAG","AI-ին տալ քո տվյալներից համապատասխան տեղեկություն"],["Evals","AI-ի որակի թեստեր"],["Precision / Recall","Ճշգրտություն / ամբողջականություն"]]},
 {about:"Այս մոդուլում տեսությունը վերածվում է պրակտիկայի։ Գրում ենք իրական PRD, լուծում առաջնահերթության, metrics-ի և product sense խնդիրներ, որոնք նման են իրական աշխատանքին և հարցազրույցներին։",
  analogy:"Ինչպես վարորդական դասընթացում տեսությունից հետո նստում ես ղեկին, այնպես էլ այստեղ «վարում» ես իրական product իրավիճակներ։ Սխալվելը այստեղ անվտանգ է և օգտակար։",
  why:"PM հարցազրույցների մեծ մասը case study-ներ են։ Կառուցվածքային մտածողությունը սովորում ես միայն պրակտիկայով։",
  terms:[["PRD","Արտադրանքի պահանջների փաստաթուղթ"],["Trade-off","Մի բան ընտրելու գինը՝ մյուսից հրաժարվելը"],["Root cause","Խնդրի արմատական պատճառ"],["Segmentation","Տվյալների բաժանում խմբերի"],["Teardown","Արտադրանքի մանրամասն վերլուծություն"],["CIRCLES","Product sense հարցերի կառուցվածք"]]},
 {about:"Product-ը միշտ թիմային աշխատանք է։ Սովորում ենք համագործակցել, տալ և ստանալ կառուցողական feedback, կրկնել (iterate) և համոզիչ ներկայացնել արդյունքը։",
  analogy:"Երաժշտական խումբը չի թողարկում ալբոմ առանց փորձերի։ Նրանք նվագում են, լսում ձայնագրությունը, քննարկում և նորից նվագում։ Ներկայացումը համերգն է, որտեղ բոլոր փորձերը միավորվում են։",
  why:"Լավ գաղափարը առանց թիմի աջակցության և ճիշտ ներկայացման հաճախ չի իրականանում։ Այս հմտությունները որոշում են քո ազդեցությունը կազմակերպությունում։",

 {about:"Վերջին մոդուլում միավորում ենք ամեն ինչ մեկ capstone նախագծում, պատրաստում ենք պորտֆոլիո և հարցազրույցի համար անհրաժեշտ ամեն բան։",

da:[
 {about:"Data Analytics-ը տվյալներից օգտակար պատասխաններ գտնելու արվեստն է։ Analyst-ը վերցնում է թվերը, մաքրում է դրանք, վերլուծում և ներկայացնում է եզրակացություններ, որոնք օգնում են ղեկավարներին ճիշտ որոշումներ կայացնել։",
  analogy:"Analyst-ը նման է բժշկի. նախ հարցնում է գանգատները (բիզնես հարց), ապա ուղարկում է անալիզների (տվյալներ), կարդում է արդյունքները (վերլուծություն) և նշանակում է բուժում (առաջարկություն)։",
  why:"Բանկերը, telecom-ը, e-commerce-ը և պետական կառույցները ամեն օր որոշումներ են կայացնում տվյալներով։ Data Analyst-ը այդ որոշումների կենտրոնում է։",
  terms:[["Descriptive","Ինչ եղավ"],["Diagnostic","Ինչու եղավ"],["Predictive","Ինչ կլինի"],["KPI","Հիմնական կատարողական ցուցանիշ"],["Bias","Սխալ, որը աղավաղում է եզրակացությունը"],["CRISP-DM","Վերլուծական նախագծի 6 փուլերը"]]},
 {about:"EDA-ն տվյալների առաջին «ծանոթությունն» է։ Հաշվում ենք միջինը, մեդիանը, ցրվածությունը և նկարում գրաֆիկներ, որ տեսնենք օրինաչափություններն ու տարօրինակ արժեքները։",
  analogy:"Երբ նոր քաղաք ես գալիս, նախ զբոսնում ես, նայում քարտեզը, որտեղ է կենտրոնը, որտեղ են խանութները։ EDA-ն տվյալների նման զբոսանք է նախքան խորը հետազոտությունը։",
  why:"Սխալ եզրակացությունների մեծ մասը գալիս է տվյալները չնայելուց։ Լավ EDA-ն խնայում է ժամեր և պաշտպանում է ամոթալի սխալներից։",
  terms:[["Mean","Միջին թվաբանական"],["Median","Միջին արժեքը դասավորելուց հետո"],["Standard deviation","Ցրվածության չափ"],["Outlier","Խիստ տարբերվող արժեք"],["Histogram","Բաշխման գրաֆիկ"],["Correlation","Երկու փոփոխականի կապ"]]},
 {about:"Տվյալները գալիս են տարբեր տեղերից՝ բազաներից, Excel-ից, կայքերից։ Սովորում ենք, թե որտեղ են դրանք պահվում և ինչպես են ավտոմատ տեղափոխվում մի համակարգից մյուսը (ETL)։",
  analogy:"ETL-ը նման է ջրի մաքրման կայանին. ջուրը վերցնում են գետից (Extract), մաքրում են (Transform) և լցնում են ջրամբար (Load), որտեղից այն արդեն մաքուր գալիս է տներ։",
  why:"Analyst-ը պետք է իմանա, թե որտեղից են գալիս տվյալները և որքանով կարելի է վստահել դրանց։ «Աղբ մուտքում՝ աղբ ելքում»։",
  terms:[["Structured","Աղյուսակային տվյալներ"],["Unstructured","Տեքստ, նկար, ձայն"],["Data Warehouse","Վերլուծության համար մաքրված պահոց"],["Data Lake","Հում տվյալների պահոց"],["ETL","Վերցնել, մշակել, բեռնել"],["Data quality","Տվյալների ճշգրտություն և ամբողջականություն"]]},
 {about:"Իրական տվյալները միշտ «կեղտոտ» են՝ բացակայող արժեքներ, կրկնօրինակներ, սխալ ձևաչափեր։ Սովորում ենք մաքրել դրանք և ստեղծել նոր օգտակար սյունակներ (feature engineering)։",
  analogy:"Նախքան ճաշ եփելը բանջարեղենը լվանում ես, մաքրում և կտրատում։ Եթե բաց թողնես այս քայլը, նույնիսկ լավագույն բաղադրատոմսը չի օգնի։",
  why:"Analyst-ի ժամանակի մեծ մասը ծախսվում է տվյալների պատրաստման վրա։ Սա ամենապրակտիկ և ամենահաճախ ստուգվող հմտությունն է։",
  terms:[["Missing value","Բացակայող արժեք"],["Imputation","Բացակայող արժեքի լրացում"],["Duplicate","Կրկնօրինակ"],["Normalization","Արժեքների բերում նույն սանդղակի"],["One-hot encoding","Կատեգորիաների վերածում 0/1 սյունակների"],["Feature","Մոդելի կամ վերլուծության համար օգտագործվող փոփոխական"]]},
 {about:"Վիճակագրությունը օգնում է տարբերել իրական օրինաչափությունը պատահականությունից։ Սովորում ենք հավանականություն, հիպոթեզների ստուգում (օր.՝ A/B թեստ) և ռեգրեսիա։",
  analogy:"Եթե մետաղադրամը 10 անգամից 6 անգամ ընկնի «գիր», դա դեռ չի նշանակում, որ այն կեղծ է։ Վիճակագրությունը ասում է, թե երբ է արդյունքը բավականաչափ անսովոր, որ հավատանք։",
  why:"«Նոր կոճակը բարձրացրե՞ց վաճառքը, թե՞ դա պատահականություն էր» հարցը analyst-ի ամենաշատ լսվող հարցերից է։",
  terms:[["Probability","Հավանականություն"],["Hypothesis","Ենթադրություն, որը ստուգում ենք"],["p-value","Արդյունքի պատահական լինելու հավանականության չափ"],["Confidence interval","Հավանական արժեքների միջակայք"],["Regression","Փոփոխականների կապի մոդել"],["Causation","Պատճառահետևանքային կապ"]]},
 {about:"Machine learning-ը թույլ է տալիս համակարգչին սովորել տվյալներից և կանխատեսել։ Սովորում ենք երկու հիմնական տեսակները՝ կանխատեսում պիտակներով (classification) և խմբավորում առանց պիտակների (clustering)։",
  analogy:"Classification-ը նման է email-ի spam ֆիլտրին. այն սովորել է հազարավոր օրինակներից, թե որն է spam։ Clustering-ը նման է գրադարանավարի, որը գրքերը դասավորում է դարակներով՝ առանց նախապես ասված կատեգորիաների։",
  why:"Churn-ի կանխատեսումը, հաճախորդների սեգմենտավորումը և fraud-ի հայտնաբերումը բանկերի և telecom ընկերությունների ամենօրյա խնդիրներն են։",
  terms:[["Supervised","Ուսուցում պիտակներով"],["Unsupervised","Ուսուցում առանց պիտակների"],["Classification","Կատեգորիայի կանխատեսում"],["Clustering","Նման օբյեկտների խմբավորում"],["Overfitting","Մոդելը «անգիր է արել» և վատ է աշխատում նոր տվյալների վրա"],["Precision / Recall","Ճշգրտություն / ամբողջականություն"]]},
 {about:"Այստեղ սովորում ենք analyst-ի հիմնական գործիքները՝ Python (pandas), SQL և վիզուալիզացիայի ծրագրեր (Power BI, Tableau)։ Սրանք այն հմտություններն են, որոնք պահանջվում են գրեթե յուրաքանչյուր հայտարարությունում։",
  analogy:"SQL-ը նման է պահեստապետին տրվող պատվերին. «Բեր ինձ բոլոր կարմիր ապրանքները, որոնք վաճառվել են մայիսին»։ Python-ը ամբողջական արհեստանոց է, իսկ Power BI-ը ցուցափեղկ, որտեղ արդյունքը գեղեցիկ ցուցադրվում է։",
  why:"Data Analyst-ի տեխնիկական հարցազրույցը գրեթե միշտ ներառում է SQL առաջադրանք և Excel/Python/BI գործիքների ստուգում։",
  terms:[["pandas","Python գրադարան աղյուսակների համար"],["DataFrame","Աղյուսակ pandas-ում"],["JOIN","Աղյուսակների միավորում SQL-ում"],["GROUP BY","Խմբավորում և հաշվարկ"],["Dashboard","Ցուցանիշների ինտերակտիվ վահանակ"],["DAX","Power BI-ի հաշվարկների լեզու"]]},
 {about:"Վերջին մոդուլում տեսնում ենք, թե ինչպես է analytics-ը կիրառվում իրական բիզնեսում՝ հաշվետվություններ, կանխատեսումներ և case study-ներ բանկերից, խանութներից և telecom-ից։ Ավարտում ենք պորտֆոլիո նախագիծը։",
  analogy:"Եղանակի տեսությունը predictive analytics-ի ամենահայտնի օրինակն է. անցյալի տվյալներից կանխատեսում են վաղվա եղանակը և ասում են հավանականությամբ («70% հավանականությամբ անձրև»)։",
  why:"Գործատուները ցանկանում են տեսնել, որ կարող ես լուծել իրական խնդիր սկզբից մինչև վերջ և պարզ ներկայացնել արդյունքը։",
  terms:[["BI","Բիզնես վերլուծություն և հաշվետվություններ"],["Forecast","Կանխատեսում"],["Seasonality","Կրկնվող սեզոնային օրինաչափություն"],["Data storytelling","Տվյալներով պատմություն պատմելը"],["Executive summary","Ղեկավարության համար կարճ ամփոփում"],["Portfolio","Նախագծերի հավաքածու GitHub-ում"]]}

sec:[
 {about:"Կիբերանվտանգությունը տեղեկատվության և համակարգերի պաշտպանությունն է։ Հիմնական նպատակն է, որ տվյալները լինեն գաղտնի, չփոփոխված և հասանելի այն ժամանակ, երբ պետք են (CIA)։ Սովորում ենք նաև, թե ինչ սպառնալիքներ կան և ինչ կանոններով է կառուցվում պաշտպանությունը։",
  analogy:"Համակարգը նման է բանկի մասնաճյուղին. դռներ և պահակներ (firewall), անձնագրի ստուգում (authentication), տարբեր աշխատակիցներ տարբեր բանալիներով (least privilege), տեսախցիկներ (logging) և մի քանի պաշտպանական շերտ (defense in depth)։",
  why:"Ցանկացած IT մասնագետ պետք է հասկանա անվտանգության հիմունքները, իսկ կիբերանվտանգության մասնագետների պակասը ամբողջ աշխարհում մեծ է։",
  terms:[["CIA","Գաղտնիություն, ամբողջականություն, հասանելիություն"],["Malware","Վնասակար ծրագիր"],["Phishing","Խաբեությամբ տվյալներ կորզելու փորձ"],["Least privilege","Միայն անհրաժեշտ նվազագույն իրավունքներ"],["Zero Trust","Ոչ մեկին ավտոմատ չվստահել"],["Compliance","Կանոնակարգերին համապատասխանություն"]]},
 {about:"Նոր տեղադրված համակարգը հաճախ ունի ավելորդ բաց դռներ։ Hardening-ը դրանք փակելն է՝ անջատել ավելորդը, թարմացնել ծրագրերը, կարգավորել ճիշտ և գրանցել, թե ով ինչ է անում։",
  analogy:"Նոր բնակարան տեղափոխվելիս փոխում ես կողպեքը (default գաղտնաբառեր), փակում ես այն պատուհանները, որոնք չես օգտագործում (ավելորդ port-եր), տեղադրում ես ազդանշանային համակարգ (logging) և պարբերաբար ստուգում ես դռները (patch-եր)։",
  why:"Հաջողված հարձակումների զգալի մասը օգտագործում է չթարմացված ծրագրեր կամ սխալ կարգավորումներ։ Սա պաշտպանության ամենաէժան և արդյունավետ մասն է։",
  terms:[["Hardening","Համակարգի ամրացում"],["Patch","Ծրագրի ուղղող թարմացում"],["CVE","Հանրային խոցելիության համար"],["CVSS","Խոցելիության ծանրության գնահատական 0–10"],["CIS Benchmark","Անվտանգ կարգավորման ուղեցույց"],["Log","Իրադարձությունների գրանցում"]]},
 {about:"Ցանցը համակարգիչները միմյանց կապող «ճանապարհների համակարգն» է։ Սովորում ենք, թե ինչպես են տվյալները շարժվում ցանցով և ինչպես են firewall-ները, VLAN-ները, VPN-ները և IDS-ը պաշտպանում այն։",
  analogy:"IP հասցեն տան հասցեն է, port-ը՝ բնակարանի համարը, firewall-ը՝ շենքի պահակը, որը ստուգում է՝ ով կարող է մտնել։ VLAN-ը շենքի առանձին մուտքերն են տարբեր բնակիչների համար, իսկ VPN-ը գաղտնի թունելն է, որով կարող ես անվտանգ գալ տուն հեռվից։",
  why:"Ցանցային հիմունքները ցանկացած անվտանգության դերի հիմքն են, իսկ Wireshark-ը և Nmap-ը ամենաօգտագործվող գործիքներից են։",
  terms:[["IP address","Սարքի հասցեն ցանցում"],["Port","Ծառայության «դուռը» սարքի վրա"],["TCP / UDP","Հուսալի / արագ տվյալների փոխանցում"],["Firewall","Թրաֆիկի զտիչ"],["VPN","Գաղտնագրված թունել"],["IDS / IPS","Ներխուժման հայտնաբերում / կանխում"]]},
 {about:"Endpoint-ը օգտատիրոջ համակարգիչն է կամ սերվերը։ Սովորում ենք Windows-ի և Linux-ի անվտանգության հիմունքները, մուտքի իրավունքները, MFA-ն և այն գործիքները, որոնք հայտնաբերում են կասկածելի վարքը սարքի վրա։",
  analogy:"MFA-ն նման է բանկային քարտին և PIN կոդին. միայն քարտը կամ միայն կոդը բավարար չէ։ Ֆայլերի իրավունքները նման են գրասենյակի բանալիներին. հաշվապահը մուտք ունի հաշվապահություն, բայց ոչ սերվերային սենյակ։",
  why:"Հարձակումների մեծ մասը սկսվում է հենց օգտատիրոջ սարքից (phishing, վնասակար կցորդ)։ Endpoint-ի պաշտպանությունը առաջին գիծն է։",
  terms:[["Endpoint","Օգտատիրոջ կամ սերվերի սարք"],["MFA","Բազմագործոն նույնականացում"],["RBAC","Իրավունքներ ըստ դերի"],["EDR","Endpoint-ի հայտնաբերման և արձագանքի համակարգ"],["chmod","Linux-ում ֆայլերի իրավունքների փոփոխում"],["Sysmon","Windows-ի մանրամասն մոնիթորինգի գործիք"]]},
 {about:"Վեբ կայքերը և հավելվածները հարձակումների ամենահաճախ թիրախն են։ Սովորում ենք OWASP Top 10-ը՝ ամենատարածված խոցելիությունները, և թե ինչպես դրանք կանխել կոդում և WAF-ով։",
  analogy:"SQL injection-ը նման է այն դեպքին, երբ հաճախորդը բանկի դիմումի «անուն» դաշտում գրում է «և տվեք ինձ բոլոր հաշիվների ցանկը», և աշխատակիցը կարդում է դա որպես հրահանգ։ Լուծումը՝ միշտ տարբերել տվյալը հրահանգից։",
  why:"AppSec-ը արագ աճող ուղղություն է, իսկ ծրագրավորողների հետ աշխատող ցանկացած անվտանգության մասնագետ պետք է իմանա OWASP Top 10-ը։",
  terms:[["OWASP","Վեբ անվտանգության բաց համայնք"],["Injection","Վնասակար հրահանգի ներմուծում տվյալների միջոցով"],["XSS","Վնասակար script այլ օգտատիրոջ բրաուզերում"],["Access control","Ով ինչ կարող է անել"],["JWT / OAuth","Նույնականացման և մուտքի մեխանիզմներ"],["WAF","Վեբ հավելվածների firewall"]]},
 {about:"Security engineer-ը նախագծում, կարգավորում և ավտոմատացնում է պաշտպանությունը։ Սովորում ենք գնահատել ռիսկերը, մոդելավորել սպառնալիքները (STRIDE) և աշխատել SIEM ու IAM համակարգերի հետ։",
  analogy:"SIEM-ը նման է անվտանգության կենտրոնական դիտակետին, որտեղ միանում են բոլոր տեսախցիկները։ Մեկ տեսախցիկում անսովոր բան կարող է նորմալ թվալ, բայց երբ տեսնում ես, որ նույն մարդը 5 րոպեում փորձել է 50 դուռ, արդեն պարզ է, որ ինչ-որ բան այն չէ։",
  why:"SOC analyst-ը և security engineer-ը կիբերանվտանգության ամենատարածված մուտքային դերերն են։",
  terms:[["Threat modeling","Սպառնալիքների համակարգված վերլուծություն"],["STRIDE","Սպառնալիքների 6 կատեգորիա"],["SIEM","Իրադարձությունների կենտրոնական վերլուծության համակարգ"],["IAM","Ինքնությունների և մուտքի կառավարում"],["SSO","Մեկ մուտք բոլոր համակարգերի համար"],["SOC","Անվտանգության գործողությունների կենտրոն"]]},
 {about:"Անվտանգությունը պետք է ստուգել, ոչ թե ենթադրել։ Սովորում ենք խոցելիությունների սկանավորում, penetration testing-ի մեթոդաբանություն (միայն թույլտվությամբ) և ինչպես ավտոմատ անվտանգության ստուգումներ ավելացնել ծրագրի մշակման գործընթացում (DevSecOps)։",
  analogy:"Pentest-ը նման է նրան, երբ բանկը վարձում է փորձագետի՝ պայմանագրով ստուգելու, թե արդյոք կարելի է անցնել պահակների կողքով։ Առանց պայմանագրի նույն գործողությունը հանցագործություն է։ DevSecOps-ը նման է շինարարության ընթացքում անընդհատ ստուգումներին, ոչ թե միայն վերջում։",
  why:"Ընկերությունները ավելի ու ավելի շատ են ինտեգրում անվտանգությունը CI/CD-ում։ DevSecOps-ը պահանջված և լավ վարձատրվող ուղղություն է։",
  terms:[["Vulnerability scan","Խոցելիությունների ավտոմատ որոնում"],["Pentest","Թույլատրված հարձակման սիմուլյացիա"],["SAST","Կոդի ստատիկ վերլուծություն"],["DAST","Աշխատող հավելվածի ստուգում դրսից"],["SCA","Գրադարանների խոցելիությունների ստուգում"],["Shift left","Անվտանգությունը մշակման սկզբում"]]},
 {about:"Վերջին մոդուլում սովորում ենք անվտանգ կոդ գրելու սկզբունքները, գաղտնագրումը և թե ինչպես արձագանքել incident-ին ու փաստաթղթավորել այն։ Նաև կառուցում ենք կարիերայի պլանը։",
  analogy:"Գաղտնագրումը նման է նամակը կողպված արկղով ուղարկելուն. նույնիսկ եթե ինչ-որ մեկը բռնի արկղը, առանց բանալու չի կարող կարդալ։ Incident response-ը նման է հրշեջ ծառայության պլանին. ով ինչ է անում, ում ենք զանգում, ինչպես ենք վերականգնում։",

PDM.examExtra=20; PDM.examMin=60; DA.examExtra=20; DA.examMin=60; SEC.examExtra=20; SEC.examMin=60;

const CID=COURSES.map(c=>c.id);
const course=id=>COURSES.find(c=>c.id===id);
const PASS_FINAL=75, PASS_QUIZ=0.7, PRACTICE_MIN=6;

/* ========== STATE ========== */
const blankC=()=>({lessons:{},practice:{},labs:{},notes:{},feedback:{},quiz:{},final:null,extra:{},extraQuiz:null,start:null,cert:null,explain:{},qa:{},gen:{},guide:{}});
let S={v:3,name:"",c:{},migrated:false};
let db=null, docRef=null, sample=null, downloads=null, saveTimer=null;
const LS_KEY="it-academy-v3";

function normalize(raw){
  if(!raw||typeof raw!=="object")return;
  if(raw.v===3){S=Object.assign({v:3,name:"",c:{},migrated:false},raw);}
  else{ // v1 / v2: old single PM course
    const pm=blankC(); pm.notes=raw.notes||{}; pm.start=raw.start||null;
    S={v:3,name:"",c:{pm},migrated:true};
  }
  CID.forEach(id=>{S.c[id]=Object.assign(blankC(),S.c[id]||{});});
}
CID.forEach(id=>{S.c[id]=blankC();});
try{const r=localStorage.getItem(LS_KEY); if(r) normalize(JSON.parse(r)); else {const o=localStorage.getItem("pm-academy-v1"); if(o) normalize(JSON.parse(o));}}catch(e){}
const st=id=>S.c[id];

function persist(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    if(docRef){try{await docRef.set({state:JSON.stringify(S),updated:Date.now()}); setNote("Առաջընթացը պահպանված է քո հաշվում");}catch(e){setNote("Առաջընթացը պահպանված է միայն այս բրաուզերում");}}
  },700);
}
function setNote(t){document.getElementById("saveNote").textContent=t;}
setNote("Առաջընթացը պահպանվում է այս բրաուզերում");

(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [d,u,s,dl]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample"),claude.use("downloads")]);

})();

/* ========== HELPERS ========== */
const $=(s,r=document)=>r.querySelector(s);
function el(tag,attrs={},html){const e=document.createElement(tag);for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const quizPass=(c,w)=>{const q=st(c.id).quiz[w.n];return !!(q&&q.best>=Math.ceil(w.quiz.length*PASS_QUIZ));};
function weekProgress(c,w){
  const s=st(c.id); const total=w.lessons.length+2; let done=0;
  w.lessons.forEach((_,i)=>{if(s.lessons[w.n+"-"+i])done++;});
  if(s.practice[w.n])done++; if(quizPass(c,w))done++;
  return {done,total,pct:Math.round(done/total*100)};
}
function courseStats(c){
  const s=st(c.id); let d=0,t=0;
  c.weeks.forEach(w=>{const p=weekProgress(c,w);d+=p.done;t+=p.total;});
  t+=1; if(s.final&&s.final.pass)d++;
  return {
    pct:Math.round(d/t*100),
    lessons:c.weeks.reduce((a,w)=>a+w.lessons.filter((_,i)=>s.lessons[w.n+"-"+i]).length,0),
    lessonsTotal:c.weeks.reduce((a,w)=>a+w.lessons.length,0),
    practice:c.weeks.filter(w=>s.practice[w.n]).length,
    quizzes:c.weeks.filter(w=>quizPass(c,w)).length,
    final:s.final
  };
}
function certReady(c){const k=courseStats(c);return {quizzes:k.quizzes===8,practice:k.practice>=PRACTICE_MIN,final:!!(k.final&&k.final.pass)};}
const nextWeek=c=>{for(const w of c.weeks){if(weekProgress(c,w).pct<100)return w.n;}return 8;};
function fmtDate(d,opt){try{return new Date(d).toLocaleDateString("hy-AM",opt||{day:"numeric",month:"long",year:"numeric"});}catch(e){return new Date(d).toDateString();}}
function stripHtml(h){const d=document.createElement("div");d.innerHTML=h;return d.textContent.replace(/\s+/g," ").trim();}

/* ========== ROUTING ========== */
function route(){
  const h=(location.hash||"").slice(1);
  const m=h.match(/^(pm|pdm|da|sec)(?:-(w[1-8]|exam|extra|cert))?$/);
  if(!m)return{v:"home"};
  const c=course(m[1]); const sub=m[2]||"";
  if(sub.startsWith("w"))return{v:"week",c,n:+sub.slice(1)};
  if(sub==="exam")return{v:"exam",c};
  if(sub==="extra"&&c.extra)return{v:"extra",c};
  if(sub==="cert")return{v:"cert",c};
  return{v:"course",c};
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});

function renderCourseHead(r){
  const box=$("#course"); box.innerHTML="";

  head.innerHTML=`<span class="eyebrow">Դասընթաց · ACA-ի 8 մոդուլների կառուցվածքով</span><h2>${c.title}</h2><p class="lead">${c.lead}</p>
   <div class="statrow"><div class="stat"><b>${k.pct}%</b><span>առաջընթաց</span></div><div class="stat"><b>${k.lessons}/${k.lessonsTotal}</b><span>դաս</span></div>
   <div class="stat"><b>${k.practice}/8</b><span>գործնական</span></div><div class="stat"><b>${k.quizzes}/8</b><span>թեստ (≥70%)</span></div>

  box.appendChild(head);

  c.weeks.forEach(w=>{grid.appendChild(el("div",{class:"g-head"},"Մ"+w.n+(s.start?" · "+fmtWeek(s.start,w.n):"")));});
  c.weeks.forEach(w=>{const p=weekProgress(c,w);
    grid.appendChild(el("button",{class:"g-bar"+(r.v==="week"&&r.n===w.n?" active":""),onclick:()=>{location.hash=c.id+"-w"+w.n}},`<span>${w.short}</span><span class="fill"><i style="width:${p.pct}%"></i></span><span class="mono small muted">${p.done}/${p.total}</span>`));});
  grid.appendChild(el("div",{class:"g-ms"},`<span><span class="diamond"></span>Մ4՝ կես ճանապարհ</span><span><span class="diamond"></span>Մ8՝ capstone</span><span><span class="diamond"></span>Ավարտական քննություն (≥${PASS_FINAL}%)</span><span><span class="diamond"></span>Սերտիֆիկատ</span>`));
  g.appendChild(grid); box.appendChild(g);
  const tabs=el("nav",{class:"tabs",style:"margin-top:16px"});
  const items=[["","Ծրագիր"],["-w"+nextWeek(c),"Շարունակել ուսումը"]];
  if(c.extra)items.push(["-extra",c.extra.title]);
  items.push(["-exam","Ավարտական քննություն"],["-cert","Սերտիֆիկատ"]);
  items.forEach(([h,t])=>{const on=(h===""&&r.v==="course")||(h==="-extra"&&r.v==="extra")||(h==="-exam"&&r.v==="exam")||(h==="-cert"&&r.v==="cert");tabs.appendChild(el("a",{href:"#"+c.id+h,class:on?"on":""},t));});
  box.appendChild(tabs);
}
function fmtWeek(start,n){const d=new Date(start);d.setDate(d.getDate()+(n-1)*7);return fmtDate(d,{day:"numeric",month:"short"});}

/* ========== RENDER ========== */
function render(){
  const r=route(); renderChips(r); renderCourseHead(r);
  const v=$("#view"); v.innerHTML="";
  if(r.c)v.style.setProperty("--cc",`var(--c-${r.c.id})`);
  if(r.v==="home")v.appendChild(viewHome());
  else if(r.v==="course")v.appendChild(viewCourse(r.c));
  else if(r.v==="week")v.appendChild(viewWeek(r.c,r.c.weeks[r.n-1]));
  else if(r.v==="exam")v.appendChild(viewExam(r.c));
  else if(r.v==="extra")v.appendChild(viewExtra(r.c));
  else if(r.v==="cert")v.appendChild(viewCert(r.c));
}

  const send=el("button",{class:"btn small"},"Հարցնել");

    if(msgs[0].role!=="user")msgs.shift();

    catch(e){bubble.textContent=e&&e.code==="not_granted"?"Հարց ու պատասխանը հասանելի չէ այս դիտման մեջ։":"Չհաջողվեց պատասխանել։ Փորձիր նորից։"; s.qa[qkey].pop(); ta.value=q;}
    send.disabled=false;
  });

function quizRunner(qs,onDone,passN){
  const wrap=el("div",{style:"display:flex;flex-direction:column;gap:12px"});
  const name="q"+Math.random().toString(36).slice(2,7);
  qs.forEach((q,i)=>{
    const b=el("div",{class:"q"});
    b.appendChild(el("p",{},`<b class="mono">${i+1}.</b> ${esc(q[0])}`));
    const o=el("div",{class:"opts"});
    q[1].forEach((t,j)=>{const lab=el("label",{class:"opt"});const r=el("input",{type:"radio",name:name+i,value:j,id:name+i+"_"+j});const sp=el("span");sp.textContent=t;lab.append(r,sp);o.appendChild(lab);});
    b.appendChild(o); const ex=el("p",{class:"expl"}); ex.hidden=true; ex.textContent=q[3]; b.appendChild(ex);
    wrap.appendChild(b);
  });
  const res=el("p",{class:"result"}); res.hidden=true;
  const btn=el("button",{class:"btn"},"Ստուգել պատասխանները");
  btn.addEventListener("click",()=>{
    let sc=0;
    wrap.querySelectorAll(".q").forEach((b,i)=>{
      const sel=b.querySelector("input:checked"); const right=qs[i][2];
      b.querySelectorAll(".opt").forEach((lab,j)=>{lab.classList.remove("right","wrong");if(j===right)lab.classList.add("right");else if(sel&&+sel.value===j)lab.classList.add("wrong");});
      b.querySelector(".expl").hidden=false;
      if(sel&&+sel.value===right)sc++;
    });
    res.hidden=false; res.textContent=`Արդյունք՝ ${sc}/${qs.length} (${Math.round(sc/qs.length*100)}%) — ${sc>=passN?"Անցած է ✓":"Չի անցել. կրկնիր դասերը և փորձիր նորից"}`;
    res.style.color=sc>=passN?"var(--ok)":"var(--bad)";
    btn.disabled=true; onDone(sc);
  });
  const again=el("button",{class:"btn ghost",onclick:()=>render()},"Նորից");
  const row=el("div",{class:"row"}); row.append(btn,again);
  wrap.append(row,res); wrap._submit=()=>{if(!btn.disabled)btn.click();}; return wrap;
}

let examState={};
function viewExam(c){
  const s=st(c.id);
  const sec=el("section",{class:"panel"});
  const total=c.final.length+c.examExtra;
  sec.appendChild(el("div",{},`<span class="eyebrow">Ավարտական քննություն</span><h2>${c.title}</h2><p class="muted" style="margin-top:6px">${total} հարց (${c.final.length} սցենարային + ${c.examExtra} պատահական մոդուլային թեստերից) · ${c.examMin} րոպե · անցողիկ՝ ${PASS_FINAL}%</p>`));
  if(s.final)sec.appendChild(el("p",{},`Վերջին արդյունք՝ <b class="mono">${s.final.score}%</b> ${s.final.pass?'<span class="pill ok">Անցած է</span>':'<span class="pill ms">Չի անցել</span>'}`));
  const ready=c.weeks.filter(w=>quizPass(c,w)).length;
  if(ready<8)sec.appendChild(el("p",{class:"small muted"},`Խորհուրդ է տրվում սկսել բոլոր 8 մոդուլային թեստերն անցնելուց հետո (անցած է ${ready}/8)։ Կարող ես փորձել նաև հիմա՝ ինքնաստուգման համար։`));
  const ex=examState[c.id];
  if(!ex){
    sec.appendChild(el("div",{class:"row"})).appendChild(el("button",{class:"btn",onclick:()=>{
      const pool=[];c.weeks.forEach(w=>w.quiz.forEach(q=>pool.push(q)));
      for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
      examState[c.id]={qs:c.final.concat(pool.slice(0,c.examExtra)),end:Date.now()+c.examMin*60000};render();}},"Սկսել քննությունը"));
    return sec;
  }
  const tm=el("p",{class:"timer"}); sec.appendChild(tm);
  const runner=quizRunner(ex.qs,(sc)=>{clearInterval(iv);const pct=Math.round(sc/ex.qs.length*100);s.final={score:pct,pass:pct>=PASS_FINAL,date:Date.now()};persist();renderCourseHead(route());delete examState[c.id];
    if(pct>=PASS_FINAL){const r=certReady(c);sec.appendChild(el("div",{class:"notice"},r.quizzes&&r.practice?`<span>Շնորհավորում եմ։ Բոլոր պահանջները կատարված են։</span><a class="btn small" href="#${c.id}-cert">Ստանալ սերտիֆիկատը</a>`:`<span>Քննությունն անցած է։ Սերտիֆիկատի համար ավարտիր մնացած պահանջները։</span><a class="btn small ghost" href="#${c.id}-cert">Տեսնել պահանջները</a>`));}
  },Math.ceil(ex.qs.length*PASS_FINAL/100));
  const tick=()=>{const left=Math.max(0,ex.end-Date.now());const m=Math.floor(left/60000),sc=Math.floor(left%60000/1000);tm.textContent=`Մնացած ժամանակ՝ ${String(m).padStart(2,"0")}:${String(sc).padStart(2,"0")}`;if(left<=0){clearInterval(iv);runner._submit();}};
  const iv=setInterval(()=>{if(!document.body.contains(tm)){clearInterval(iv);return;}tick();},1000); tick();
  sec.appendChild(runner);
  return sec;
}

function numField(id,label,val){const l=el("label",{class:"f"},label);const i=el("input",{type:"number",id,step:"any",value:val});l.appendChild(i);return l;}
const TOOLS={
  pert(){const b=el("div",{class:"box"}); b.appendChild(el("h3",{},"PERT հաշվիչ"));
    const g=el("div",{class:"cols"}); g.append(numField("po","Optimistic (O)",4),numField("pm","Most likely (M)",6),numField("pp","Pessimistic (P)",14)); b.appendChild(g);
    const out=el("div",{class:"formula"}); b.appendChild(out);
    const calc=()=>{const O=+$("#po",b).value,M=+$("#pm",b).value,P=+$("#pp",b).value;const E=(O+4*M+P)/6,T=(O+M+P)/3,sd=(P-O)/6;
      out.textContent=`PERT E = ${E.toFixed(2)}    Triangular = ${T.toFixed(2)}    σ = ${sd.toFixed(2)}\n68%՝ ${(E-sd).toFixed(1)} – ${(E+sd).toFixed(1)}\n95%՝ ${(E-2*sd).toFixed(1)} – ${(E+2*sd).toFixed(1)}`;};
    b.addEventListener("input",calc); calc(); return b;},
  evm(){const b=el("div",{class:"box"}); b.appendChild(el("h3",{},"EVM հաշվիչ"));
    const g=el("div",{class:"cols"}); g.append(numField("bac","BAC ($)",120000),numField("pv","PV ($)",60000),numField("ac","AC ($)",58000),numField("pc","Ավարտված %",45)); b.appendChild(g);
    const out=el("div",{class:"formula"}); b.appendChild(out); const f=n=>Math.round(n).toLocaleString("en-US");
    const calc=()=>{const BAC=+$("#bac",b).value,PV=+$("#pv",b).value,AC=+$("#ac",b).value,pc=+$("#pc",b).value/100;const EV=pc*BAC,CPI=EV/AC,SPI=EV/PV,EAC=BAC/CPI;
      out.textContent=`EV  = ${f(EV)}\nCV  = ${f(EV-AC)}   ${EV-AC<0?"(գերծախս)":"(խնայողություն)"}\nSV  = ${f(EV-PV)}   ${EV-PV<0?"(ուշացում)":"(առաջ)"}\nCPI = ${CPI.toFixed(2)}    SPI = ${SPI.toFixed(2)}\nEAC = ${f(EAC)}\nETC = ${f(EAC-AC)}\nVAC = ${f(BAC-EAC)}\nTCPI = ${((BAC-EV)/(BAC-AC)).toFixed(2)}`;};
    b.addEventListener("input",calc); calc(); b.appendChild(el("p",{class:"small muted"},"Նախ լուծիր ձեռքով, հետո ստուգիր հաշվիչով։")); return b;},
  forecast(){const b=el("div",{class:"box"}); b.appendChild(el("h3",{},"Կանխատեսման հաշվիչ (velocity և Little's Law)"));
    const vl=el("label",{class:"f"},"Վերջին sprint-երի velocity (ստորակետով)"); const vi=el("input",{type:"text",id:"vel",value:"18, 24, 21, 20"}); vl.appendChild(vi);
    const g=el("div",{class:"cols"}); g.append(vl,numField("bl","Backlog (point)",160),numField("wip","Միջին WIP",15),numField("thr","Throughput (item/շաբաթ)",5)); b.appendChild(g);
    const out=el("div",{class:"formula"}); b.appendChild(out);

      let t="";if(v.length){const avg=v.reduce((a,x)=>a+x,0)/v.length,mx=Math.max(...v),mn=Math.min(...v);t+=`Միջին velocity = ${avg.toFixed(1)}\nԿանխատեսում՝ ${Math.ceil(bl/mx)}–${Math.ceil(bl/mn)} sprint (միջինով՝ ${Math.ceil(bl/avg)})\n\n`;}
      t+=thr>0?`Little's Law: Cycle time = ${wip} / ${thr} = ${(wip/thr).toFixed(1)} շաբաթ`:"";out.textContent=t;};
    b.addEventListener("input",calc); calc(); return b;},
  rice(){const b=el("div",{class:"box"}); b.appendChild(el("h3",{},"RICE հաշվիչ"));

  interview(c){const b=el("div",{class:"box"}); b.appendChild(el("h3",{},`Փորձնական հարցազրույց՝ ${ROLE[c.id]}`));

    const types=["վարքային (STAR)","սցենարային","տեխնիկական","case study"]; let qtext=""; let count=0;
