<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script>(function(){try{if(window.parent!==window&&window.parent.claude&&window.parent.claude.use){window.claude=window.parent.claude;}}catch(e){}})();</script></head><body>
<title>IT Ակադեմիա</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@500;700;800&family=Noto+Sans+Armenian:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: planning-board — a course catalog leads to one course at a time; each course has a Gantt strip of 8 modules, then theory / practice / test per module, a final exam and a certificate */
:root{
  --paper:#f3f5f4; --sheet:#ffffff; --ink:#14232b; --muted:#5b6b70; --line:#d5dddb;
  --accent:#0f7a6c; --accent-soft:#dcefeb; --milestone:#c9821b; --milestone-soft:#f8ead2;
  --ok:#2f7d3a; --bad:#b23a2e; --bad-soft:#f7e1de; --ok-soft:#e0f0e1;
  --c-pm:#0f7a6c; --c-pdm:#7a4fb8; --c-da:#2a63b8; --c-sec:#b2452e;
  --f-display:"Noto Serif Armenian",Georgia,serif;
  --f-body:"Noto Sans Armenian","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f171a; --sheet:#162125; --ink:#e4ecea; --muted:#9aaaa8; --line:#2a3a3e;
  --accent:#4cc2ad; --accent-soft:#173a35; --milestone:#e6a84a; --milestone-soft:#3a2c14;
  --ok:#6cc27a; --bad:#ec7b6e; --bad-soft:#3d1f1c; --ok-soft:#1c3520;
  --c-pm:#4cc2ad; --c-pdm:#b394e6; --c-da:#7aa8ec; --c-sec:#ec8a72; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f171a; --sheet:#162125; --ink:#e4ecea; --muted:#9aaaa8; --line:#2a3a3e;
  --accent:#4cc2ad; --accent-soft:#173a35; --milestone:#e6a84a; --milestone-soft:#3a2c14;
  --ok:#6cc27a; --bad:#ec7b6e; --bad-soft:#3d1f1c; --ok-soft:#1c3520;
  --c-pm:#4cc2ad; --c-pdm:#b394e6; --c-da:#7aa8ec; --c-sec:#ec8a72; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:clamp(28px,5vw,40px);font-weight:800}
h2{font-size:clamp(22px,3.5vw,26px);font-weight:700}
h3{font-size:19px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header.top{display:flex;flex-direction:column;gap:10px}
header.top .lead,.lead{color:var(--muted);max-width:70ch}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips a{text-decoration:none;color:var(--ink);padding:6px 13px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:var(--sheet);display:inline-flex;align-items:center;gap:7px}
.chips a .dot{width:9px;height:9px;border-radius:50%;background:var(--cc,var(--accent))}
.chips a.on{border-color:var(--cc,var(--accent));box-shadow:inset 0 0 0 1px var(--cc,var(--accent))}
.statrow{display:flex;flex-wrap:wrap;gap:22px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-size:22px;font-weight:500}
.stat span{font-size:13px;color:var(--muted)}
.course-head{display:flex;flex-direction:column;gap:12px;border-left:4px solid var(--cc,var(--accent));padding-left:14px}
.gantt{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto}
.gantt-grid{display:grid;grid-template-columns:repeat(8,minmax(92px,1fr));gap:6px;min-width:760px}
.g-head{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:0 4px}
.g-bar{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-align:left;border-radius:6px;padding:8px;cursor:pointer;font:inherit;font-size:13px;line-height:1.3;display:flex;flex-direction:column;gap:6px;min-height:84px}
.g-bar:hover{border-color:var(--cc,var(--accent))}
.g-bar.active{border-color:var(--cc,var(--accent));box-shadow:inset 0 0 0 1px var(--cc,var(--accent))}
.fill{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
.fill i{display:block;height:100%;background:var(--cc,var(--accent))}
.g-ms{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;gap:10px;flex-wrap:wrap}
.diamond{display:inline-block;width:9px;height:9px;background:var(--milestone);transform:rotate(45deg);margin-right:6px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{text-decoration:none;color:var(--ink);padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:var(--sheet)}
nav.tabs a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
section.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:clamp(16px,3vw,24px);display:flex;flex-direction:column;gap:18px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.cols>*{min-width:0}
.box{border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.course-card{background:var(--sheet);border:1px solid var(--line);border-top:4px solid var(--cc);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink)}
.course-card:hover{border-color:var(--cc)}
.course-card .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
ul,ol{margin:0;padding-left:22px}
li{margin:3px 0}
.lesson{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.lesson-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.lesson .body{max-width:76ch;display:flex;flex-direction:column;gap:8px;min-width:0}
.formula{font-family:var(--f-mono);background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:13.5px;overflow-x:auto;white-space:pre;max-width:100%}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer;user-select:none}
.chk input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap;align-self:flex-start}
.pill.ms{background:var(--milestone-soft);color:var(--milestone)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.sub-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sub-tabs button{appearance:none;border:0;background:none;font:inherit;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.sub-tabs button.on{color:var(--ink);border-bottom-color:var(--cc,var(--accent));font-weight:600}
textarea{width:100%;min-height:180px;font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;resize:vertical}
input[type=number],input[type=text]{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
input[type=number]{font-family:var(--f-mono)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--sheet);font:inherit;font-weight:600;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--milestone);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.q{border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q .opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.opt input{margin-top:5px;accent-color:var(--accent);flex:none}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.expl{font-size:14px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.result{font-size:18px;font-weight:600}
.feedback{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:15px}
.muted{color:var(--muted)}
.small{font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl{overflow-x:auto;max-width:100%}
.timer{font-family:var(--f-mono);font-size:20px}
.save-note{font-size:12px;color:var(--muted)}
.notice{background:var(--milestone-soft);border:1px solid var(--milestone);border-radius:8px;padding:12px 14px;font-size:14px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.req{display:flex;flex-direction:column;gap:6px}
.req div{display:flex;gap:8px;align-items:center}
.req .mark{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;background:var(--line);color:var(--muted)}
.req .mark.done{background:var(--ok);color:var(--sheet)}
.cert{border:2px solid var(--cc);outline:1px solid var(--cc);outline-offset:6px;border-radius:4px;padding:clamp(20px,5vw,48px);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--sheet);margin:10px}
.cert .cname{font-family:var(--f-display);font-size:clamp(26px,5vw,40px);font-weight:800;border-bottom:1px solid var(--line);padding:0 20px 6px;min-width:min(100%,320px)}
.cert .ctitle{font-family:var(--f-display);font-size:clamp(20px,3.5vw,28px);font-weight:700;color:var(--cc)}
.cert .seal{width:64px;height:64px;border-radius:50%;border:2px solid var(--cc);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;color:var(--cc)}
.cert-meta{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.cert-meta b{display:block;color:var(--ink);font-family:var(--f-mono);font-weight:500;font-size:15px}
.intro{background:var(--accent-soft);border-radius:10px;padding:clamp(14px,3vw,20px);display:flex;flex-direction:column;gap:12px}
.intro .box{background:var(--sheet)}
.intro table{background:var(--sheet);border-radius:6px}
.simple{border-left:3px solid var(--milestone);background:var(--milestone-soft);border-radius:0 8px 8px 0;padding:12px 14px;display:flex;flex-direction:column;gap:6px;max-width:76ch}
.pre{white-space:pre-wrap}
.lesson-content{display:flex;flex-direction:column;gap:12px}
.simple .btn{align-self:flex-start}
details.qa{border:1px dashed var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:10px;max-width:76ch}
details.qa[open]{border-style:solid;background:var(--paper)}
details.qa summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
details.qa[open] summary{margin-bottom:10px}
details.qa textarea{min-height:70px;margin-top:10px;background:var(--sheet)}
details.qa .row{margin-top:8px}
.qa-thread{display:flex;flex-direction:column;gap:8px}
.msg{white-space:pre-wrap;padding:10px 12px;border-radius:10px;font-size:15px;max-width:92%}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--sheet);border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--sheet);border:1px solid var(--line);border-bottom-left-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ========== DATA ========== */
const WEEKS = [
{ n:1, aca:"ACA մոդուլ 1", title:"IT Project Management-ի հիմունքներ", short:"Հիմունքներ",
  goal:"Հասկանալ նախագիծը, ծրագիրը և պորտֆելը, PM-ի դերը IT ընկերությունում, առաջնորդության ոճերը, թիմի հասունությունը և PM-ի հմտությունների համակարգը։",
  lessons:[
    {t:"Project, Program, Portfolio", h:"1.5 ժ", b:`<p><b>Նախագիծը</b> ժամանակավոր ջանք է եզակի արդյունք (product, service, result) ստեղծելու համար։ Ունի սկիզբ և ավարտ։ <b>Գործառնությունները</b> (operations) կրկնվող, անընդհատ աշխատանք են (օր.՝ support, սերվերների սպասարկում)։</p>
      <div class="tbl"><table><tr><th></th><th>Project</th><th>Program</th><th>Portfolio</th></tr>
      <tr><td>Ինչ է</td><td>Մեկ եզակի արդյունք</td><td>Փոխկապակցված նախագծերի խումբ</td><td>Կազմակերպության բոլոր նախագծերն ու ծրագրերը</td></tr>
      <tr><td>Նպատակ</td><td>Առաքել output</td><td>Իրացնել ընդհանուր օգուտ (benefit)</td><td>Իրականացնել ռազմավարությունը</td></tr>
      <tr><td>IT օրինակ</td><td>Բանկի մոբայլ հավելվածում վճարումների նոր էկրան</td><td>Բանկի թվային փոխակերպում (app, web, CRM, API)</td><td>Բանկի բոլոր IT ներդրումները տարվա համար</td></tr>
      <tr><td>Ղեկավար</td><td>Project Manager</td><td>Program Manager</td><td>Portfolio Manager / PMO Director</td></tr></table></div>
      <p>IT-ում հաճախ օգտագործվում է նաև <b>product</b> հասկացությունը՝ անընդհատ զարգացող արտադրանք առանց ավարտի ամսաթվի։ Product-ը շատ նախագծերի և release-ների միջով է անցնում (մանրամասն՝ 6-րդ շաբաթում)։</p>`},
    {t:"PM-ի դերը IT ընկերությունում և առաջնորդության ոճերը", h:"2 ժ", b:`<p>IT ընկերություններում նույն գործառույթը կարող է տարբեր անուն ունենալ.</p>
      <ul><li><b>IT Project Manager</b>՝ պատասխանատու է ժամկետի, բյուջեի, scope-ի և շահակիցների համար (հաճախ outsource ընկերություններում՝ հաճախորդի հետ աշխատանք)</li>
      <li><b>Delivery Manager</b>՝ ապահովում է, որ մի քանի թիմ կանխատեսելիորեն առաքեն արժեք</li>
      <li><b>Scrum Master</b>՝ coaching, գործընթաց, խոչընդոտների հեռացում</li>
      <li><b>Technical Program Manager (TPM)</b>՝ տեխնիկապես ուժեղ PM, որը համակարգում է բազմաթիմային տեխնիկական ծրագրեր (Google, Amazon, Microsoft)</li></ul>
      <p><b>Առաջնորդության ոճեր.</b> Servant (ծառայել թիմին, agile-ում նախընտրելի), Transformational (ոգեշնչել տեսլականով), Transactional (պարգև/տույժ), Situational (Hersey-Blanchard՝ directing → coaching → supporting → delegating՝ ըստ թիմի հասունության), Democratic, Autocratic (միայն ճգնաժամում), Laissez-faire (փորձառու թիմին)։</p>
      <p>PM-ը հաճախ չունի ուղղակի իշխանություն թիմի վրա, ուստի ազդում է <b>influence</b>-ով՝ վստահություն, փորձագիտություն, հարաբերություններ։</p>`},
    {t:"Թիմի հասունություն (Tuckman Ladder) և PM skillset", h:"1.5 ժ", b:`<div class="tbl"><table><tr><th>Փուլ</th><th>Թիմի վարքը</th><th>PM-ի ոճը</th></tr>
      <tr><td>Forming</td><td>Քաղաքավարի, անորոշ դերեր</td><td>Directing՝ նպատակ, դերեր, կանոններ</td></tr>
      <tr><td>Storming</td><td>Վեճեր, մրցակցություն</td><td>Coaching՝ կոնֆլիկտների լուծում, working agreement</td></tr>
      <tr><td>Norming</td><td>Համաձայնություն, վստահություն</td><td>Supporting՝ ավելի շատ ինքնուրույնություն</td></tr>
      <tr><td>Performing</td><td>Բարձր արդյունավետություն, ինքնակազմակերպում</td><td>Delegating՝ հեռացնել խոչընդոտները</td></tr>
      <tr><td>Adjourning</td><td>Նախագծի ավարտ, թիմի ցրում</td><td>Ճանաչում, lessons learned</td></tr></table></div>
      <p>Նոր անդամի միանալը կամ նպատակի փոփոխությունը կարող է թիմը հետ տանել Storming։</p>
      <p><b>PMI Talent Triangle</b>՝ PM-ի հմտությունների 3 խումբ. <b>Ways of Working</b> (predictive, agile, hybrid մեթոդներ), <b>Power Skills</b> (հաղորդակցություն, առաջնորդություն, համագործակցություն, empathy), <b>Business Acumen</b> (բիզնեսի, ֆինանսների, ռազմավարության իմացություն)։</p>
      <p><b>IPMA ICB4</b>-ը (եվրոպական ստանդարտ) նույն կերպ բաժանում է կոմպետենցիաները՝ <b>People</b>, <b>Practice</b>, <b>Perspective</b>։</p>`},
    {t:"Soft Skills vs Hard Skills", h:"1.5 ժ", b:`<div class="cols"><div class="box"><b>Hard skills (տեխնիկական)</b><ul><li>Պլանավորում՝ WBS, ժամանակացույց, գնահատում</li><li>Բյուջե և EVM</li><li>Ռիսկերի կառավարում</li><li>Agile framework-ներ (Scrum, Kanban)</li><li>Գործիքներ՝ Jira, Confluence, Excel, MS Project</li><li>Տեխնիկական գրագիտություն (TFNT, SDLC, API, DB)</li><li>Հաշվետվություններ և metrics</li></ul></div>
      <div class="box"><b>Soft (power) skills</b><ul><li>Հաղորդակցություն (գրավոր և բանավոր)</li><li>Բանակցություն և ազդեցություն</li><li>Կոնֆլիկտների կառավարում</li><li>Emotional intelligence</li><li>Facilitation՝ հանդիպումների վարում</li><li>Որոշումների կայացում անորոշության մեջ</li><li>Ժամանակի կառավարում, առաջնահերթություն</li><li>Critical thinking</li></ul></div></div>
      <p>Hard skills-ը բացում է հարցազրույցի դուռը, soft skills-ը որոշում է՝ կմնաս և կաճես, թե ոչ։ Մեծ մասամբ նախագծերը ձախողվում են մարդկային պատճառներով, ոչ թե տեխնիկական։</p>
      <p><b>Ինչպես զարգացնել soft skills.</b> Վարիր հանդիպումներ (նույնիսկ կամավորական), գրիր ամփոփումներ յուրաքանչյուր հանդիպումից հետո, խնդրիր feedback, կարդա «Crucial Conversations» և «Never Split the Difference»։</p>`},
    {t:"PMBOK® Guide 8-րդ հրատարակություն", h:"1.5 ժ", b:`<p>Հրապարակվել է 2025-ի նոյեմբերին։ Կառուցվածքը՝ <b>6 սկզբունք</b> (ինչու), <b>7 կատարողական ոլորտ</b> (ինչ), <b>5 ֆոկուս-ոլորտ՝ 40 գործընթացով</b> (ինչպես)։</p>
      <div class="cols"><div class="box"><b>6 սկզբունք</b><ol><li>Ամբողջական (holistic) հայացք</li><li>Կենտրոնացում արժեքի վրա</li><li>Որակը՝ ներկառուցված</li><li>Լինել հաշվետու առաջնորդ</li><li>Կայունության ինտեգրում</li><li>Իրավազորված թիմերի ստեղծում</li></ol></div>
      <div class="box"><b>7 ոլորտ</b><ol><li>Governance</li><li>Scope</li><li>Schedule</li><li>Finance</li><li>Stakeholders</li><li>Resources</li><li>Risk</li></ol></div>
      <div class="box"><b>5 ֆոկուս-ոլորտ</b><ol><li>Initiating</li><li>Planning</li><li>Executing</li><li>Monitoring & Controlling</li><li>Closing</li></ol></div></div>
      <p>PMP քննությունը 2026-ի հուլիսից՝ People 33%, Process 41%, Business Environment 26%։ Հարցերի մոտ 60%-ը agile և hybrid է։</p>`},
    {t:"Կազմակերպական կառուցվածքներ և PMO", h:"1 ժ", b:`<ul><li><b>Functional</b>՝ PM-ի իշխանությունը փոքր է, ռեսուրսները կառավարում է բաժնի ղեկավարը</li><li><b>Matrix</b> (թույլ / հավասարակշռված / ուժեղ)՝ թիմի անդամը ունի երկու ղեկավար (օր.՝ QA-ն հաշվետու է QA Lead-ին և PM-ին)</li><li><b>Projectized</b>՝ PM-ը ունի լիարժեք իշխանություն</li><li><b>Product-oriented</b> (IT-ում տարածված)՝ կայուն cross-functional թիմեր՝ կապված product-ին</li></ul>
      <p><b>PMO</b> (Project Management Office)՝ ստանդարտներ, template-ներ, հաշվետվություն, պորտֆելի կառավարում։ Տեսակներ՝ supportive, controlling, directive։ Agile կազմակերպություններում հաճախ կոչվում է <b>Agile PMO</b> կամ <b>Value Management Office</b>։</p>`}
  ],
  practice:{t:"Capstone IT նախագծի ընտրություն և ինքնագնահատում",
    steps:["Ընտրիր IT նախագիծ, որը կտանես 8 շաբաթ (օր.՝ Երևանում սրճարանների ցանցի համար մոբայլ պատվերների հավելված, բանկի համար online վարկի դիմումի էջ, ատամնաբուժարանի ամրագրման համակարգ)","Գրիր Problem Statement՝ ի՞նչ խնդիր, ո՞ւմ համար, ինչո՞ւ հիմա","Որոշիր՝ project է, թե product, և ինչ կազմակերպական կառուցվածքում է","Ինքնագնահատում՝ գնահատիր քեզ 1–5 սանդղակով 12 հմտությունում (6 hard, 6 soft) և ընտրիր 3-ը, որոնք կզարգացնես այս 2 ամսում","Նկարագրիր՝ ինչ առաջնորդության ոճ կկիրառես Forming փուլում և ինչու"],
    deliverable:"Problem Statement + հմտությունների մատրից + զարգացման 3 նպատակ"},
  quiz:[

    ["Թիմում վեճեր են սկսվել աշխատանքի մեթոդների շուրջ։ Tuckman-ի ո՞ր փուլն է։",["Forming","Storming","Norming","Adjourning"],1,"Storming՝ տարաձայնությունների և մրցակցության փուլ։"],
    ["PMI Talent Triangle-ի ո՞ր խմբին է պատկանում բանակցելու հմտությունը։",["Ways of Working","Business Acumen","Power Skills","Technical Skills"],2,"Հաղորդակցությունը, բանակցությունը, առաջնորդությունը Power Skills են։"],
    ["Ո՞րն է hard skill։",["Empathy","Critical path-ի հաշվարկ","Facilitation","Ակտիվ լսել"],1,"Critical path-ը տեխնիկական, չափելի հմտություն է։"],
    ["PMBOK 8-ում քանի՞ կատարողական ոլորտ կա։",["8","10","7","5"],2,"Governance, Scope, Schedule, Finance, Stakeholders, Resources, Risk։"],

{ n:2, aca:"ACA մոդուլ 3", title:"Agile մտածելակերպ և նախագծի մեկնարկ", short:"Agile Mindset",
  goal:"Հասկանալ Agile-ը իրականում, ընտրել ճիշտ կյանքի ցիկլ, իմանալ, թե ինչու են նախագծերը ձախողվում, և ճիշտ մեկնարկել նախագիծը։",
  lessons:[
    {t:"Agile Manifesto՝ 4 արժեք և 12 սկզբունք", h:"1.5 ժ", b:`<p>Գրվել է 2001-ին 17 ծրագրավորողների կողմից։ <b>4 արժեք</b>.</p><ol><li><b>Մարդիկ և փոխազդեցություն</b>՝ գործընթացներից և գործիքներից վեր</li><li><b>Աշխատող ծրագիր</b>՝ սպառիչ փաստաթղթերից վեր</li><li><b>Հաճախորդի հետ համագործակցություն</b>՝ պայմանագրային բանակցություններից վեր</li><li><b>Փոփոխությանն արձագանքելը</b>՝ պլանին հետևելուց վեր</li></ol>
      <p>Կարևոր. աջ կողմի տարրերը նույնպես արժեք ունեն, պարզապես ձախ կողմինն ավելի մեծ է։</p>
      <p><b>12 սկզբունք (ամփոփ).</b> 1) հաճախորդի բավարարում վաղ և շարունակական առաքմամբ, 2) փոփոխությունները ողջունելի են նույնիսկ ուշ, 3) հաճախակի առաքում (շաբաթներ, ոչ ամիսներ), 4) բիզնեսը և ծրագրավորողները աշխատում են միասին ամեն օր, 5) մոտիվացված մարդիկ և վստահություն, 6) դեմ առ դեմ զրույցը ամենաարդյունավետն է, 7) աշխատող ծրագիրը առաջընթացի հիմնական չափն է, 8) կայուն տեմպ (sustainable pace), 9) տեխնիկական գերազանցություն և լավ դիզայն, 10) պարզություն՝ չարված աշխատանքի առավելագույնացում, 11) լավագույն լուծումները գալիս են ինքնակազմակերպվող թիմերից, 12) պարբերական արտացոլում և հարմարեցում։</p>`},
    {t:"Agile՝ առասպելներ և իրականություն", h:"1 ժ", b:`<div class="tbl"><table><tr><th>Առասպել</th><th>Իրականություն</th></tr>
      <tr><td>Agile-ում փաստաթղթեր չկան</td><td>Կան, բայց միայն այն, ինչ արժեք է տալիս (just enough)</td></tr>
      <tr><td>Agile-ում պլանավորում չկա</td><td>Պլանավորումն ավելի հաճախ է՝ ամեն sprint, release, quarter</td></tr>
      <tr><td>Agile-ը նշանակում է առանց ժամկետների</td><td>Ժամկետները ֆիքսված են (timebox), ճկուն է scope-ը</td></tr>
      <tr><td>Agile = Scrum</td><td>Scrum-ը framework-ներից մեկն է. կան Kanban, XP, Lean, SAFe և այլն</td></tr>
      <tr><td>Agile-ով ամեն ինչ ավելի արագ է</td><td>Արժեքն ավելի վաղ է հասնում, բայց աշխատանքի ծավալը չի նվազում</td></tr>
      <tr><td>Agile-ում PM պետք չէ</td><td>PM-ի գործառույթները մնում են. փոխվում են դերերը և ոճը</td></tr>
      <tr><td>Agile-ը միայն IT-ի համար է</td><td>Կիրառվում է մարկետինգում, HR-ում, բանկերում, պետական ծառայություններում</td></tr>
      <tr><td>Daily standup-ը հաշվետվություն է ղեկավարին</td><td>Թիմի ներքին համակարգման հանդիպում է</td></tr></table></div>`},
    {t:"Կյանքի ցիկլեր՝ Waterfall vs Agile vs Hybrid", h:"1.5 ժ", b:`<ul><li><b>Predictive (Waterfall)</b>՝ Requirements → Design → Development → Testing → Deployment։ Լավ է, երբ պահանջները կայուն են, փոփոխությունը թանկ է (շինարարություն, կարգավորվող համակարգեր)</li>
      <li><b>Iterative</b>՝ կրկնվող ցիկլեր՝ բարելավելով նույն արդյունքը</li><li><b>Incremental</b>՝ արդյունքը ավելանում է մաս առ մաս</li>
      <li><b>Adaptive (Agile)</b>՝ iterative + incremental, կարճ ցիկլեր, հաճախակի feedback</li>
      <li><b>Hybrid</b>՝ օր.՝ ֆիքսված բյուջե, պայմանագիր և milestone-ներ (predictive), բայց մշակումը sprint-երով (agile)</li></ul>
      <div class="tbl"><table><tr><th>Գործոն</th><th>Predictive</th><th>Agile</th></tr>
      <tr><td>Պահանջների կայունություն</td><td>Բարձր</td><td>Ցածր, փոփոխվող</td></tr><tr><td>Տեխնոլոգիական անորոշություն</td><td>Ցածր</td><td>Բարձր</td></tr><tr><td>Հաճախորդի հասանելիություն</td><td>Սահմանափակ</td><td>Հաճախակի</td></tr><tr><td>Արժեքի առաքում</td><td>Վերջում</td><td>Ամեն 1–4 շաբաթ</td></tr><tr><td>Փոփոխության գինը</td><td>Բարձր</td><td>Ցածր</td></tr></table></div>
      <p><b>Stacey matrix</b>՝ որքան անորոշ են պահանջներն ու տեխնոլոգիան, այնքան ավելի հարմար է agile մոտեցումը։</p>`},
    {t:"Ինչու են նախագծերը ձախողվում", h:"1.5 ժ", b:`<p>Հիմնական պատճառները (ըստ PMI-ի և Standish Group-ի հետազոտությունների).</p>
      <ol><li>Անհստակ նպատակներ և պահանջներ</li><li>Sponsor-ի և ղեկավարության աջակցության պակաս</li><li>Scope creep և վատ փոփոխությունների կառավարում</li><li>Անիրատեսական գնահատումներ և ժամկետներ</li><li>Վատ հաղորդակցություն և շահակիցների չներգրավում</li><li>Ռիսկերի անտեսում</li><li>Օգտատերերի (end users) մասնակցության բացակայություն</li><li>Թիմի հմտությունների պակաս կամ գերբեռնվածություն</li><li>Տեխնոլոգիական բարդության թերագնահատում</li><li>Մեծ «big bang» release-ներ՝ առանց վաղ feedback-ի</li></ol>
      <p>Standish Group-ի 2015 CHAOS հաշվետվության համաձայն՝ agile նախագծերը մոտ 3.5 անգամ ավելի հավանական է, որ հաջողեն, քան waterfall նախագծերը, և տարբերությունը մեծանում է նախագծի չափի հետ։</p>
      <p><b>Premortem</b> տեխնիկա (Atlassian, Gary Klein)՝ նախագծի սկզբում պատկերացրեք, որ այն ձախողվել է, և թիմով գրեք՝ ինչու։ Ստացված ցանկը դառնում է ռիսկերի ցանկ։</p>`},
    {t:"Mindset vs Methodology vs Tools", h:"1 ժ", b:`<div class="formula">Mindset (ինչպես ենք մտածում)       →  արժեքներ, սկզբունքներ
  Methodology / Framework (ինչ ենք անում) →  Scrum, Kanban, SAFe
    Tools / Practices (ինչով)        →  Jira, board, standup</div>
      <p><b>«Doing Agile» vs «Being Agile».</b> Թիմը կարող է ունենալ Jira, sprint-ներ և daily standup, բայց մնալ waterfall մտածելակերպով (cargo cult agile)։ Նշաններ՝ «sprint»-ը պարզապես 2-շաբաթյա deadline է, retro-ից ոչինչ չի փոխվում, PO-ն թելադրում է «ինչպես», թեստավորումը մնում է վերջում։</p>
      <p>Գործիքը չի դարձնում թիմը agile։ Սկզբում փոխվում է մտածելակերպը, հետո ընտրվում է framework-ը, իսկ վերջում՝ գործիքը, որ աջակցի դրան։</p>`},
    {t:"Նախագծի մեկնարկ՝ Business Case, Charter, շահակիցներ, RACI", h:"2 ժ", b:`<p><b>Business case</b>՝ ինչո՞ւ անել նախագիծը։ Չափանիշներ.</p><div class="formula">ROI = (Օգուտ − Ծախս) / Ծախս × 100%
Payback period = Ներդրում / Տարեկան զուտ մուտք
NPV > 0 → շահավետ է</div>
      <p><b>Project Charter</b>-ը պաշտոնապես թույլատրում է նախագիծը։ Ստորագրում է <b>sponsor</b>-ը։ Պարունակում է՝ նպատակ, SMART նպատակներ, բարձր մակարդակի scope (in/out), milestone-ներ, ամփոփ բյուջե, ռիսկեր, ենթադրություններ, հաջողության չափանիշներ։ Agile-ում նմանատիպ դեր ունեն <b>Product Vision</b>-ը և <b>Project Poster</b>-ը (Atlassian)։</p>
      <p><b>Շահակիցներ.</b> Power/Interest grid՝ Manage closely / Keep satisfied / Keep informed / Monitor։ Engagement մակարդակներ՝ Unaware → Resistant → Neutral → Supportive → Leading։</p>
      <p><b>RACI</b>՝ Responsible (կատարում է), Accountable (վերջնական պատասխանատու, միայն մեկը), Consulted, Informed։</p>`}
  ],
  practice:{t:"Charter, շահակիցներ, RACI և Premortem",
    steps:["Գրիր capstone նախագծի Charter-ը (կամ Project Poster)՝ 3 SMART նպատակով","Ընտրիր կյանքի ցիկլը (predictive, agile, hybrid) և հիմնավորիր աղյուսակի 5 գործոնով","Կազմիր Stakeholder Register՝ առնվազն 8 շահակից, Power/Interest grid-ով","Կազմիր RACI մատրից 6 հիմնական գործողության համար","Անցկացրու Premortem. գրիր 10 պատճառ, թե ինչու կարող է նախագիծը ձախողվել, և 3-ի համար՝ կանխարգելող քայլ"],
    deliverable:"Charter, Stakeholder Register, RACI, Premortem ցանկ"},

    ["Պահանջները շատ անորոշ են, տեխնոլոգիան նոր է։ Ո՞ր մոտեցումը։",["Predictive","Agile","V-model","Ոչ մեկը"],1,"Բարձր անորոշությունը agile-ի դասական պայման է։"],

{ n:3, aca:"ACA մոդուլ 4", title:"Agile Framework-ներ և մեթոդաբանություններ", short:"Frameworks",
  goal:"Տիրապետել Scrum-ին Scrum Guide-ի մակարդակով, Kanban-ին, Scrumban-ին, XP-ին և Lean-ին, վերացնել վատնումները և կառավարել հոսքը։",
  lessons:[
    {t:"Scrum-ի տեսությունը՝ էմպիրիզմ, հենասյուներ, արժեքներ", h:"1 ժ", b:`<p>Scrum-ը հիմնված է <b>էմպիրիզմի</b> (գիտելիքը գալիս է փորձից) և <b>lean</b> մտածողության վրա։ Երեք հենասյուն.</p>
      <ul><li><b>Transparency</b>՝ աշխատանքը և գործընթացը տեսանելի են բոլորին</li><li><b>Inspection</b>՝ հաճախակի ստուգել արտեֆակտները և առաջընթացը</li><li><b>Adaptation</b>՝ շեղման դեպքում անմիջապես հարմարվել</li></ul>
      <p><b>5 արժեք.</b> Commitment, Focus, Openness, Respect, Courage։</p>
      <p>Scrum-ը <b>framework</b> է, ոչ թե ամբողջական մեթոդաբանություն. այն միտումնավոր թերի է, և թիմը լրացնում է այն իր պրակտիկաներով (user stories, story points, TDD և այլն)։ Աղբյուր՝ Scrum Guide 2020 (scrumguides.org)։</p>`},
    {t:"Scrum Team-ի դերերը", h:"1.5 ժ", b:`<p>Scrum Team-ը սովորաբար <b>10 կամ ավելի քիչ</b> մարդ է, առանց ենթաթիմերի և հիերարխիայի, cross-functional և self-managing։</p>
      <div class="cols"><div class="box"><b>Product Owner</b><ul><li>Մեկ մարդ է, ոչ կոմիտե</li><li>Ձևակերպում է Product Goal-ը</li><li>Ստեղծում և դասավորում է Product Backlog-ը</li><li>Միայն PO-ն կարող է չեղարկել Sprint-ը</li></ul></div>
      <div class="box"><b>Scrum Master</b><ul><li>Պատասխանատու է Scrum-ի արդյունավետության համար</li><li>Coaching՝ թիմին, PO-ին, կազմակերպությանը</li><li>Հեռացնում է խոչընդոտները</li><li>Servant leader</li></ul></div>
      <div class="box"><b>Developers</b><ul><li>Ստեղծում են օգտագործելի Increment ամեն Sprint</li><li>Տիրապետում են Sprint Backlog-ին</li><li>Հետևում են Definition of Done-ին</li><li>Ցանկացած մասնագետ՝ ծրագրավորող, QA, դիզայներ, անալիտիկ</li></ul></div></div>
      <p>Scrum-ում «Project Manager» դեր <b>չկա</b>. PM-ի գործառույթները բաշխված են երեք դերերի միջև։ Իրական կյանքում PM-ը հաճախ դառնում է Scrum Master, Delivery Manager կամ համակարգում է մի քանի Scrum թիմ։</p>`},
    {t:"Scrum-ի իրադարձություններ և արտեֆակտներ", h:"1.5 ժ", b:`<div class="tbl"><table><tr><th>Իրադարձություն</th><th>Max (1-ամսյա Sprint)</th><th>Ով</th><th>Արդյունք</th></tr>
      <tr><td>Sprint</td><td>≤ 1 ամիս, ֆիքսված</td><td>Ամբողջ թիմ</td><td>Increment</td></tr>
      <tr><td>Sprint Planning</td><td>8 ժամ</td><td>Ամբողջ թիմ</td><td>Sprint Goal + Sprint Backlog</td></tr>
      <tr><td>Daily Scrum</td><td>15 րոպե</td><td>Developers</td><td>Օրվա պլան</td></tr>
      <tr><td>Sprint Review</td><td>4 ժամ</td><td>Թիմ + շահակիցներ</td><td>Ճշգրտված Product Backlog</td></tr>
      <tr><td>Sprint Retrospective</td><td>3 ժամ</td><td>Ամբողջ թիմ</td><td>Բարելավումներ</td></tr></table></div>
      <p><b>3 արտեֆակտ և դրանց պարտավորությունները.</b> Product Backlog → <b>Product Goal</b>, Sprint Backlog → <b>Sprint Goal</b>, Increment → <b>Definition of Done</b>։</p>
      <p>Sprint Planning-ը պատասխանում է 3 հարցի՝ <i>Ինչու՞</i> (Sprint Goal), <i>Ի՞նչ</i>, <i>Ինչպե՞ս</i>։ <b>Backlog refinement</b>-ը իրադարձություն չէ, այլ շարունակական գործողություն։</p>`},
    {t:"Kanban և Scrumban", h:"1.5 ժ", b:`<p><b>Kanban Method</b>-ի 6 պրակտիկա.</p><ol><li>Visualize՝ տեսանելի board</li><li>Limit WIP՝ սահմանափակել ընթացիկ աշխատանքը</li><li>Manage flow՝ կառավարել հոսքը, վերացնել խցանումները</li><li>Make policies explicit՝ հստակ կանոններ (օր.՝ ինչ է «Done»)</li><li>Implement feedback loops՝ պարբերական հանդիպումներ</li><li>Improve collaboratively, evolve experimentally</li></ol>

      <tr><td>Լավագույնը</td><td>Նոր product-ի մշակում</td><td>Support, DevOps, operations</td><td>Mixed թիմեր</td></tr></table></div>`},
    {t:"XP և Lean՝ վատնումների վերացում և հոսքի կառավարում", h:"2 ժ", b:`<p><b>Extreme Programming (XP)</b>՝ ինժեներական պրակտիկաներ. pair programming, TDD (Test-Driven Development), continuous integration, refactoring, small releases, collective code ownership, coding standards, sustainable pace։ Արժեքներ՝ communication, simplicity, feedback, courage, respect։</p>
      <p><b>Lean</b>-ը եկել է Toyota-ից։ Ծրագրային ապահովման 7 վատնում (Mary և Tom Poppendieck).</p>

      <tr><td>Partially done work</td><td>Չmerge արված կոդ, չթեստավորված feature</td></tr><tr><td>Extra features</td><td>Գործառույթներ, որոնք ոչ ոք չի օգտագործում</td></tr><tr><td>Relearning</td><td>Գիտելիքը չի փաստագրվել, նորից են ուսումնասիրում</td></tr><tr><td>Handoffs</td><td>Աշխատանքը փոխանցվում է թիմից թիմ՝ կորցնելով կոնտեքստը</td></tr><tr><td>Task switching</td><td>Մեկ մարդը միաժամանակ 4 նախագծի վրա</td></tr><tr><td>Delays</td><td>Սպասել հաստատման, code review-ի, միջավայրի</td></tr><tr><td>Defects</td><td>Bug-եր, որոնք հայտնաբերվում են ուշ</td></tr></table></div>
      <p><b>Value Stream Mapping</b>՝ գծել գործընթացի բոլոր քայլերը և չափել, թե որքան ժամանակ է իրական աշխատանք, որքան՝ սպասում։ <b>Flow efficiency</b> = աշխատանքային ժամանակ / ընդհանուր lead time։ Հաճախ այն 15%-ից ցածր է, այսինքն՝ աշխատանքի մեծ մասը սպասում է։</p>`},

  goal:"Գնահատել աշխատանքը agile և predictive մեթոդներով, չափել թիմի կատարողականը և կանխատեսել առաքումը։",
  lessons:[
    {t:"Agile գնահատման տեխնիկաներ", h:"1.5 ժ", b:`<p><b>Relative</b> (հարաբերական) գնահատում՝ համեմատել story-ները իրար հետ, ոչ թե գնահատել ժամերով։ Մարդիկ ավելի լավ են համեմատում, քան բացարձակ թվեր գուշակում։</p>
      <ul><li><b>Planning Poker</b>՝ PO-ն կարդում է story-ն, թիմը քննարկում է, բոլորը միաժամանակ բացում են քարտերը։ Ամենաբարձր և ամենացածր գնահատողները բացատրում են պատճառը։ Կրկնում են մինչև համաձայնություն։ Կանխում է anchoring-ը (առաջին ասված թվի ազդեցությունը)</li>
      <li><b>T-shirt sizing</b>՝ XS, S, M, L, XL։ Արագ է, հարմար epic-ների և roadmap-ի համար</li>
      <li><b>Dot voting</b>՝ յուրաքանչյուրը ստանում է, օր.՝ 3–5 կետ և դնում է նախընտրած տարբերակների վրա։ Օգտագործվում է <b>առաջնահերթության</b> համար, ոչ թե չափի</li>
      <li><b>Affinity estimation</b> (Wall estimation)՝ story-ները լուռ դասավորվում են պատին փոքրից մեծ, հետո խմբավորվում։ Հարմար է 50+ story արագ գնահատելու համար</li>
      <li><b>Bucket system</b>՝ նման affinity-ին, բայց նախապես պատրաստված «դույլերով» (1, 2, 3, 5, 8...)</li></ul>`},
    {t:"Fibonacci և Story Points", h:"1.5 ժ", b:`<div class="formula">Modified Fibonacci: 0, ½, 1, 2, 3, 5, 8, 13, 20, 40, 100, ?, ☕</div>
      <p><b>Ինչու Fibonacci.</b> Որքան մեծ է աշխատանքը, այնքան մեծ է անորոշությունը։ 5-ի և 6-ի միջև տարբերությունն անիմաստ է, իսկ 5-ի և 8-ի միջև՝ իմաստալից։</p>
      <p><b>Story point</b>-ը միավորում է երեք բան՝ <b>effort</b> (ծավալ), <b>complexity</b> (բարդություն), <b>uncertainty</b> (անորոշություն)։</p>
      <ul><li>Ընտրել reference story (օր.՝ «login էջը» = 3) և համեմատել դրա հետ</li><li>13-ից մեծ story-ն պետք է բաժանել</li><li>«?»՝ բավարար տեղեկություն չկա → spike</li><li>Մի՛ փոխակերպիր point-երը ժամերի</li><li>Մի՛ համեմատիր տարբեր թիմերի point-երը. յուրաքանչյուր թիմ ունի իր սանդղակը</li></ul>
      <p><b>Velocity</b>՝ sprint-ում ավարտված point-երի գումարը։ Կանխատեսման համար վերցնում են վերջին 3–5 sprint-ի միջինը կամ միջակայքը։</p>
      <div class="formula">Մնացած sprint-ներ ≈ Backlog-ի point-եր / Միջին velocity</div>`},
    {t:"Scrum metrics", h:"1.5 ժ", b:`<div class="tbl"><table><tr><th>Metric</th><th>Ինչ է ցույց տալիս</th><th>Զգուշացում</th></tr>
      <tr><td>Velocity</td><td>Թիմի կարողությունը sprint-ում</td><td>Պլանավորման գործիք է, ոչ թե KPI</td></tr>
      <tr><td>Sprint Burndown</td><td>Մնացած աշխատանքը sprint-ի ընթացքում</td><td>Հարթ գիծը, ապա կտրուկ անկումը՝ մեծ story-ների նշան է</td></tr>
      <tr><td>Release Burnup</td><td>Ավարտված և ընդհանուր scope-ը</td><td>Լավագույնը scope creep-ը տեսնելու համար</td></tr>
      <tr><td>Sprint Goal success rate</td><td>Քանի sprint-ում է goal-ը հասել</td><td>Ավելի կարևոր է, քան point-երի քանակը</td></tr>
      <tr><td>Say/Do ratio (commitment reliability)</td><td>Ավարտված / պլանավորված</td><td>Կայուն 80–100%-ը կանխատեսելիության նշան է</td></tr>
      <tr><td>Escaped defects</td><td>Production-ում հայտնաբերված bug-եր</td><td>Որակի և DoD-ի ցուցանիշ</td></tr>
      <tr><td>Scope change</td><td>Sprint-ի ընթացքում ավելացված աշխատանք</td><td>Բարձր թիվը՝ պլանավորման խնդիր</td></tr></table></div>`},
    {t:"Kanban և flow metrics", h:"1.5 ժ", b:`<ul><li><b>Lead time</b>՝ հարցումից մինչև առաքում (հաճախորդի տեսանկյունից)</li><li><b>Cycle time</b>՝ աշխատանքը սկսելուց մինչև ավարտ</li><li><b>Throughput</b>՝ ավարտված item-ների քանակը ժամանակահատվածում</li><li><b>WIP</b>՝ ընթացիկ item-ների քանակը</li><li><b>Work item age</b>՝ որքան ժամանակ է item-ը «In Progress»-ում (վաղ ազդանշան)</li><li><b>Cumulative Flow Diagram (CFD)</b>՝ յուրաքանչյուր կարգավիճակի item-ների քանակը ժամանակի ընթացքում։ Լայնացող շերտը՝ խցանում</li></ul>
      <div class="formula">Little's Law:  Միջին Cycle time = Միջին WIP / Միջին Throughput
Օրինակ: WIP = 12, Throughput = 6 item/շաբաթ → Cycle time = 2 շաբաթ</div>
      <p>Եզրակացություն՝ ավելի արագ առաքելու ամենաէժան ճանապարհը WIP-ը նվազեցնելն է։ <b>Monte Carlo forecasting</b>՝ պատմական throughput-ի հիման վրա հազարավոր սիմուլյացիաներ, որոնք տալիս են հավանականություն («85% հավանականությամբ կավարտենք մինչև մարտի 15»)։</p>`},
    {t:"Agile metrics թիմի կատարողականի համար", h:"1.5 ժ", b:`<p><b>DORA metrics</b> (Google-ի DevOps Research and Assessment)՝ software delivery-ի կատարողականի ստանդարտ։ Այժմ 5 ցուցանիշ է.</p>
      <div class="tbl"><table><tr><th>Խումբ</th><th>Metric</th><th>Սահմանում</th></tr>
      <tr><td rowspan="3">Throughput</td><td>Change lead time</td><td>Commit-ից մինչև production</td></tr><tr><td>Deployment frequency</td><td>Deploy-ների հաճախականություն</td></tr><tr><td>Failed deployment recovery time</td><td>Ձախողված deploy-ից վերականգնման ժամանակ</td></tr>
      <tr><td rowspan="2">Instability</td><td>Change fail rate</td><td>Deploy-ների բաժինը, որոնք պահանջում են անհապաղ միջամտություն</td></tr><tr><td>Deployment rework rate</td><td>Չպլանավորված deploy-ներ՝ production incident-ի պատճառով</td></tr></table></div>
      <p><b>SPACE framework</b> (GitHub, Microsoft)՝ Satisfaction, Performance, Activity, Communication, Efficiency։ Ցույց է տալիս, որ արտադրողականությունը չի չափվում մեկ թվով։</p>
      <p><b>Team Health Check</b> (Spotify-ի մոդել)՝ թիմը կանաչ/դեղին/կարմիր է գնահատում կատեգորիաներ (Fun, Learning, Speed, Mission, Tech quality, Easy to release, Support, Value)։</p>
      <p><b>Goodhart-ի օրենք.</b> «Երբ չափանիշը դառնում է նպատակ, այն դադարում է լավ չափանիշ լինել»։ Եթե velocity-ն KPI է, թիմը կսկսի ուռճացնել point-երը։ Խուսափիր <b>vanity metrics</b>-ից (կոդի տողեր, commit-ների քանակ)։</p>`},
    {t:"Predictive պլանավորում՝ WBS, Critical Path, բյուջե, EVM", h:"2.5 ժ", b:`<p><b>WBS</b>՝ ամբողջ աշխատանքի հիերարխիկ բաժանումը work package-ների (100% կանոն)։ Scope baseline = Scope statement + WBS + WBS dictionary։</p>
      <div class="formula">PERT  E = (O + 4M + P) / 6      σ = (P − O) / 6
Forward pass:  EF = ES + Duration
Backward pass: LS = LF − Duration
Total Float = LS − ES   (Critical path-ում = 0)</div>
      <p>Ժամանակացույցի սեղմում՝ <b>Crashing</b> (ավելացնել ռեսուրս, թանկ) և <b>Fast tracking</b> (զուգահեռել, ռիսկային)։</p>
      <p><b>Բյուջե.</b> Work package-ների ծախսեր + contingency reserve = cost baseline. + management reserve = project budget։</p>
      <div class="formula">EV = % ավարտ × BAC
CV = EV − AC     SV = EV − PV       (բացասականը վատ է)
CPI = EV / AC    SPI = EV / PV      (1-ից փոքրը վատ է)
EAC = BAC / CPI   ETC = EAC − AC   VAC = BAC − EAC</div>
      <p>Hybrid նախագծերում (օր.՝ outsource ընկերություն ֆիքսված պայմանագրով) PM-ը հաճախ օգտագործում է և՛ velocity, և՛ EVM։</p>`}

{ n:5, aca:"ACA մոդուլ 5", title:"Գործիքներ և պրակտիկաներ", short:"Tools",
  goal:"Աշխատել Jira-ում, Confluence-ում, Asana-ում և Miro-ում, գրել որակյալ user story-ներ, acceptance criteria, DoD և DoR։",
  lessons:[
    {t:"Jira-ի հիմունքներ", h:"1.5 ժ", b:`<p><b>Jira</b>-ն Atlassian-ի աշխատանքի կառավարման գործիքն է, որը շատ տարածված է IT ոլորտում, այդ թվում Հայաստանի IT ընկերություններում։ Կա անվճար պլան փոքր թիմերի համար։</p>
      <p><b>Atlassian էկոհամակարգ.</b> Jira (առաջադրանքներ), <b>Confluence</b> (wiki), <b>Jira Service Management</b> (support), Jira Product Discovery (product ideas), Bitbucket (կոդ), Loom (վիդեո), Trello (պարզ board), Rovo (AI)։</p>
      <p><b>Նախագծի տեսակներ.</b> Team-managed (պարզ, թիմն ինքն է կարգավորում) և Company-managed (կենտրոնացված կարգավորում ադմինի կողմից)։ Template-ներ՝ Scrum, Kanban, Bug tracking։</p>
      <div class="formula">Epic                 — մեծ նպատակ, մի քանի sprint
 └ Story / Task / Bug — մեկ sprint-ում ավարտվող աշխատանք
     └ Sub-task       — տեխնիկական քայլ</div>
      <p><b>Կարևոր դաշտեր.</b> Summary, Description, Assignee, Reporter, Priority, Story Points, Sprint, Labels, Components, Fix Version, Due date, Linked issues («blocks», «is blocked by», «relates to»)։</p>`},
    {t:"Scrum և Kanban board-եր", h:"1.5 ժ", b:`<p><b>Workflow</b>՝ issue-ի կարգավիճակների ճանապարհը։ Պարզագույնը՝ <span class="mono">To Do → In Progress → Done</span>, իրական թիմերում՝ <span class="mono">Backlog → Selected → In Progress → Code Review → QA → Done</span>։</p>
      <p><b>Sprint-ի ցիկլը Jira-ում.</b></p><ol><li><b>Backlog</b> էջում դասավորիր story-ները և գնահատիր</li><li><b>Create sprint</b>՝ քաշիր story-ները velocity-ի սահմաններում</li><li><b>Start sprint</b>՝ նշիր Sprint Goal-ը և տևողությունը</li><li>Daily Scrum-ը անցկացրու <b>Active sprint board</b>-ի առջև</li><li><b>Complete sprint</b>՝ չավարտվածը գնում է backlog կամ հաջորդ sprint</li></ol>
      <p><b>Kanban board</b>՝ WIP limit-ներ սյունակների վրա (Board settings → Columns), swimlane-ներ (ըստ priority, assignee, epic), «Expedite» գոտի urgent աշխատանքի համար։</p>
      <p><b>Ֆիզիկական board</b> (գրատախտակ և sticky notes) դեռ օգտագործվում է՝ հատկապես նոր թիմերի համար. այն ավելի տեսանելի է և խթանում է զրույցը։</p>`},
    {t:"Confluence, Asana, Trello, Miro", h:"1.5 ժ", b:`<ul><li><b>Confluence</b>՝ թիմային wiki։ Template-ներ՝ Project plan, Meeting notes, Retrospective, Requirements (PRD), Decision log, How-to։ Jira issue-ները կարելի է ներդնել էջում։ Լավ կառուցվածք՝ Overview → Requirements & Decisions → Meeting notes → Status reports → Risks → Lessons learned</li>
      <li><b>Asana</b>՝ List, Board, Timeline (Gantt՝ կախվածություններով), Calendar, Portfolios, Goals։ Օգտագործվում է Google PM Certificate-ում, հարմար է ոչ-IT թիմերի համար</li>
      <li><b>Trello</b>՝ ամենապարզ Kanban board-ը (Board → List → Card), Power-Up-եր, Butler automation</li>
      <li><b>Miro</b>՝ վիրտուալ գրատախտակ՝ brainstorming, retrospective, user story mapping, WBS, Fishbone, PI Planning board։ Նման է FigJam-ին</li></ul>
      <div class="tbl"><table><tr><th>Իրավիճակ</th><th>Գործիքներ</th></tr><tr><td>IT թիմ, Scrum</td><td>Jira + Confluence + Slack/Teams + Miro</td></tr><tr><td>Մարկետինգ, ոչ-IT</td><td>Asana, Trello, Monday</td></tr><tr><td>Շինարարություն, ինժեներիա</td><td>MS Project, Primavera P6</td></tr><tr><td>Փոքր startup</td><td>Linear, Notion, ClickUp</td></tr></table></div>`},
    {t:"User Story և Acceptance Criteria", h:"2 ժ", b:`<div class="formula">As a [դեր], I want [գործառույթ], so that [օգուտ]

Օրինակ:
As a հաճախորդ, I want պատվիրել սուրճը հավելվածով,
so that չսպասեմ հերթում։</div>
      <p><b>3C</b>՝ Card (կարճ նկարագրություն), Conversation (քննարկում), Confirmation (acceptance criteria)։ <b>INVEST</b>՝ Independent, Negotiable, Valuable, Estimable, Small, Testable։</p>
      <p><b>Acceptance Criteria</b>-ի երկու ձևաչափ.</p>
      <div class="formula">Scenario (Gherkin / BDD):
Given  ես մուտք եմ գործել և զամբյուղում կա 1 սուրճ
When   սեղմում եմ «Վճարել» և քարտը վավեր է
Then   տեսնում եմ պատվերի համարը և մոտավոր ժամը

Rule-based (checklist):
- Նվազագույն պատվերը 500 դրամ է
- Քարտի սխալի դեպքում ցույց է տրվում հասկանալի հաղորդագրություն</div>
      <p><b>Story splitting</b> (SPIDR)՝ <b>S</b>pike, <b>P</b>aths (happy/unhappy path), <b>I</b>nterfaces (web/mobile), <b>D</b>ata (տվյալների տեսակներ), <b>R</b>ules (բիզնես կանոններ)։ Մի՛ բաժանիր ըստ տեխնիկական շերտերի (frontend / backend), բաժանիր ըստ օգտատիրոջ արժեքի (vertical slicing)։</p>`},
    {t:"Definition of Done և Definition of Ready", h:"1 ժ", b:`<div class="cols"><div class="box"><b>Definition of Ready (DoR)</b><p class="small muted">Երբ story-ն պատրաստ է sprint-ի համար (Scrum Guide-ի մաս չէ, բայց տարածված պրակտիկա)</p><ul><li>Գրված է user story ձևաչափով</li><li>Ունի acceptance criteria</li><li>Գնահատված է, ≤ 8 point</li><li>Դիզայնը (Figma) կցված է</li><li>Կախվածությունները պարզ են</li><li>PO-ն և թիմը հասկանում են այն</li></ul></div>
      <div class="box"><b>Definition of Done (DoD)</b><p class="small muted">Increment-ի որակի պաշտոնական չափանիշ (Scrum Guide)</p><ul><li>Կոդը review է արված և merge է արված</li><li>Unit թեստերի ծածկույթը ≥ 80%</li><li>QA-ն ստուգել է acceptance criteria-ները</li><li>Չկան բաց Critical/Major bug-եր</li><li>Փաստաթղթավորումը թարմացված է</li><li>Տեղադրված է staging միջավայրում</li><li>PO-ն ընդունել է</li></ul></div></div>
      <p>DoD-ը վերաբերում է <b>բոլոր</b> story-ներին, acceptance criteria-ն՝ <b>կոնկրետ</b> story-ին։ DoR-ը չպետք է դառնա «waterfall gate». եթե այն շատ խիստ է, աշխատանքը կանգնում է։</p>`},
    {t:"Նախագծերի կառավարում agile գործիքներով", h:"1.5 ժ", b:`<ul><li><b>User Story Mapping</b> (Jeff Patton)՝ հորիզոնական՝ օգտատիրոջ ճանապարհը (activities), ուղղահայաց՝ story-ներ ըստ առաջնահերթության։ Առաջին հորիզոնական «շերտը» MVP-ն է</li>
      <li><b>Roadmap</b>՝ Now / Next / Later ձևաչափ (ավելի ազնիվ է, քան ամսաթվերով Gantt-ը agile-ում), կամ timeline Jira-ում</li>
      <li><b>Release planning</b>՝ Fix Version-ներ Jira-ում, release notes</li>

      <li><b>Status reporting</b>՝ Jira dashboard + Confluence էջ (RAG կարգավիճակ, Sprint Goal, ռիսկեր, հաջորդ քայլեր)</li>
      <li><b>Hybrid</b>՝ milestone-ները և պայմանագիրը MS Project-ում կամ Excel-ում, իսկ առօրյա աշխատանքը Jira-ում</li></ul>`}

{ n:6, aca:"ACA մոդուլ 6", title:"Product, QA, UX և գործընթացներ", short:"Product & QA",
  goal:"Հասկանալ product management-ը, SDLC-ն, QA-ն, UI/UX-ը, IT ընկերության դերերն ու տեխնոլոգիաները, ինչպես նաև կառավարել ռիսկն ու որակը։",
  lessons:[
    {t:"Product Management vs Project Management", h:"1.5 ժ", b:`<div class="tbl"><table><tr><th></th><th>Project Manager</th><th>Product Manager</th><th>Product Owner</th></tr>
      <tr><td>Հարց</td><td>Ինչպե՞ս և երբ</td><td>Ինչ և ինչու</td><td>Ինչ է հաջորդը backlog-ում</td></tr>
      <tr><td>Ժամանակ</td><td>Սահմանափակ, ունի ավարտ</td><td>Անընդհատ, product-ի ամբողջ կյանքը</td><td>Sprint-ից sprint</td></tr>
      <tr><td>Հաջողություն</td><td>Output՝ ժամանակին, բյուջեով</td><td>Outcome՝ օգտատերեր, եկամուտ, retention</td><td>Արժեքի առավելագույնացում</td></tr>
      <tr><td>Գործիքներ</td><td>Ժամանակացույց, ռիսկեր, բյուջե</td><td>Discovery, roadmap, analytics</td><td>Backlog, user stories</td></tr></table></div>
      <p><b>Output vs Outcome.</b> Output՝ «գործարկեցինք 10 feature», Outcome՝ «պատվերների քանակը աճեց 20%»։ Ժամանակակից կազմակերպությունները չափում են outcome-ը։</p>
      <p><b>Product Discovery</b>՝ ստուգել գաղափարը նախքան կառուցելը. հարցազրույցներ, prototype, A/B test։ Չորս ռիսկ (Marty Cagan)՝ value, usability, feasibility, business viability։ <b>MVP</b>՝ նվազագույն արտադրանք՝ ենթադրությունները ստուգելու համար։ <b>Product lifecycle</b>՝ Introduction → Growth → Maturity → Decline։</p>`},
    {t:"Software Development Life Cycle (SDLC)", h:"2 ժ", b:`<p><b>SDLC փուլեր.</b> Planning → Requirements analysis → Design (architecture, UI/UX) → Development → Testing → Deployment → Maintenance։</p>
      <p><b>Մոդելներ.</b> Waterfall, V-model (յուրաքանչյուր մշակման փուլ ունի համապատասխան թեստավորման փուլ), Iterative, Spiral (ռիսկի վրա հիմնված), Agile, DevOps։</p>
      <p><b>DevOps և CI/CD.</b></p><div class="formula">Code → Commit (Git) → Build → Automated tests → Deploy to staging → Approve → Deploy to production → Monitor
CI  = Continuous Integration (ամեն commit-ը ավտոմատ build և test)
CD  = Continuous Delivery (միշտ պատրաստ release-ի) / Deployment (ավտոմատ production)</div>
      <p><b>Միջավայրեր.</b> Local/Dev → Test/QA → Staging (production-ի պատճեն) → Production։</p>
      <p><b>Git հիմունքներ PM-ի համար.</b> repository, branch (feature branch), commit, pull request (PR), code review, merge, release tag։ Jira-ն կապվում է Git-ին. issue key-ը (APP-123) branch-ի կամ commit-ի անվան մեջ ցույց է տալիս կոդը issue-ի մեջ։</p>
      <p><b>Release management.</b> Versioning (1.4.2 = major.minor.patch), release notes, feature flags (feature-ը միացնել առանց նոր deploy-ի), rollback պլան, hotfix։</p>`},
    {t:"QA հիմունքներ", h:"2 ժ", b:`<p><b>QA vs QC vs Testing.</b> QA՝ գործընթացի ապահովում (կանխարգելում), QC՝ արդյունքի ստուգում, Testing՝ QC-ի գործողություն։</p>
      <ul><li><b>Թեստավորման մակարդակներ.</b> Unit → Integration → System → Acceptance (UAT)</li><li><b>Տեսակներ.</b> Functional, Regression (հին գործառույթները չե՞ն կոտրվել), Smoke (հիմնականը աշխատու՞մ է build-ից հետո), Sanity, Performance/Load, Security, Usability, Compatibility (բրաուզերներ, սարքեր)</li><li><b>Manual vs Automation.</b> Automation՝ regression-ի և կրկնվող թեստերի համար (Selenium, Cypress, Playwright, Appium)</li><li><b>Test pyramid.</b> Շատ unit թեստեր, ավելի քիչ integration, ամենաքիչը UI/E2E թեստեր</li></ul>
      <p><b>Bug life cycle.</b> <span class="mono">New → Assigned → In Progress → Fixed → Retest → Closed</span> (կամ Reopened / Rejected / Duplicate / Deferred)։</p>
      <div class="tbl"><table><tr><th></th><th>Severity</th><th>Priority</th></tr><tr><td>Ինչ է</td><td>Տեխնիկական ազդեցություն</td><td>Ուղղման հրատապություն</td></tr><tr><td>Ով է որոշում</td><td>QA</td><td>PO / PM</td></tr><tr><td>Օրինակ</td><td colspan="2">Ընկերության անվան սխալ գլխավոր էջում՝ Low severity, High priority։ Հազվադեպ օգտագործվող admin հաշվետվության crash՝ High severity, կարող է լինել Low priority</td></tr></table></div>
      <p><b>Լավ bug report.</b> Վերնագիր, միջավայր (բրաուզեր, սարք, build), վերարտադրման քայլեր, սպասվող արդյունք, փաստացի արդյունք, screenshot/video, severity։</p>`},
    {t:"UI/UX-ի հիմունքներ", h:"1.5 ժ", b:`<p><b>UX</b> (User Experience)՝ ինչպես է օգտատերը զգում և լուծում իր խնդիրը։ <b>UI</b> (User Interface)՝ տեսքը՝ գույներ, տառատեսակներ, կոճակներ։</p>
      <p><b>Դիզայնի գործընթաց.</b> Research (հարցազրույցներ, analytics) → Personas → User journey map → Information architecture → Wireframe (կմախք) → Mockup → Prototype (Figma) → Usability testing → Handoff ծրագրավորողներին։</p>
      <p><b>Nielsen-ի 10 heuristics-ից մի քանիսը.</b> Համակարգի կարգավիճակի տեսանելիություն, համապատասխանություն իրական աշխարհին, օգտատիրոջ վերահսկողություն (undo), հետևողականություն և ստանդարտներ, սխալների կանխարգելում, ճանաչում՝ հիշելու փոխարեն, մինիմալիստական դիզայն, հասկանալի սխալի հաղորդագրություններ։</p>
      <p><b>Accessibility (WCAG)՝</b> կոնտրաստ, ստեղնաշարով աշխատանք, alt տեքստ նկարների համար, screen reader-ների աջակցություն։</p>
      <p><b>PM-ի դերը.</b> Ապահովել, որ դիզայնը պատրաստ լինի sprint-ից 1 sprint առաջ (dual-track agile), usability testing-ը պլանավորված լինի, Figma-ի հղումը կցված լինի story-ին, և դիզայները մասնակցի refinement-ին։</p>`},
    {t:"Դերերը IT ընկերությունում և հիմնական տեխնոլոգիաները", h:"1.5 ժ", b:`<div class="tbl"><table><tr><th>Դեր</th><th>Ինչ է անում</th></tr>
      <tr><td>Business Analyst (BA)</td><td>Պահանջների հավաքում և փաստաթղթավորում</td></tr><tr><td>Product Manager / PO</td><td>Product-ի ուղղություն և backlog</td></tr><tr><td>Project / Delivery Manager</td><td>Առաքում, ժամկետ, ռիսկեր, շահակիցներ</td></tr><tr><td>Scrum Master / Agile Coach</td><td>Գործընթաց, coaching</td></tr><tr><td>Tech Lead / Architect</td><td>Տեխնիկական որոշումներ, ճարտարապետություն</td></tr><tr><td>Frontend / Backend / Mobile Developer</td><td>Ինտերֆեյս / սերվեր / մոբայլ հավելվածներ</td></tr><tr><td>QA (Manual / Automation)</td><td>Թեստավորում</td></tr><tr><td>DevOps / SRE</td><td>Infrastructure, CI/CD, հուսալիություն</td></tr><tr><td>UI/UX Designer</td><td>Դիզայն և օգտատիրոջ փորձ</td></tr><tr><td>Data Engineer / Analyst / Scientist</td><td>Տվյալներ, analytics, ML</td></tr><tr><td>Security Engineer</td><td>Անվտանգություն</td></tr></table></div>

    {t:"Ռիսկերի և որակի կառավարում", h:"2 ժ", b:`<p>Ռիսկը անորոշ իրադարձություն է՝ <b>threat</b> կամ <b>opportunity</b>։ Issue-ն արդեն տեղի ունեցած խնդիր է։ Ձևակերպում՝ <i>«Քանի որ [պատճառ], կարող է [իրադարձություն], ինչը կհանգեցնի [ազդեցություն]»</i>։</p>

{ n:7, aca:"ACA մոդուլ 7", title:"Կազմակերպական և մասնագիտական աճ", short:"Growth",
  goal:"Հասկանալ կազմակերպության մակրո գործընթացները և OKR-ները, ընտրել սերտիֆիկատը, զարգացնել հաղորդակցության հմտությունները և պատրաստվել հարցազրույցին։",
  lessons:[
    {t:"Մակրո գործընթացներ և OKR", h:"2 ժ", b:`<div class="formula">Vision / Mission → Strategy → OKR (company) → Portfolio → Programs → Projects / Products → Team backlogs → Sprint</div>
      <p><b>OKR</b> (Objectives and Key Results)՝ Intel-ում ստեղծված, Google-ում տարածված մեթոդ։</p>
      <ul><li><b>Objective</b>՝ որակական, ոգեշնչող նպատակ</li><li><b>Key Results</b>՝ 2–5 չափելի արդյունք (outcome, ոչ task)</li><li>Ցիկլ՝ սովորաբար եռամսյակ</li><li>Google-ի մոտեցում՝ <b>committed</b> OKR-ները պետք է հասնեն 100%-ի, <b>aspirational</b>-ները՝ գնահատվում են 0.0–1.0, և 0.6–0.7-ը համարվում է լավ արդյունք</li></ul>
      <div class="formula">O:  Դառնալ քաղաքի ամենահարմար սուրճ պատվիրելու ծառայությունը
KR1: Հավելվածի ակտիվ օգտատերերը 0 → 5 000
KR2: Պատվերի միջին ժամանակը 4 րոպե → 90 վայրկյան
KR3: App Store վարկանիշ ≥ 4.6</div>
      <p><b>OKR vs KPI.</b> KPI-ն չափում է «առողջությունը» (անընդհատ), OKR-ը՝ փոփոխությունը (ամբիցիոզ նպատակ)։ Այլ մակրո գործընթացներ՝ տարեկան բյուջետավորում, quarterly planning / PI Planning, governance (steering committee), organizational change management (Kotter-ի 8 քայլ, ADKAR՝ Awareness, Desire, Knowledge, Ability, Reinforcement)։</p>`},
    {t:"Հաղորդակցություն, կոնֆլիկտներ, շահակիցներ", h:"1.5 ժ", b:`<div class="formula">Հաղորդակցման ալիքներ = n(n − 1) / 2</div>
      <ul><li>Մեթոդներ՝ push (email, report), pull (wiki, dashboard), interactive (հանդիպում)</li><li>Communication plan՝ ինչ, ում, երբ, ինչ ձևաչափով, ով</li><li>Status report՝ RAG, ամփոփում, ռիսկեր, որոշումներ, հաջորդ քայլեր</li><li>Ղեկավարության համար՝ «bottom line up front». սկզբում եզրակացությունը, հետո մանրամասները</li></ul>
      <p><b>Կոնֆլիկտի 5 ռեժիմ (Thomas-Kilmann).</b> Collaborate (win-win, սովորաբար լավագույնը), Compromise, Accommodate, Force (արտակարգ դեպքում), Avoid (ժամանակավոր)։ Առաջին քայլը՝ անձնական, առանձին զրույց։</p>
      <p><b>Մոտիվացիա.</b> Herzberg (hygiene factors vs motivators), Daniel Pink (Autonomy, Mastery, Purpose), psychological safety (Google-ի Project Aristotle)։ Բանակցություններ՝ BATNA, interest-based negotiation։</p>`},
    {t:"PMI-ի agile պրակտիկաներ և արդյունաբերական ստանդարտներ", h:"1.5 ժ", b:`<ul><li><b>PMBOK® Guide 8</b>՝ PMI-ի հիմնական ստանդարտ</li><li><b>Agile Practice Guide</b>՝ PMI-ի և Agile Alliance-ի համատեղ ուղեցույց՝ agile և hybrid մոտեցումների համար</li><li><b>Disciplined Agile (DA)</b>՝ PMI-ի toolkit, որն օգնում է ընտրել ճիշտ «way of working» ըստ կոնտեքստի</li><li><b>PMI-ACP</b>-ի բովանդակային ոլորտներ՝ Mindset 28%, Leadership 25%, Product 19%, Delivery 28%</li><li><b>PRINCE2</b>՝ բրիտանական գործընթացային մեթոդ (Business justification, manage by stages, manage by exception), տարածված Եվրոպայում և պետական հատվածում։ Կա PRINCE2 Agile</li><li><b>IPMA ICB4</b>՝ կոմպետենցիաների ստանդարտ (Եվրոպա)</li><li><b>ISO 21502</b>՝ նախագծերի կառավարման միջազգային ստանդարտ</li><li><b>SAFe, LeSS, Nexus</b>՝ agile-ի մասշտաբավորման framework-ներ</li></ul>`},
    {t:"IT PM սերտիֆիկատների տեսակներ", h:"1.5 ժ", b:`<div class="tbl"><table><tr><th>Սերտիֆիկատ</th><th>Կազմակերպություն</th><th>Ում համար</th><th>Հիմնական պահանջ</th></tr>
      <tr><td>CAPM®</td><td>PMI</td><td>Սկսնակ</td><td>23 ժամ PM կրթություն</td></tr>
      <tr><td>PMP®</td><td>PMI</td><td>Փորձառու PM</td><td>36 ամիս PM փորձ (բակալավրով) + 35 ժամ կրթություն</td></tr>
      <tr><td>PMI-ACP®</td><td>PMI</td><td>Agile պրակտիկ</td><td>2 տարի agile փորձ վերջին 5 տարում (կամ ակտիվ PMP) + agile ուսուցում. 120 հարց, 180 րոպե</td></tr>
      <tr><td>PSM I / PSPO I</td><td>Scrum.org</td><td>Scrum Master / PO</td><td>Պահանջ չկա. 80 հարց, 60 րոպե, 85%</td></tr>
      <tr><td>CSM / CSPO</td><td>Scrum Alliance</td><td>Scrum Master / PO</td><td>Պարտադիր 2-օրյա դասընթաց</td></tr>
      <tr><td>SAFe (SA, SSM, POPM)</td><td>Scaled Agile</td><td>Մեծ կազմակերպություններ</td><td>Պարտադիր դասընթաց</td></tr>
      <tr><td>PRINCE2 Foundation / Practitioner</td><td>PeopleCert</td><td>Եվրոպա, պետական հատված</td><td>Foundation-ը առանց պահանջի</td></tr>
      <tr><td>Google PM Certificate</td><td>Google / Coursera</td><td>Սկսնակ</td><td>Պահանջ չկա</td></tr></table></div>
      <p><b>Ուղու առաջարկ սկսնակի համար.</b> PSM I (ամենաէժան և շատ ճանաչված IT-ում) → CAPM → փորձից հետո PMP կամ PMI-ACP։ Պահանջները և գները պարբերաբար փոխվում են. ստուգիր պաշտոնական կայքերում։</p>`},
    {t:"Հարցազրույցի պատրաստություն", h:"2 ժ", b:`<p><b>Տիպիկ փուլեր.</b> HR screening → Hiring manager → Case / սցենարային հարցեր → Panel կամ թիմի հետ հանդիպում → Offer։</p>
      <p><b>STAR մեթոդ</b> վարքային հարցերի համար՝ <b>S</b>ituation, <b>T</b>ask, <b>A</b>ction (ամենամեծ մասը, «ես», ոչ թե «մենք»), <b>R</b>esult (թվերով)։</p>
      <div class="cols"><div class="box"><b>Վարքային</b><ul><li>Պատմեք դեպքի մասին, երբ նախագիծը ուշանում էր</li><li>Ինչպես լուծեցիք թիմի կոնֆլիկտ</li><li>Երբ ասացիք «ոչ» շահակցին</li><li>Ձեր ամենամեծ ձախողումը և դասը</li></ul></div>
      <div class="box"><b>Սցենարային</b><ul><li>Sprint Goal-ը վտանգված է 3-րդ օրը. ինչ կանեք</li><li>Հաճախորդը պահանջում է feature առանց ժամկետի փոփոխության</li><li>Senior ծրագրավորողը դեմ է Scrum-ին</li><li>Ինչպես կգնահատեք նոր նախագիծ առանց պատմական տվյալների</li></ul></div>
      <div class="box"><b>Տեխնիկական</b><ul><li>Velocity vs capacity</li><li>DoD vs Acceptance criteria</li><li>Ինչպես կհաշվեք cycle time-ը</li><li>Ինչ է API-ն, staging-ը, regression-ը</li><li>Ինչ JQL կգրեք ուշացած առաջադրանքների համար</li></ul></div></div>
      <p><b>CV.</b> 1–2 էջ, ձեռքբերումներ թվերով («5 հոգանոց թիմով գործարկեցի MVP 10 շաբաթում»), հիմնական բառեր (Scrum, Jira, stakeholder management), պորտֆոլիոյի հղում։ Վերջում միշտ տուր քո հարցերը (թիմի կառուցվածքը, ինչպես են չափում հաջողությունը)։</p>`},
    {t:"PM կարիերայի ուղի և խորհուրդներ", h:"1 ժ", b:`<div class="formula">Project Coordinator / Junior PM
  → Project Manager
    → Senior PM / Delivery Manager
      → Program Manager / Head of Delivery
        → Portfolio Manager / PMO Director / VP of Delivery

Զուգահեռ ուղիներ:
Scrum Master → Agile Coach → Enterprise Agile Coach
PO → Product Manager → Head of Product
PM + տեխնիկական խորություն → Technical Program Manager</div>
      <p>Առաջատար ընկերություններում մակարդակները տարբերվում են <b>ազդեցության շրջանակով</b>՝ task → feature → project → բազմաթիմային program → ամբողջ կազմակերպություն, և <b>անորոշության մակարդակով</b>, որը մարդն ինքնուրույն կառավարում է։</p>
      <p><b>Խորհուրդներ.</b> Ընտրիր ոլորտ (fintech, e-commerce, gaming, health) և խորացիր, զարգացրու տեխնիկական գրագիտությունը (8-րդ շաբաթ), գրիր ամեն հանդիպումից հետո ամփոփում, մասնակցիր PM և agile համայնքներին, վերցրու կամավորական նախագիծ փորձի համար, պահիր «brag document»՝ քո ձեռքբերումների ցուցակը։</p>`}

{ n:8, aca:"ACA մոդուլ 8", title:"Advanced Jira և TFNT", short:"Jira & TFNT",
  goal:"Տիրապետել Jira-ի workflow-ներին, automation-ին, reporting-ին և մասշտաբավորմանը, հասկանալ ինտերնետը, client/server-ը, տվյալների բազաները, API-ները և արդյունավետ աշխատել ծրագրավորողների հետ։",
  lessons:[
    {t:"Jira Deep Dive՝ Workflows, JQL, Automation, Reporting", h:"2.5 ժ", b:`<p><b>Workflow-ի բաղադրիչներ (company-managed).</b> Statuses, Transitions, <b>Conditions</b> (ով կարող է կատարել transition-ը), <b>Validators</b> (ստուգում, օր.՝ Story Points-ը պարտադիր է), <b>Post functions</b> (գործողություն transition-ից հետո, օր.՝ assignee-ի փոփոխություն)։</p>
      <p><b>JQL</b> օրինակներ.</p>
      <div class="formula">project = APP AND sprint in openSprints() AND assignee = currentUser()
project = APP AND issuetype = Bug AND priority in (Highest, High)
  AND resolution = Unresolved ORDER BY created DESC
project = APP AND status changed to Done during (startOfWeek(), now())
project = APP AND due < now() AND statusCategory != Done
project = APP AND issueLinkType = "is blocked by" AND resolution = Unresolved
parent = APP-12</div>
      <p><b>Automation</b> (Trigger → Condition → Action)՝ երբ բոլոր sub-task-երը Done են, parent-ը փոխել Done-ի. երբ Highest bug է ստեղծվում, ծանուցել Slack-ին. երբ issue-ն 3 օր չի փոխվել In Progress-ում, հիշեցնել։</p>
      <div class="tbl"><table><tr><th>Հաշվետվություն</th><th>Երբ</th></tr><tr><td>Burndown</td><td>Sprint-ի ընթացքում</td></tr><tr><td>Burnup</td><td>Scope creep-ի տեսանելիություն</td></tr><tr><td>Velocity chart</td><td>Sprint Planning, կանխատեսում</td></tr><tr><td>Sprint report</td><td>Review, Retro</td></tr><tr><td>Cumulative Flow Diagram</td><td>Kanban, խցանումներ</td></tr><tr><td>Control chart</td><td>Cycle time-ի կանխատեսելիություն</td></tr></table></div>
      <p><b>Dashboard</b>՝ gadget-ներ (Filter results, Sprint burndown, Pie chart, Created vs Resolved) շահակիցների համար մեկ էկրանով։</p>`},
    {t:"Agile-ի մասշտաբավորում Jira-ով (Projects & Portfolios)", h:"1.5 ժ", b:`<p><b>Jira Plans</b> (Advanced planning, հասանելի է Jira Premium և Enterprise պլաններում)՝</p>
      <ul><li>Մի քանի նախագծի, board-ի և JQL filter-ի աշխատանքը մեկ timeline-ում</li><li>Epic-ից վերև մակարդակներ (օր.՝ <b>Initiative</b>), որոնք միավորում են մի քանի թիմի epic-ներ</li><li><b>Capacity</b>՝ ցույց է տալիս, թե որ թիմն է գերբեռնված (story points, օրեր կամ ժամեր)</li><li><b>Dependencies</b>՝ կապերը timeline-ում և առանձին դիտում</li><li><b>Scenarios</b>՝ «what if» պլաններ առանց իրական տվյալները փոխելու (sandbox, հետո Review changes)</li></ul>
      <p><b>Jira Align</b>՝ enterprise մակարդակի պորտֆելի կառավարում (հաճախ SAFe-ի հետ)։ <b>Jira Product Discovery</b>՝ գաղափարներ և product roadmap։</p>
      <p><b>SAFe-ի հիմնական հասկացություններ.</b> Agile Release Train (ART՝ 5–12 թիմ), <b>PI Planning</b> (Program Increment-ի պլանավորում՝ սովորաբար 8–12 շաբաթ, բոլոր թիմերը միասին), Program board (feature-ներ և կախվածություններ), Release Train Engineer (RTE)։ Այլընտրանքներ՝ LeSS, Nexus, Scrum of Scrums։</p>`},
    {t:"TFNT 1՝ Ինտերնետ և ցանցեր", h:"1.5 ժ", b:`<p><b>TFNT</b> (Technical Foundations for Non-Technical people)՝ տեխնիկական հիմունքներ PM-ի համար։</p>
      <div class="formula">1. Դու գրում ես URL՝ https://shop.am/products
2. DNS-ը «shop.am» անունը փոխակերպում է IP հասցեի (օր.՝ 93.184.216.34)
3. Բրաուզերը TCP/TLS կապ է հաստատում սերվերի հետ (HTTPS = HTTP + encryption)
4. Ուղարկում է HTTP request՝  GET /products
5. Սերվերը պատասխանում է HTTP response-ով (HTML, JSON)՝ status code-ով
6. Բրաուզերը ցուցադրում է էջը</div>
      <ul><li><b>URL-ի մասեր.</b> protocol (https), domain (shop.am), path (/products), query (?page=2)</li><li><b>IP հասցե, port</b> (80՝ HTTP, 443՝ HTTPS)</li><li><b>CDN</b>՝ բովանդակության պահոց օգտատիրոջն ավելի մոտ սերվերներում (արագություն)</li><li><b>Latency</b>՝ ուշացում, <b>bandwidth</b>՝ թողունակություն</li><li><b>SSL/TLS սերտիֆիկատ</b>՝ կողպեքի նշանը բրաուզերում. ժամկետանց սերտիֆիկատը հաճախակի incident-ի պատճառ է</li></ul>`},
    {t:"TFNT 2՝ Client/Server և ճարտարապետություն", h:"1.5 ժ", b:`<div class="formula">[Client: բրաուզեր / մոբայլ app]  ⇄  [API / Backend սերվեր]  ⇄  [Database]
                                        ⇅
                         [Արտաքին ծառայություններ: վճարում, SMS, քարտեզ]</div>
      <ul><li><b>Frontend</b>՝ այն, ինչ տեսնում է օգտատերը. <b>Backend</b>՝ բիզնես տրամաբանություն, տվյալներ, անվտանգություն</li><li><b>Monolith vs Microservices.</b> Monolith՝ մեկ ամբողջական հավելված (պարզ սկսելու համար)։ Microservices՝ բազմաթիվ փոքր ծառայություններ (անկախ deploy, բայց ավելի բարդ ինտեգրում)</li><li><b>Cloud մոդելներ.</b> IaaS (վիրտուալ սերվերներ, օր.՝ AWS EC2), PaaS (պլատֆորմ, օր.՝ Heroku), SaaS (պատրաստի ծրագիր, օր.՝ Jira Cloud)</li><li><b>Scalability</b>՝ vertical (ավելի հզոր սերվեր) vs horizontal (ավելի շատ սերվերներ)</li><li><b>Cache</b>՝ հաճախ օգտագործվող տվյալների արագ պահոց (Redis)</li><li><b>Non-functional requirements (NFR)</b>՝ performance, security, availability (օր.՝ 99.9% uptime), scalability։ PM-ը պետք է դրանք ներառի պահանջներում</li></ul>`},
    {t:"TFNT 3՝ Տվյալների բազաներ", h:"1.5 ժ", b:`<p><b>Relational (SQL)</b>՝ տվյալները աղյուսակներում (PostgreSQL, MySQL)։ <b>NoSQL</b>՝ document (MongoDB), key-value (Redis) և այլն՝ ճկուն կառուցվածքի համար։</p>
      <ul><li><b>Table, row, column</b></li><li><b>Primary key</b>՝ տողի եզակի նույնացուցիչ (id)</li><li><b>Foreign key</b>՝ կապ մեկ այլ աղյուսակի հետ (orders.customer_id → customers.id)</li><li><b>Migration</b>՝ բազայի կառուցվածքի փոփոխություն (ռիսկային է release-ի ժամանակ)</li><li><b>Backup</b> և <b>restore</b></li></ul>
      <p>SQL-ի հիմունքները օգտակար են PM-ին՝ տվյալները ինքնուրույն ստուգելու համար.</p>
      <div class="formula">-- Վերջին 7 օրվա պատվերները
SELECT id, total, created_at FROM orders
WHERE created_at >= CURRENT_DATE - 7;

-- Պատվերների քանակը և գումարը ըստ քաղաքի
SELECT c.city, COUNT(*) AS orders, SUM(o.total) AS revenue
FROM orders o JOIN customers c ON o.customer_id = c.id
GROUP BY c.city ORDER BY revenue DESC;</div>`},
    {t:"TFNT 4՝ API-ներ", h:"1.5 ժ", b:`<p><b>API</b> (Application Programming Interface)՝ ծրագրերի միջև «պայմանագիր». ինչպես է մի համակարգը խնդրում տվյալ կամ գործողություն մյուսից։ Անալոգիա՝ մատուցողը ռեստորանում (դու՝ client, խոհանոցը՝ server)։</p>
      <div class="tbl"><table><tr><th>HTTP մեթոդ</th><th>Գործողություն</th><th>Օրինակ</th></tr><tr><td>GET</td><td>Կարդալ</td><td>GET /orders/42</td></tr><tr><td>POST</td><td>Ստեղծել</td><td>POST /orders</td></tr><tr><td>PUT / PATCH</td><td>Թարմացնել (ամբողջը / մասը)</td><td>PATCH /orders/42</td></tr><tr><td>DELETE</td><td>Ջնջել</td><td>DELETE /orders/42</td></tr></table></div>
      <div class="formula">200 OK            201 Created         204 No Content
400 Bad Request   401 Unauthorized (մուտք չի գործել)
403 Forbidden (մուտք է գործել, բայց իրավունք չունի)
404 Not Found     429 Too Many Requests
500 Internal Server Error   503 Service Unavailable

Response (JSON):

      <ul><li><b>REST</b>՝ ամենատարածված ոճը. <b>GraphQL</b>՝ client-ը ընտրում է, թե ինչ տվյալներ ստանալ</li><li><b>API documentation</b>՝ Swagger / OpenAPI. <b>Postman</b>՝ API-ները ստուգելու գործիք</li><li><b>Webhook</b>՝ սերվերը ինքն է ուղարկում ծանուցում իրադարձության դեպքում (օր.՝ վճարումն ավարտվեց)</li><li><b>Authentication</b>՝ API key, OAuth, token</li><li><b>Rate limit</b>, <b>versioning</b> (/v1/, /v2/)</li><li>Երրորդ կողմի ինտեգրացիաները (վճարային համակարգեր, SMS) հաճախ ամենամեծ ռիսկն են ժամանակացույցում</li></ul>`},
    {t:"Աշխատանք ծրագրավորողների հետ և տեխնիկական որոշումներ", h:"2 ժ", b:`<ul><li><b>Technical debt</b>՝ արագության համար ընտրված «կարճ ճանապարհ», որի «տոկոսները» վճարվում են հետո (դանդաղ մշակում, bug-եր)։ Պրակտիկա՝ յուրաքանչյուր sprint-ում capacity-ի մի մասը (հաճախ 10–20%) տրամադրել tech debt-ին և այն պահել backlog-ում տեսանելի</li><li><b>Spike</b>՝ timebox-ված հետազոտություն անորոշությունը նվազեցնելու համար</li><li><b>Design doc / RFC</b>՝ լուծման նկարագրություն մինչև մշակումը, թիմի review-ով. <b>ADR</b> (Architecture Decision Record)՝ կարճ գրառում՝ որոշում, կոնտեքստ, այլընտրանքներ, հետևանքներ</li><li><b>Build vs Buy</b>՝ մշակել ներսում, թե գնել/ինտեգրել պատրաստի լուծում</li><li><b>Incident management</b>՝ severity մակարդակներ (SEV1–SEV4), incident commander, հաղորդակցություն, հետո <b>blameless postmortem</b>՝ ինչ եղավ, ինչու, ինչ փոխել, առանց մեղավոր փնտրելու</li></ul>

  {t:"Atlassian Team Playbook", h:"1 ժ", b:`<p>Atlassian-ը հրապարակել է անվճար «plays»՝ workshop-ներ թիմերի համար.</p>

    <li><b>Roles and Responsibilities</b>՝ թիմի դերերի և սպասումների համաձայնեցում</li>
    <li><b>Health Monitor</b>՝ թիմի առողջության պարբերական գնահատում ըստ կատեգորիաների</li>
    <li><b>Goals, Signals, Measures</b>՝ նպատակից դեպի չափելի ցուցանիշներ</li>

    <p>Atlassian-ը ակտիվ օգտագործում է <b>async</b> աշխատանք՝ Confluence էջեր և Loom վիդեոներ, ավելորդ հանդիպումների փոխարեն։</p>`},
  {t:"Basecamp՝ Shape Up", h:"1 ժ", b:`<p>Ryan Singer-ի «Shape Up» գիրքը (անվճար basecamp.com/shapeup) նկարագրում է Scrum-ի այլընտրանք.</p>
    <ul><li><b>6-շաբաթյա ցիկլեր</b> և <b>2-շաբաթյա cool-down</b> (bug-եր, մաքրում, հետազոտություն)</li>

  goal:"Հասկանալ Product Manager-ի դերը, discovery-ն, ռազմավարությունը, առաքումը և կարիերայի ուղին։",
  lessons:[
    {t:"Product Discovery՝ Outcomes, Ideation, MVP", h:"1.5 ժ", b:`<p><b>Product Manager</b>-ը պատասխանատու է <b>ինչ</b> և <b>ինչու</b> կառուցել։ Հաջողությունը չափվում է <b>outcome</b>-ով (փոփոխություն օգտատիրոջ վարքում և բիզնեսում), ոչ թե <b>output</b>-ով (գործարկված feature-ներ)։</p>
      <p><b>Discovery</b>՝ ստուգել գաղափարը նախքան կառուցելը։ Marty Cagan-ի 4 ռիսկ.</p><ul><li><b>Value</b>՝ օգտատերը կգնի կամ կօգտագործի՞</li><li><b>Usability</b>՝ կհասկանա՞, ինչպես օգտագործել</li><li><b>Feasibility</b>՝ կարո՞ղ ենք կառուցել</li><li><b>Viability</b>՝ աշխատու՞մ է բիզնեսի համար (իրավական, ֆինանսական)</li></ul>
      <p><b>Opportunity Solution Tree</b> (Teresa Torres)՝ Outcome → Opportunities (օգտատիրոջ կարիքներ) → Solutions → Experiments։ Ideation-ի տեխնիկաներ՝ How Might We հարցեր, Crazy 8s, brainstorming առանց քննադատության։</p>
      <p><b>MVP</b> (Minimum Viable Product)՝ ամենափոքր արտադրանքը, որը թույլ է տալիս սովորել։ Տեսակներ՝ landing page (fake door), concierge (ձեռքով մատուցում), Wizard of Oz (ավտոմատ է թվում, բայց ձեռքով է), prototype։</p>`},
    {t:"Strategy՝ OKR, framework-ներ, առաջնահերթություն, Roadmap", h:"2 ժ", b:`<p><b>Vision → Strategy → OKR → Roadmap → Backlog</b>։ <b>North Star Metric</b>՝ մեկ ցուցանիշ, որ արտացոլում է օգտատիրոջ ստացած արժեքը (օր.՝ Airbnb-ի համար ամրագրված գիշերներ)։</p>
      <p><b>Ռազմավարական framework-ներ.</b> SWOT, Porter-ի 5 ուժ, Jobs To Be Done, Business Model Canvas / Lean Canvas, Blue Ocean։</p>
      <div class="formula">RICE = (Reach × Impact × Confidence) / Effort
  Reach՝ քանի օգտատեր եռամսյակում
  Impact՝ 3 = massive, 2 = high, 1 = medium, 0.5 = low, 0.25 = minimal
  Confidence՝ 100% / 80% / 50%
  Effort՝ person-month
ICE = Impact × Confidence × Ease (1–10 սանդղակ)</div>
      <p>Այլ մեթոդներ՝ <b>MoSCoW</b>, <b>Kano</b> (basic, performance, delighters), Value vs Effort մատրից, Opportunity scoring։</p>
      <p><b>Roadmap.</b> Outcome-based roadmap՝ Now / Next / Later, կապված OKR-ներին։ Feature-ների ցանկը ամսաթվերով հաճախ վնասակար է, քանի որ ստեղծում է կեղծ վստահություն։</p>`},
    {t:"Delivery՝ աշխատանք դիզայներների, ծրագրավորողների և շահակիցների հետ", h:"1.5 ժ", b:`<ul><li><b>Product trio</b>՝ PM + Designer + Tech Lead միասին են անում discovery-ն</li><li><b>PRD</b> (Product Requirements Document)՝ խնդիր, նպատակներ և metrics, օգտատերեր, user stories, scope և non-goals, դիզայնի հղումներ, բաց հարցեր, release պլան</li><li><b>Dual-track agile</b>՝ discovery-ն մեկ sprint առաջ է delivery-ից</li><li>Ծրագրավորողների հետ՝ տուր «ինչու»-ն և կոնտեքստը, ներգրավիր նրանց վաղ, հարգիր գնահատականները, լսիր tech debt-ի մասին</li><li>Դիզայներների հետ՝ ընդհանուր research, critique, design system</li><li>Շահակիցներ (sales, marketing, support, legal, ղեկավարություն)՝ պարբերական roadmap review, «no»-ն ասել տվյալներով և trade-off-ներով</li><li><b>Go-to-market</b>՝ launch պլան marketing-ի, sales-ի և support-ի հետ</li></ul>`},
    {t:"Career՝ հմտություններ, առաջնորդություն, հարցազրույց", h:"1.5 ժ", b:`<div class="formula">APM / Junior PM → Product Manager → Senior PM → Group PM / Lead
  → Director of Product → VP of Product → CPO</div>
      <p><b>Հմտություններ.</b> Product sense, analytics, communication, strategic thinking, տեխնիկական գրագիտություն, UX զգացողություն, influence without authority։</p>
      <p><b>PM հարցազրույցի տեսակներ.</b></p><ul><li><b>Product sense / design</b>՝ «Նախագծիր app տարեցների համար» (CIRCLES framework)</li><li><b>Analytical / metrics</b>՝ «DAU-ն ընկել է 10%-ով. ինչու»</li><li><b>Estimation</b>՝ «Քանի՞ սրճարան կա Երևանում»</li><li><b>Execution</b>՝ trade-off-ներ, առաջնահերթություն</li><li><b>Behavioral</b>՝ STAR</li><li><b>Technical</b>՝ API, ճարտարապետություն (B2B, platform PM)</li></ul>
      <p><b>CIRCLES.</b> Comprehend the situation, Identify the customer, Report needs, Cut through prioritization, List solutions, Evaluate trade-offs, Summarize։</p>`}
  ],
  practice:{t:"Product teardown և Opportunity Solution Tree", steps:["Ընտրիր հայկական կամ միջազգային app (օր.՝ Yandex Go, Menu.am, Telegram, Duolingo) և գրիր teardown՝ ում համար է, ինչ job է լուծում, ինչպես է գումար վաստակում, 3 ուժեղ և 3 թույլ կողմ","Ընտրիր քո capstone product գաղափարը և ձևակերպիր outcome-ը","Կառուցիր Opportunity Solution Tree՝ 3 opportunity, յուրաքանչյուրին 2 լուծում","Ընտրիր MVP-ի տեսակը և նկարագրիր փորձարկումը","Գնահատիր 6 feature-ներ RICE-ով"], deliverable:"Teardown, OST, MVP պլան, RICE աղյուսակ", tools:["rice"]},

{ n:2, aca:"ACA մոդուլ 2", title:"Product-Led Growth", short:"Growth",
  goal:"Հասկանալ աճի ալիքները, սովորությունների ձևավորումը, մոնետիզացիան և աճի փորձարկումները։",
  lessons:[
    {t:"Growth՝ ալիքներ, ներգրավվածություն, Habit Loops", h:"1.5 ժ", b:`<p><b>Product-Led Growth (PLG)</b>՝ արտադրանքն ինքն է ներգրավում, ակտիվացնում և պահում օգտատերերին (օր.՝ Slack, Figma, Notion, Canva)։ Հակառակը՝ sales-led growth։</p>
      <p><b>Ձեռքբերման ալիքներ.</b> SEO, content, paid ads, referral, viral loops, partnerships, app store optimization, sales։ Յուրաքանչյուր ընկերություն սովորաբար ունի 1–2 հիմնական ալիք։</p>
      <p><b>Hook Model</b> (Nir Eyal).</p><div class="formula">Trigger (արտաքին՝ push, ներքին՝ ձանձրույթ, անորոշություն)
  → Action (պարզ գործողություն)
    → Variable Reward (անկանխատեսելի պարգև)
      → Investment (օգտատերը ներդնում է տվյալ, ժամանակ, կապեր)
        → հաջորդ Trigger</div>
      <p><b>Growth loops vs funnels.</b> Funnel-ը գծային է, loop-ը՝ ինքնաուժեղացող (նոր օգտատերը ստեղծում է բովանդակություն → բովանդակությունը SEO-ով բերում է նոր օգտատերեր)։</p>`},
    {t:"Մոնետիզացիա և օգտատիրոջ հոգեբանություն", h:"1.5 ժ", b:`<div class="tbl"><table><tr><th>Մոդել</th><th>Օրինակ</th></tr><tr><td>Freemium</td><td>Spotify, Notion</td></tr><tr><td>Subscription</td><td>Netflix</td></tr><tr><td>Usage-based</td><td>AWS, Twilio, AI API-ներ</td></tr><tr><td>Tiered / per seat</td><td>Jira, Slack</td></tr><tr><td>Transaction fee / commission</td><td>Wolt, Airbnb</td></tr><tr><td>Ads</td><td>YouTube, Facebook</td></tr><tr><td>In-app purchases</td><td>Խաղեր</td></tr></table></div>
      <p><b>Վարքագծային էֆեկտներ.</b> Anchoring (առաջին տեսած գինը), Decoy effect (երրորդ տարբերակը միջինն է դարձնում գրավիչ), Loss aversion (կորուստը ավելի ցավոտ է, քան նույն չափի շահը), Social proof, Scarcity, Default effect, Endowment effect (free trial)։</p>
      <p><b>Էթիկա.</b> Խուսափիր <b>dark patterns</b>-ից (թաքնված չեղարկում, կեղծ ժամաչափեր). դրանք քանդում են վստահությունը և կարող են խախտել սպառողների պաշտպանության օրենքները։</p>`},
    {t:"Աճի մոդելներ և փորձարկումներ", h:"1.5 ժ", b:`<p><b>AARRR (Pirate metrics).</b> Acquisition → Activation → Retention → Referral → Revenue։</p>
      <p><b>Աճի փորձարկման ցիկլ.</b></p><div class="formula">Hypothesis: «Եթե [փոփոխություն], ապա [metric] կաճի X%-ով, քանի որ [պատճառ]»
→ Prioritize (ICE) → Design (A/B, sample size) → Run → Analyze → Learn → Iterate</div>
      <ul><li><b>A/B test</b>՝ օգտատերերը պատահականորեն բաժանվում են control և variant խմբերի</li><li>Նախապես սահմանիր հիմնական metric-ը, guardrail metrics-ը (որոնք չպետք է վատանան) և ընտրանքի չափը</li><li>Մի՛ դադարեցրու թեստը վաղ, երբ արդյունքը «լավ է թվում» (peeking problem)</li><li>Statistical significance (սովորաբար p &lt; 0.05)</li></ul>`},
    {t:"Metrics-ի հետևում և օպտիմալացում", h:"1 ժ", b:`<ul><li><b>Funnel analysis</b>՝ որ քայլում են օգտատերերը դուրս գալիս</li><li><b>Activation rate</b>՝ «aha moment»-ին հասած նոր օգտատերերի %-ը (օր.՝ Slack-ում թիմը ուղարկում է 2000 հաղորդագրություն)</li><li><b>Viral coefficient (K)</b> = հրավերներ մեկ օգտատիրոջից × հրավերի conversion. K &gt; 1-ը նշանակում է ինքնուրույն աճ</li><li><b>Growth accounting</b>՝ New + Resurrected − Churned = Net growth</li><li>Օպտիմալացման կարգը՝ սկզբում retention, հետո activation, վերջում acquisition (ծակ դույլի մեջ ջուր մի լցրու)</li></ul>`}
  ],
  practice:{t:"Growth model և փորձարկման պլան", steps:["Գծիր capstone-ի AARRR funnel-ը՝ յուրաքանչյուր քայլի metric-ով","Նկարագրիր մեկ growth loop","Ընտրիր մոնետիզացիայի մոդել և 3 գնային տարբերակ (decoy effect-ով)","Գրիր 5 աճի հիպոթեզ և դասավորիր ICE-ով","Մանրամասն նկարագրիր մեկ A/B test՝ հիպոթեզ, metric, guardrail, տևողություն"], deliverable:"Funnel, growth loop, pricing, experiment backlog"},
  quiz:[
    ["Hook Model-ի ո՞ր փուլն է, երբ օգտատերը ներդնում է տվյալներ կամ ժամանակ։",["Trigger","Action","Variable reward","Investment"],3,"Investment-ը մեծացնում է հաջորդ վերադարձի հավանականությունը։"],
